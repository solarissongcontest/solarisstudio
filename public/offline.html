<!doctype html>
<html lang="en">
<head>

    h1 { margin: 0; font-size: clamp(28px, 8vw, 38px); line-height: 1.05; }
    p { margin: 14px auto 0; max-width: 35ch; color: #b7c3d8; line-height: 1.6; }
    button { margin-top: 24px; min-height: 46px; border: 1px solid rgba(255,255,255,.18); border-radius: 15px; background: rgba(255,255,255,.09); color: #fff; padding: 0 18px; font: inherit; font-weight: 750; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png?v=img2340-20260929" alt="" />
