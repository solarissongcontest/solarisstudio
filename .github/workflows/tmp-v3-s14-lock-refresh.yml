name: Temporary S14 lockfile refresh

on:
  push:
    branches:
      - v3/sys-s9-s10-observability-review-fix-20261021
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: v3/sys-s9-s10-observability-review-fix-20261021

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Regenerate lockfile only
        run: bun install --lockfile-only

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lockfile for Playwright"
          git push origin HEAD:v3/sys-s9-s10-observability-review-fix-20261021
