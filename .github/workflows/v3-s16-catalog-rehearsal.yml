name: V3 S16 effective catalog correctness
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/v3-s16*"
      - "scripts/*v3-s16*"
      - "supabase/migrations/**"
      - ".github/scripts/v3-s16-catalog-rehearsal.sh"
      - ".github/scripts/v3-start-disposable-supabase.sh"
      - ".github/scripts/prepare-archive-local-config.py"
      - ".github/workflows/v3-s16-catalog-rehearsal.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s16-catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  catalog-correctness:
    name: S16 catalog correctness (${{ matrix.baseline }}) — not release certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        baseline: [candidate, current-main]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: bun install --frozen-lockfile
      - name: Prepare owned disposable database worktree
        env:
          BASELINE: ${{ matrix.baseline }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/s16-catalog-db"
          baseline_sha="$(git rev-parse HEAD)"
          if [[ "$BASELINE" == current-main ]]; then
            git fetch origin main --no-tags
            baseline_sha="$(git rev-parse origin/main)"
          fi
          git worktree add "$runtime" "$baseline_sha"
          echo "V3_S16_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "V3_S16_SOURCE_SHA=$baseline_sha" >> "$GITHUB_ENV"
          # Supabase local startup/reset may rewrite tracked runtime config.
          # Keep the exact-SHA source tree separate from the database worktree.
          if [[ "$BASELINE" == current-main ]]; then
            source_dir="$RUNNER_TEMP/s16-catalog-source"
            git worktree add "$source_dir" "$baseline_sha"
            echo "V3_S16_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
            (cd "$source_dir" && bun install --frozen-lockfile)
          fi
          cd "$runtime"
          GITHUB_JOB="${GITHUB_JOB}-${BASELINE}" bash .github/scripts/v3-start-disposable-supabase.sh
          supabase db reset --local --no-seed
          # Do not import candidate migrations into the current-main baseline.
      - name: Verify real catalog semantics and retain unresolved authority evidence
        env:
          BASELINE: ${{ matrix.baseline }}
        run: |
          set -euo pipefail
          if [[ "$BASELINE" == current-main ]]; then
            # Execute the original main audit implementation and its exact
            # source/migration set against the main-only disposable database.
            : "${V3_S16_SOURCE_DIR:?Clean exact-main source worktree is required}"
            [[ "$(git -C "$V3_S16_SOURCE_DIR" rev-parse HEAD)" == "$V3_S16_SOURCE_SHA" ]] || { echo 'S16 source SHA mismatch' >&2; exit 1; }
            [[ "$(git -C "$V3_S16_RUNTIME_DIR" rev-parse HEAD)" == "$V3_S16_SOURCE_SHA" ]] || { echo 'S16 runtime SHA mismatch' >&2; exit 1; }
            (cd "$V3_S16_SOURCE_DIR" && bash .github/scripts/v3-s16-catalog-rehearsal.sh)
            mkdir -p v3-release-preflight/s16 v3-release-preflight/static v3-release-evidence
            cp "$V3_S16_SOURCE_DIR/v3-release-preflight/s16/"* v3-release-preflight/s16/
            cp "$V3_S16_SOURCE_DIR/v3-release-preflight/static/s16-mutation-authority.json" v3-release-preflight/static/
            cp "$V3_S16_SOURCE_DIR/v3-release-evidence/s16-mutation-authority.json" v3-release-evidence/
          else
            bash .github/scripts/v3-s16-catalog-rehearsal.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s16-catalog-${{ matrix.baseline }}-${{ env.V3_S16_SOURCE_SHA }}
          path: |
            v3-release-preflight/s16/
            v3-release-preflight/static/s16-mutation-authority.json
            v3-release-evidence/s16-mutation-authority.json
          if-no-files-found: warn
      - name: Stop only the owned local stack
        if: always()
        run: |
          if [[ -n "${V3_S16_RUNTIME_DIR:-}" && -d "$V3_S16_RUNTIME_DIR" ]]; then
            cd "$V3_S16_RUNTIME_DIR"
            supabase stop --no-backup
          fi
