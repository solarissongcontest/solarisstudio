name: V3 real app preview

on:
  push:
    branches:
      - v3/live-real-app-update
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-real-app-preview
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 2af381c24fdf56cbbae4214a99dfada5
  PREVIEW_URL: https://pr1872-v3-studio.solaris-song-contest.workers.dev

jobs:
  preview:
    name: Upload protected real-app preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact #1872 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the real Solaris Studio application
        run: bun run build

      - name: Preserve the client performance budget
        run: bun run budget:client

      - name: Require Cloudflare upload credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured for repository Actions."
            exit 1
          fi

      - name: Snapshot the active production deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler@4.141.0 deployments list --name studio --json > /tmp/solaris-production-before.json
          test -s /tmp/solaris-production-before.json

      - name: Upload #1872 as a non-production Worker version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler@4.141.0 versions upload \
            --name studio \
            --preview-alias pr1872-v3 \
            --message "PR #1872 ${GITHUB_SHA}" \
            --keep-vars \
            2>&1 | tee /tmp/solaris-preview-upload.txt

          echo "Expected stable Version URL: ${PREVIEW_URL}"

      - name: Prove production traffic was not changed
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler@4.141.0 deployments list --name studio --json > /tmp/solaris-production-after.json
          if ! cmp -s /tmp/solaris-production-before.json /tmp/solaris-production-after.json; then
            echo "::error::The active Worker deployment changed during a preview-only upload. Refusing to treat this as a safe preview."
            diff -u /tmp/solaris-production-before.json /tmp/solaris-production-after.json || true
            exit 1
          fi

      - name: Record exact uploaded Worker version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler@4.141.0 versions list --name studio --json > /tmp/solaris-worker-versions.json
          if ! grep -Fq "$GITHUB_SHA" /tmp/solaris-worker-versions.json; then
            echo "::warning::The versions listing did not expose the Git SHA message verbatim; the upload transcript remains authoritative for this run."
          fi

      - name: Verify protected preview gate
        shell: bash
        run: |
          set -euo pipefail

          root_status="$(curl --silent --show-error --output /tmp/solaris-preview-root.html --write-out '%{http_code}' "${PREVIEW_URL}/")"
          if [ "$root_status" != "503" ]; then
            echo "::error::Unauthenticated preview root returned HTTP ${root_status}; expected maintenance HTTP 503."
            exit 1
          fi

          admin_status="$(curl --silent --show-error --output /tmp/solaris-preview-admin.html --write-out '%{http_code}' "${PREVIEW_URL}/__maintenance-admin")"
          if [ "$admin_status" != "200" ]; then
            echo "::error::Maintenance-admin preview gate returned HTTP ${admin_status}; expected 200."
            cat /tmp/solaris-preview-admin.html || true
            exit 1
          fi

          if grep -Fq "not configured on this deployment" /tmp/solaris-preview-admin.html; then
            echo "::error::The preview did not inherit the server-only maintenance-admin secret."
            exit 1
          fi

          if ! grep -Fq "Maintenance access" /tmp/solaris-preview-admin.html; then
            echo "::error::The preview admin route is not the canonical signed maintenance gate."
            exit 1
          fi

      - name: Preview summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Solaris Studio V3 real-app preview"
            echo
            echo "- Exact Git SHA: \`${GITHUB_SHA}\`"
            echo "- Worker: \`studio\`"
            echo "- Stable alias: \`pr1872-v3\`"
            echo "- Preview URL: ${PREVIEW_URL}"
            echo "- Owner access: ${PREVIEW_URL}/__maintenance-admin"
            echo "- Upload mode: Worker version only; no production deployment command is used"
            echo "- Normal preview visitors remain behind global maintenance"
            echo "- The canonical signed maintenance-admin bypass remains GET/HEAD-only"
          } >> "$GITHUB_STEP_SUMMARY"
