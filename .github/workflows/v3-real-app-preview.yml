name: V3 real app preview

on:
  push:
    branches:
      - v3/live-real-app-update
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-real-app-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy protected real-app preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact #1872 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare protected read-only preview source
        run: bun run scripts/prepare-v3-real-app-preview.mjs

      - name: Build the real Solaris Studio application
        env:
          VITE_SOLARIS_V3_PREVIEW_READ_ONLY: "true"
        run: bun run build

      - name: Preserve the client performance budget
        run: bun run budget:client

      - name: Deploy to an isolated temporary Cloudflare account
        id: deploy
        shell: bash
        env:
          WRANGLER_LOG: debug
        run: |
          set -euo pipefail
          raw_log="$RUNNER_TEMP/wrangler-preview-raw.log"
          safe_log="$RUNNER_TEMP/wrangler-preview-debug.log"

          set +e
          bunx wrangler@4.141.0 deploy \
            --temporary \
            --config wrangler.v3-preview.jsonc \
            --message "Solaris Studio V3 PR #1872 ${GITHUB_SHA}" \
            > "$raw_log" 2>&1
          deploy_status=$?
          set -e

          # Temporary-account claim URLs are bearer credentials. Preserve the
          # complete Wrangler diagnostic while stripping claim/auth material
          # before anything reaches Actions logs or artifacts.
          sed -E \
            -e 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#<claim-url-redacted>#g' \
            -e 's#(claimToken=)[^&[:space:]]+#\1<redacted>#g' \
            -e 's#(Authorization: Bearer )[A-Za-z0-9._~-]+#\1<redacted>#Ig' \
            "$raw_log" > "$safe_log"
          cat "$safe_log"

          if [ "$deploy_status" -ne 0 ]; then
            echo "::error::Temporary Cloudflare preview deployment failed with exit code $deploy_status."
            exit "$deploy_status"
          fi

          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$safe_log" | tail -n 1)"
          if [ -z "$preview_url" ]; then
            echo "::error::Cloudflare deployment succeeded but no workers.dev preview URL was found."
            exit 1
          fi

          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          {
            echo "preview_url=$preview_url"
            echo "git_sha=$GITHUB_SHA"
          } > preview-address.txt

      - name: Upload sanitized Wrangler diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-preview-debug
          path: ${{ runner.temp }}/wrangler-preview-debug.log
          if-no-files-found: warn
          retention-days: 1

      - name: Verify preview access protection
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header /tmp/preview-headers.txt \
            --output /tmp/preview-body.txt "$PREVIEW_URL/" || true

          status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' /tmp/preview-headers.txt)"
          if [ "$status" != "401" ]; then
            echo "::error::Unauthenticated preview returned HTTP ${status:-unknown}; expected 401."
            exit 1
          fi
          if ! grep -Eiq '^www-authenticate: Basic realm="Solaris Studio V3 preview"' /tmp/preview-headers.txt; then
            echo "::error::Preview did not expose the canonical server-side Basic-auth challenge."
            exit 1
          fi

      - name: Verify production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          production_status="$(curl --silent --show-error --output /tmp/production-root.html --write-out '%{http_code}' https://studio.solaris-song-contest.workers.dev/)"
          if [ "$production_status" != "503" ]; then
            echo "::error::Production maintenance root returned HTTP $production_status; expected 503."
            exit 1
          fi

      - name: Upload non-sensitive preview address
        uses: actions/upload-artifact@v4
        with:
          name: v3-real-app-preview-address
          path: preview-address.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preview summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Solaris Studio V3 real-app preview"
            echo
            echo "- Exact Git SHA: \`${GITHUB_SHA}\`"
            if [ -n "${PREVIEW_URL:-}" ]; then
              echo "- Protected preview URL: ${PREVIEW_URL}"
            fi
            echo "- Hosting: isolated Cloudflare temporary preview account"
            echo "- Production Worker: untouched"
            echo "- Production maintenance: still enabled"
            echo "- Access: server-side HTTP Basic auth"
            echo "- Preview Worker accepts only GET/HEAD requests"
            echo "- Browser Supabase transport rejects non-GET/HEAD requests"
            echo "- No production Supabase migration, reset, fixture write or mutation is performed"
          } >> "$GITHUB_STEP_SUMMARY"
