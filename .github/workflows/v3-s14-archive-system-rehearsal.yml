name: V3 S14 Archive System rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s14-archive-system-rehearsal.sh"
      - ".github/scripts/v3-s14-archive-guard-rehearsal.sh"
      - ".github/scripts/v3-s14-edition-event-vocabulary-rehearsal.sh"
      - ".github/scripts/v3-s14-archive-task-resurrection-rehearsal.sh"
      - ".github/workflows/v3-s14-archive-system-rehearsal.yml"
      - "src/lib/solaris-v6-domain-registry.ts"
      - "src/lib/v3-domain-consequence-registry.ts"
      - "src/lib/v3-projection-reconciliation-registry.ts"
      - "src/lib/v3-system-s1-registry.test.ts"
      - "src/lib/v3-s14-archive-consequences.contract.test.ts"
      - "src/lib/v3-s14-archive-registry.contract.test.ts"
      - "src/lib/v3-s14-archive-task-registry-alignment.contract.test.ts"
      - "src/lib/v3-s14-resolved-task-notification-invariant.contract.test.ts"
      - "src/lib/v3-s14-transition-http409.contract.test.ts"
      - "src/lib/v3-edition-transition-client.ts"
      - "src/lib/v3-edition-transition-client.test.ts"
      - "src/lib/studio2-control-room.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-archive-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + S14 archive system
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild from complete migration chain
        run: supabase db reset --local --no-seed

      - name: Rehearse final-publication reconciliation and Archive consequences
        run: bash .github/scripts/v3-s14-archive-system-rehearsal.sh

      - name: Verify canonical edition transition event vocabulary
        run: bash .github/scripts/v3-s14-edition-event-vocabulary-rehearsal.sh

      - name: Rehearse Archive authorization and lifecycle guards
        run: bash .github/scripts/v3-s14-archive-guard-rehearsal.sh

      - name: Rehearse archived task and notification non-resurrection invariants
        run: bash .github/scripts/v3-s14-archive-task-resurrection-rehearsal.sh

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + S14 archive system
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s14-main origin/main

      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-main
          supabase start
          supabase db reset --local --no-seed

      - name: Apply only the S14 feature migration delta
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            20261019112100_v3_s14_archive_consequence_reconciliation.sql \
            20261019112200_v3_s14_final_results_readiness_hardening.sql \
            20261019112300_v3_s14_transition_http409.sql \
            20261019112400_v3_s14_archive_task_registry_alignment.sql \
            20261019112500_v3_s14_resolved_task_notification_invariant.sql \
            20261019202636_v3_s14_resolved_task_delivery_reconciliation.sql
          do
            cp \
              "$GITHUB_WORKSPACE/supabase/migrations/$migration" \
              "/tmp/solaris-s14-main/supabase/migrations/$migration"
          done
          cd /tmp/solaris-s14-main
          # These feature migrations intentionally sort before newer migrations
          # already present on current main. Supabase CLI requires --include-all
          # to apply unapplied historical versions in this upgrade rehearsal.
          supabase migration up --local --include-all

      - name: Rehearse S14 after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s14-archive-system-rehearsal.sh"

      - name: Verify transition event vocabulary after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s14-edition-event-vocabulary-rehearsal.sh"

      - name: Rehearse Archive guards after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s14-archive-guard-rehearsal.sh"

      - name: Rehearse task and notification non-resurrection after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s14-archive-task-resurrection-rehearsal.sh"

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-s14-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
