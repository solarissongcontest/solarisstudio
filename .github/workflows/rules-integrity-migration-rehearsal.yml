name: Rules + Integrity migration rehearsal

on:
  pull_request:
    branches:
      - main
      - audit/pr450-base-snapshot
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/integrity-evidence-download/**"
      - "supabase/functions/integrity-evidence-lifecycle/**"
      - "src/routes/_authenticated/admin/integrity*.tsx"
      - ".github/scripts/rules-integrity-security-rehearsal.sh"
      - ".github/scripts/run-rules-integrity-security-rehearsal.sh"
      - ".github/scripts/pr450-deadline-scope-rehearsal.sh"
      - ".github/scripts/v3-confirmation-security-rehearsal.sh"
      - ".github/scripts/v3-s3-confirmation-invariants-rehearsal.sh"
      - ".github/scripts/v3-s3-entry-invariants-rehearsal.sh"
      - ".github/scripts/v3-s3-media-invariants-rehearsal.sh"
      - ".github/scripts/v3-s3-jury-invariants-rehearsal.sh"
      - ".github/scripts/v3-s3-televote-invariants-rehearsal.sh"
      - ".github/scripts/v3-s3-results-invariants-rehearsal.sh"
      - ".github/scripts/v3-s3-publication-invariants-rehearsal.sh"
      - ".github/scripts/v3-entry-receipt-security-rehearsal.sh"
      - ".github/scripts/v3-jury-security-rehearsal.sh"
      - ".github/scripts/v3-televote-reconciliation-rehearsal.sh"
      - ".github/scripts/v3-entry-legacy-upgrade-rehearsal.sh"
      - ".github/scripts/v3-entry-restore-provenance-assert.sh"
      - ".github/scripts/v3-operation-receipt-rehearsal.sh"
      - ".github/workflows/rules-integrity-migration-rehearsal.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current-main candidate SHA for release-grade migration evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migration-rehearsal-${{ github.workflow }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  V3_MIGRATION_SOURCE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  clean-replay:
    name: Clean migration replay + hostile security
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact feature/candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V3_MIGRATION_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$V3_MIGRATION_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Migration rehearsal source must be one exact 40-character SHA"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Migration rehearsal checked out $actual, expected $expected"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin main --no-tags
            main_sha="$(git rev-parse origin/main | tr '[:upper:]' '[:lower:]')"
            if [ "$main_sha" != "$expected" ]; then
              echo "::error::Release-grade migration dispatch must target current main: candidate=$expected main=$main_sha"
              exit 1
            fi
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Rebuild clean local database from migrations
        run: supabase db reset --local --no-seed

      - name: Verify local migration history
        run: supabase migration list --local

      - name: Prove System V3 operation receipt semantics
        shell: bash
        run: bash .github/scripts/v3-operation-receipt-rehearsal.sh

      - name: Prove System V3 Entry correction operation
        shell: bash
        run: bash .github/scripts/v3-s2-entry-correction-rehearsal.sh

      - name: Run live Rules and Integrity adversarial rehearsal
        shell: bash
        run: bash .github/scripts/run-rules-integrity-security-rehearsal.sh

      - name: Verify show-scoped Organizer reminder authorization
        shell: bash
        run: bash .github/scripts/pr450-deadline-scope-rehearsal.sh

      - name: Run hostile V3 Confirmation authority rehearsal
        shell: bash
        run: bash .github/scripts/v3-confirmation-security-rehearsal.sh

      - name: Prove System V3 S3 Confirmation invariants
        shell: bash
        run: bash .github/scripts/v3-s3-confirmation-invariants-rehearsal.sh

      - name: Prove System V3 S3 Entry invariants
        shell: bash
        run: bash .github/scripts/v3-s3-entry-invariants-rehearsal.sh

      - name: Prove System V3 S3 Media invariants
        shell: bash
        run: bash .github/scripts/v3-s3-media-invariants-rehearsal.sh

      - name: Verify V3 Entry receipt authority
        shell: bash
        run: bash .github/scripts/v3-entry-receipt-security-rehearsal.sh

      - name: Verify immutable Entry restore provenance
        shell: bash
        run: bash .github/scripts/v3-entry-restore-provenance-assert.sh

      - name: Verify exact-ballot Televote receipt authority
        run: bash .github/scripts/v3-televote-reconciliation-rehearsal.sh

      - name: Run hostile V3 Jury reliability rehearsal
        shell: bash
        run: bash .github/scripts/v3-jury-security-rehearsal.sh

      - name: Prove System V3 S3 Jury invariants
        shell: bash
        run: bash .github/scripts/v3-s3-jury-invariants-rehearsal.sh

      - name: Prove System V3 S3 Televote invariants
        shell: bash
        run: bash .github/scripts/v3-s3-televote-invariants-rehearsal.sh

      - name: Prove System V3 S3 Results invariants
        shell: bash
        run: bash .github/scripts/v3-s3-results-invariants-rehearsal.sh

      - name: Prove System V3 S3 Publication invariants
        shell: bash
        run: bash .github/scripts/v3-s3-publication-invariants-rehearsal.sh

      - name: Print local Evidence Edge Function log on failure
        if: failure()
        run: tail -n 300 /tmp/rules-integrity-functions.log || true

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Upgrade current main database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature/candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V3_MIGRATION_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$V3_MIGRATION_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]] || [ "$actual" != "$expected" ]; then
            echo "::error::Upgrade rehearsal source identity mismatch: actual=$actual expected=$expected"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin main --no-tags
            main_sha="$(git rev-parse origin/main | tr '[:upper:]' '[:lower:]')"
            if [ "$main_sha" != "$expected" ]; then
              echo "::error::Release-grade migration dispatch must target current main: candidate=$expected main=$main_sha"
              exit 1
            fi
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Prepare current main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-main origin/main

      - name: Verify current main is an unmodified baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C /tmp/solaris-main status --porcelain --untracked-files=all)"
          test -f "/tmp/solaris-main/supabase/migrations/20260822204600_result_driven_qualifier_sync.sql"
          test ! -e "/tmp/solaris-main/supabase/migrations/20260822204500_result_driven_qualifier_sync.sql"

      - name: Build current main database locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-main
          supabase start
          supabase db reset --local --no-seed
          supabase migration list --local

      - name: Seed a legacy accepted entry before upgrade
        run: |
          cd /tmp/solaris-main
          if [[ ! -f supabase/migrations/20261014030000_v3_entry_review_binding.sql ]]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/v3-entry-legacy-upgrade-rehearsal.sh" --seed
            touch /tmp/v3-entry-legacy-seeded
          fi

      - name: Apply feature migration set as an upgrade
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete "$GITHUB_WORKSPACE/supabase/migrations/" /tmp/solaris-main/supabase/migrations/
          cd /tmp/solaris-main
          supabase migration up --local --include-all
          supabase migration list --local

      - name: Verify legacy Entry observations do not fabricate approval evidence
        run: |
          cd /tmp/solaris-main
          if [[ -f /tmp/v3-entry-legacy-seeded ]]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/v3-entry-legacy-upgrade-rehearsal.sh"
          fi

      - name: Prove System V3 operation receipt semantics after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-operation-receipt-rehearsal.sh"

      - name: Prove System V3 Entry correction operation after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s2-entry-correction-rehearsal.sh"

      - name: Verify show-scoped reminder authorization after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/pr450-deadline-scope-rehearsal.sh"

      - name: Run hostile V3 Confirmation authority rehearsal after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-confirmation-security-rehearsal.sh"

      - name: Prove System V3 S3 Confirmation invariants after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s3-confirmation-invariants-rehearsal.sh"

      - name: Prove System V3 S3 Entry invariants after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s3-entry-invariants-rehearsal.sh"

      - name: Prove System V3 S3 Media invariants after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s3-media-invariants-rehearsal.sh"

      - name: Verify V3 Entry receipt authority after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-entry-receipt-security-rehearsal.sh"

      - name: Verify immutable Entry restore provenance after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-entry-restore-provenance-assert.sh"

      - name: Verify Televote receipt authority after upgrade
        run: bash .github/scripts/v3-televote-reconciliation-rehearsal.sh

      - name: Run hostile V3 Jury reliability rehearsal after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-jury-security-rehearsal.sh"

      - name: Prove System V3 S3 Jury invariants after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s3-jury-invariants-rehearsal.sh"

      - name: Prove System V3 S3 Televote invariants after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s3-televote-invariants-rehearsal.sh"

      - name: Prove System V3 S3 Results invariants after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s3-results-invariants-rehearsal.sh"

      - name: Prove System V3 S3 Publication invariants after upgrade
        shell: bash
        run: |
          cd /tmp/solaris-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s3-publication-invariants-rehearsal.sh"

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-main 2>/dev/null || exit 0
          supabase stop --no-backup || true

  exact-sha-evidence:
    name: Exact-SHA migration rehearsal evidence
    if: always()
    needs:
      - clean-replay
      - upgrade-from-main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact attested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V3_MIGRATION_SOURCE_SHA }}
          fetch-depth: 1

      - name: Build exact-SHA migration evidence
        shell: bash
        env:
          CLEAN_REPLAY_RESULT: ${{ needs.clean-replay.result }}
          UPGRADE_RESULT: ${{ needs.upgrade-from-main.result }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$V3_MIGRATION_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Migration evidence checkout is $actual, expected $expected"
            exit 1
          fi
          mkdir -p v3-s16-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          clean = os.environ["CLEAN_REPLAY_RESULT"]
          upgrade = os.environ["UPGRADE_RESULT"]
          sha = os.environ["V3_MIGRATION_SOURCE_SHA"].lower()
          passed = clean == "success" and upgrade == "success"
          payload = {
              "schemaVersion": 1,
              "candidateSha": sha,
              "passed": passed,
              "checks": [
                  "clean-local-migration-replay",
                  "local-migration-history",
                  "hostile-security-rehearsals",
                  "system-invariant-rehearsals",
                  "upgrade-from-current-main",
              ],
              "jobs": {
                  "cleanReplay": clean,
                  "upgradeFromMain": upgrade,
              },
              "provenance": {
                  "workflow": "Rules + Integrity migration rehearsal",
                  "runId": int(os.environ["GITHUB_RUN_ID"]),
                  "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "event": os.environ["GITHUB_EVENT_NAME"],
                  "conclusion": "success" if passed else "failure",
              },
          }
          Path("v3-s16-evidence/s16-migration-rehearsal.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-SHA migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-s16-migration-rehearsal-${{ env.V3_MIGRATION_SOURCE_SHA }}
          path: v3-s16-evidence/s16-migration-rehearsal.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail if either canonical migration path failed
        if: needs.clean-replay.result != 'success' || needs.upgrade-from-main.result != 'success'
        run: exit 1
