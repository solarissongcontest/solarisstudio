name: V3 S5 Results consequence rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s5-results-consequences-rehearsal.sh"
      - ".github/workflows/v3-s5-results-consequences-rehearsal.yml"
      - "src/lib/v3-s5-results-consequences.test.ts"
      - "src/lib/v3-domain-consequence-registry.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s5-results-consequences-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + Results consequences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild from complete migration chain
        run: supabase db reset --local --no-seed

      - name: Rehearse Results lifecycle consequences
        run: bash .github/scripts/v3-s5-results-consequences-rehearsal.sh

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + Results consequences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-results-main origin/main

      - name: Isolate disposable Inbucket web port
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-results-main
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("supabase/config.toml")
          text = path.read_text()
          section = re.search(r"(?ms)^\[inbucket\]\s*\n(.*?)(?=^\[|\Z)", text)

          if section:
              block = section.group(0)
              if re.search(r"(?m)^port\s*=", block):
                  replacement = re.sub(r"(?m)^port\s*=.*$", "port = 55324", block, count=1)
              else:
                  header_end = block.find("\n") + 1
                  replacement = block[:header_end] + "port = 55324\n" + block[header_end:]
              text = text[:section.start()] + replacement + text[section.end():]
          else:
              text = text.rstrip() + "\n\n[inbucket]\nport = 55324\n"

          path.write_text(text)
          PY
          echo "Disposable current-main Inbucket port override:"
          sed -n '/^\[inbucket\]/,/^\[/p' supabase/config.toml | head -8

      - name: Diagnose local port ownership before upgrade start
        shell: bash
        run: |
          set -euo pipefail
          echo "Listeners on the default and isolated Inbucket ports before supabase start:"
          ss -ltnp | grep -E ':(54324|55324)[[:space:]]' || true
          echo "Running Docker containers before supabase start:"
          docker ps --format '{{.ID}} {{.Names}} {{.Ports}}' || true

      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-results-main
          supabase start
          supabase db reset --local --no-seed

      - name: Apply additive feature migration delta
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-copy-migration-delta.sh" "$GITHUB_WORKSPACE" /tmp/solaris-results-main
          cd /tmp/solaris-results-main
          supabase migration up --local --include-all

      - name: Rehearse Results consequences after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-results-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s5-results-consequences-rehearsal.sh"

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-results-main 2>/dev/null || exit 0
          supabase stop --no-backup || true