name: V3 navbar canonical CSS patch

on:
  push:
    branches: [v3/navbar-complete-redesign]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3/navbar-complete-redesign
          fetch-depth: 0
      - name: Patch canonical installed-app tabbar owner
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/styles/app-shell.css')
          css = path.read_text()

          replacements = {
            '  --solaris-app-tabbar-height: 4.7rem;\n  --solaris-app-tabbar-collapsed-height: 3.25rem;\n  --solaris-app-tabbar-max-height: 5.35rem;':
            '  --solaris-app-tabbar-height: 4rem;\n  --solaris-app-tabbar-collapsed-height: 3.4rem;\n  --solaris-app-tabbar-max-height: 4.6rem;',
            '    left: max(.65rem, var(--solaris-app-safe-left));\n    right: max(.65rem, var(--solaris-app-safe-right));\n    bottom: max(.45rem, var(--solaris-app-safe-bottom));':
            '    left: max(1.5rem, var(--solaris-app-safe-left));\n    right: max(1.5rem, var(--solaris-app-safe-right));\n    bottom: max(.65rem, var(--solaris-app-safe-bottom));',
            '    --solaris-tab-pad: .38rem;\n    --solaris-tab-total-inset: .76rem;\n    --solaris-tab-gap: .15rem;':
            '    --solaris-tab-pad: .25rem;\n    --solaris-tab-total-inset: .5rem;\n    --solaris-tab-gap: .125rem;',
            '    width: min(40rem, 100%);':
            '    width: min(21.375rem, 100%);',
            '    border-radius: calc(1.55rem + var(--solaris-tabbar-pull-radius));':
            '    border-radius: calc(2rem + var(--solaris-tabbar-pull-radius));',
            '    border: 1px solid rgb(255 255 255 / .18);\n    border-radius: inherit;\n    background:\n      linear-gradient(\n        145deg,\n        rgb(255 255 255 / .085),\n        rgb(255 255 255 / .026) 46%,\n        rgb(245 252 255 / .05)\n      );\n    box-shadow:\n      0 10px 28px rgb(0 4 22 / .07),\n      inset 0 1px 0 rgb(255 255 255 / .14),\n      inset 0 -1px 0 rgb(200 235 247 / .035);':
            '    border: 1px solid rgb(255 255 255 / .24);\n    border-radius: inherit;\n    background:\n      radial-gradient(circle at 18% 0%, rgb(255 255 255 / .16), transparent 42%),\n      linear-gradient(145deg, rgb(230 247 253 / .13), rgb(92 164 197 / .055) 48%, rgb(223 245 252 / .09));\n    box-shadow:\n      0 12px 30px rgb(0 4 22 / .16),\n      inset 0 1px 0 rgb(255 255 255 / .26),\n      inset 0 -1px 0 rgb(169 222 242 / .08);',
            '    left: var(--solaris-tab-pad);\n    width: calc((100% - var(--solaris-tab-total-inset) - .6rem) / 5);\n    height: 3.7rem;\n    border: 0;\n    border-radius: 1.08rem;\n    background: rgb(238 241 245 / .075);\n    box-shadow: none;\n    -webkit-backdrop-filter: none !important;\n    backdrop-filter: none !important;':
            '    left: calc(var(--solaris-tab-pad) + .42rem);\n    width: calc((100% - var(--solaris-tab-total-inset) - .5rem) / 5 - .84rem);\n    height: 2.9rem;\n    border: 1px solid rgb(255 255 255 / .24);\n    border-radius: 1.3rem;\n    background:\n      linear-gradient(145deg, rgb(250 254 255 / .19), rgb(150 212 235 / .075) 58%, rgb(244 252 255 / .12));\n    box-shadow:\n      0 5px 18px rgb(0 4 22 / .11),\n      inset 0 1px 0 rgb(255 255 255 / .34),\n      inset 0 -1px 0 rgb(158 215 237 / .12);\n    -webkit-backdrop-filter: blur(16px) saturate(1.22) brightness(1.08);\n    backdrop-filter: blur(16px) saturate(1.22) brightness(1.08);',
            '      translateX(calc(100% + .15rem + var(--solaris-tab-drag-x)))':
            '      translateX(calc(100% + .965rem + var(--solaris-tab-drag-x)))',
            '      translateX(calc(200% + .30rem + var(--solaris-tab-drag-x)))':
            '      translateX(calc(200% + 1.93rem + var(--solaris-tab-drag-x)))',
            '      translateX(calc(300% + .45rem + var(--solaris-tab-drag-x)))':
            '      translateX(calc(300% + 2.895rem + var(--solaris-tab-drag-x)))',
            '      translateX(calc(400% + .60rem + var(--solaris-tab-drag-x)))':
            '      translateX(calc(400% + 3.86rem + var(--solaris-tab-drag-x)))',
            '    background: rgb(241 244 247 / .095);':
            '    background: linear-gradient(145deg, rgb(255 255 255 / .24), rgb(142 211 237 / .11));',
            '    min-height: 3.7rem;\n    align-items: center;\n    justify-content: center;\n    flex-direction: column;\n    gap: .22rem;\n    border-radius: 1.15rem;\n    color: var(--muted-foreground);\n    font-size: .64rem;':
            '    min-height: 3.25rem;\n    align-items: center;\n    justify-content: center;\n    flex-direction: column;\n    gap: .14rem;\n    border-radius: 1.15rem;\n    color: var(--muted-foreground);\n    font-size: .6rem;',
            '    --solaris-tab-pad: .24rem;\n    --solaris-tab-total-inset: .48rem;\n    width: min(24rem, calc(100% - 2.4rem));\n    height: var(--solaris-app-tabbar-collapsed-height);\n    min-height: 0;\n    max-height: var(--solaris-app-tabbar-collapsed-height);\n    padding: var(--solaris-tab-pad);\n    border-radius: 1.3rem;':
            '    --solaris-tab-pad: .2rem;\n    --solaris-tab-total-inset: .4rem;\n    width: min(19.25rem, calc(100% - 2.1rem));\n    height: var(--solaris-app-tabbar-collapsed-height);\n    min-height: 0;\n    max-height: var(--solaris-app-tabbar-collapsed-height);\n    padding: var(--solaris-tab-pad);\n    border-radius: 1.7rem;',
            '    height: 2.72rem;\n    border-radius: .95rem;':
            '    height: 2.55rem;\n    border-radius: 1.12rem;',
          }

          for old, new in replacements.items():
            count = css.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one canonical CSS match, got {count}: {old[:90]!r}')
            css = css.replace(old, new, 1)

          marker = '''@media (prefers-reduced-transparency: reduce) {\n  @media (display-mode: standalone), (display-mode: window-controls-overlay) {\n    .solaris-app-toolbar,\n    .solaris-app-tabbar-backdrop {\n      -webkit-backdrop-filter: none;\n      backdrop-filter: none;\n      background: rgb(5 18 41 / .98);\n    }\n  }\n}'''
          replacement = '''@media (prefers-reduced-transparency: reduce) {\n  @media (display-mode: standalone), (display-mode: window-controls-overlay) {\n    .solaris-app-toolbar,\n    .solaris-app-tabbar-backdrop {\n      -webkit-backdrop-filter: none;\n      backdrop-filter: none;\n      background: rgb(5 18 41 / .98);\n    }\n\n    .solaris-app-tab-indicator {\n      -webkit-backdrop-filter: none;\n      backdrop-filter: none;\n      background: rgb(20 39 67 / .96);\n    }\n  }\n}'''
          if css.count(marker) != 1:
            raise SystemExit('Reduced-transparency block did not match canonical source exactly')
          css = css.replace(marker, replacement, 1)

          required = {
            'expanded production width': '    width: min(21.375rem, 100%);',
            'mobile production inset': '    left: max(1.5rem, var(--solaris-app-safe-left));',
            'local selected lens': '    width: calc((100% - var(--solaris-tab-total-inset) - .5rem) / 5 - .84rem);',
            'collapsed production width': '    width: min(19.25rem, calc(100% - 2.1rem));',
          }
          for name, needle in required.items():
            if css.count(needle) != 1:
              raise SystemExit(f'Post-patch assertion failed for {name}: count={css.count(needle)}')

          path.write_text(css)
          PY

          git diff --check
          git diff -- src/styles/app-shell.css
          rm .github/workflows/v3-navbar-canonical-css-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles/app-shell.css .github/workflows/v3-navbar-canonical-css-patch.yml
          git commit -m '[V3-NAV] Cut over production AppTabBar geometry'
          git push origin HEAD:v3/navbar-complete-redesign
