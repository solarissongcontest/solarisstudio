name: V3 Public Result Snapshot Rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "scripts/rehearse-v3-public-result-snapshot.sh"
      - "src/lib/v3-public-published-result-snapshot.contract.test.ts"
      - ".github/workflows/v3-public-result-snapshot-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-public-result-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + exact published Result snapshot proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]] || {
            echo "Expected exact candidate $CANDIDATE_SHA, got $(git rev-parse HEAD)" >&2
            exit 1
          }

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local --no-seed

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Rehearse exact immutable published Result snapshot
        shell: bash
        run: bash scripts/rehearse-v3-public-result-snapshot.sh

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + exact published Result snapshot proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]] || {
            echo "Expected exact candidate $CANDIDATE_SHA, got $(git rev-parse HEAD)" >&2
            exit 1
          }

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-result-snapshot-main origin/main

      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-result-snapshot-main
          supabase start
          supabase db reset --local --no-seed

      - name: Apply exact branch migration delta
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-copy-migration-delta.sh" "$GITHUB_WORKSPACE" /tmp/solaris-result-snapshot-main
          cd /tmp/solaris-result-snapshot-main
          supabase migration up --local --include-all

      - name: Rehearse snapshot after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-result-snapshot-main
          bash "$GITHUB_WORKSPACE/scripts/rehearse-v3-public-result-snapshot.sh"

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-result-snapshot-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
