name: Client bundle budget evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-bundle-budget-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-bundle-budget:
    name: Client bundle budget evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Isolate bundle evidence from hosted Supabase
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "VITE_SUPABASE_URL=http://127.0.0.1:54321"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_bundle_ci_local_only"
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_PUBLISHABLE_KEY=sb_publishable_bundle_ci_local_only"
            echo "SUPABASE_PROJECT_ID=local"
            echo "SUPABASE_PROJECT_REF=local"
            echo "VITE_SUPABASE_PROJECT_ID=local"
            echo "VITE_SUPABASE_PROJECT_REF=local"
            echo "V3_VERIFICATION_TARGET=local"
          } >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify V3 production isolation
        run: bun run scripts/check-v3-production-isolation.ts

      - name: Verify budget report behavior
        run: bun test src/lib/client-bundle-budget.contract.test.ts

      - name: Production build
        run: bun run build

      - name: Enforce client performance budget
        id: client_budget_measure
        continue-on-error: true
        run: bun run budget:client

      - name: Validate client bundle budget report
        id: client_budget_report
        if: always()
        continue-on-error: true
        run: node scripts/validate-client-bundle-budget-report.mjs client-bundle-budget-report.json

      - name: Upload client bundle budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-bundle-budget-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: client-bundle-budget-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Re-assert original client budget result
        if: always()
        shell: bash
        env:
          BUDGET_OUTCOME: ${{ steps.client_budget_measure.outcome }}
          REPORT_OUTCOME: ${{ steps.client_budget_report.outcome }}
        run: |
          set -euo pipefail
          if [ "${REPORT_OUTCOME:-not-run}" != "success" ]; then
            echo "::error::Client bundle budget report validation outcome is ${REPORT_OUTCOME:-not-run}"
            exit 1
          fi
          if [ "${BUDGET_OUTCOME:-not-run}" != "success" ]; then
            echo "::error::Canonical client performance budget outcome is ${BUDGET_OUTCOME:-not-run}"
            exit 1
          fi
