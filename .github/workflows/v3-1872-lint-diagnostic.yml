name: V3 #1872 lint diagnostic

on:
  push:
    branches:
      - v3/live-real-app-update

permissions:
  contents: read

jobs:
  lint-diagnostic:
    name: Exact #1872 lint diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture exact lint diagnostic
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint-output.txt
          lint_status=${PIPESTATUS[0]}
          printf '%s\n' "$lint_status" > lint-status.txt

          bunx eslint . -f json > eslint-diagnostic.json 2> eslint-json-stderr.txt
          eslint_status=$?
          printf '%s\n' "$eslint_status" > eslint-json-status.txt
          exit 0

      - name: Emit machine-readable annotations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const data = JSON.parse(fs.readFileSync('eslint-diagnostic.json', 'utf8'));
          const diagnostics = [];
          for (const result of data) {
            const file = path.relative(process.cwd(), result.filePath).replaceAll('\\', '/');
            for (const message of result.messages ?? []) {
              const diagnostic = {
                file,
                line: message.line ?? 1,
                column: message.column ?? 1,
                endLine: message.endLine ?? message.line ?? 1,
                endColumn: message.endColumn ?? message.column ?? 1,
                severity: message.severity ?? 0,
                rule: message.ruleId ?? 'eslint',
                message: String(message.message ?? 'ESLint diagnostic'),
              };
              diagnostics.push(diagnostic);
              const command = diagnostic.severity === 2 ? 'error' : 'warning';
              const escaped = diagnostic.message
                .replaceAll('%', '%25')
                .replaceAll('\r', '%0D')
                .replaceAll('\n', '%0A');
              console.log(`::${command} file=${diagnostic.file},line=${diagnostic.line},col=${diagnostic.column},title=${diagnostic.rule}::${escaped}`);
            }
          }
          diagnostics.sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));
          fs.writeFileSync('eslint-diagnostics-normalized.json', JSON.stringify(diagnostics, null, 2) + '\n');
          console.log(`ESLint diagnostics: ${diagnostics.length}`);
          NODE

      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-1872-lint-diagnostic-${{ github.sha }}
          path: |
            lint-output.txt
            lint-status.txt
            eslint-diagnostic.json
            eslint-json-stderr.txt
            eslint-json-status.txt
            eslint-diagnostics-normalized.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce exact lint result
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat lint-status.txt)"
          if [ "$status" -ne 0 ]; then
            echo "Exact bun run lint failed with status $status"
            exit "$status"
          fi
