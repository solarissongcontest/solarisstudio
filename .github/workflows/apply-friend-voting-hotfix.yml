name: Apply Friend Voting advanced-routing hotfix

on:
  push:
    branches:
      - fix/friend-voting-advanced-routing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/friend-voting-advanced-routing
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Apply targeted Friend Voting fixes
        shell: python
        run: |
          from pathlib import Path

          functions_path = Path("src/integrations/televoting/intelligence.functions.ts")
          functions = functions_path.read_text()
          old_scope = 'return data.lens === "country" && !data.editionId && !data.hodPersonId && (data.channel === "combined" || data.channel === "televote");'
          new_scope = 'return data.lens === "country" && !data.editionId && !data.hodPersonId;'
          if old_scope not in functions:
              raise SystemExit("Expected all-editions historical-scope predicate not found")
          functions = functions.replace(old_scope, new_scope, 1)
          old_lightweight = 'const resilient = await getResilientFriendVotingIntelligence(data, { allowAdvanced: false });'
          new_lightweight = 'const resilient = await getResilientFriendVotingIntelligence(data, { allowAdvanced: true });'
          if functions.count(old_lightweight) != 1:
              raise SystemExit(f"Expected exactly one lightweight allowAdvanced:false call, found {functions.count(old_lightweight)}")
          functions = functions.replace(old_lightweight, new_lightweight, 1)
          functions_path.write_text(functions)

          model_path = Path("src/integrations/televoting/advanced-friend-voting.ts")
          model = model_path.read_text()
          anchor = '''function weightedAverageScore(\n  rows: AdvancedFriendVotingObservation[],\n  currentEditionNumber: number | null,\n  config: AdvancedFriendVotingConfig,\n  lifetime = false,\n) {\n  return weightedMean(rows.map((row) => ({\n    value: Number(row.score) || 0,\n    weight: rowWeight(row, currentEditionNumber, config, lifetime),\n  })));\n}\n'''
          replacement = '''function normalizedScore(row: AdvancedFriendVotingObservation) {\n  const score = Number(row.score) || 0;\n  const maxScore = Number(row.maxScore) || 0;\n  return maxScore > 0 ? clamp01(score / maxScore) : 0;\n}\n\nfunction weightedAverageScore(\n  rows: AdvancedFriendVotingObservation[],\n  currentEditionNumber: number | null,\n  config: AdvancedFriendVotingConfig,\n  lifetime = false,\n) {\n  return weightedMean(rows.map((row) => ({\n    value: normalizedScore(row),\n    weight: rowWeight(row, currentEditionNumber, config, lifetime),\n  })));\n}\n'''
          if anchor not in model:
              raise SystemExit("Expected weightedAverageScore implementation not found")
          model = model.replace(anchor, replacement, 1)
          raw_baseline = 'value: Number(row.score) || 0,'
          if model.count(raw_baseline) < 2:
              raise SystemExit("Expected raw baseline score vectors not found")
          model = model.replace(raw_baseline, 'value: normalizedScore(row),', 2)
          model_path.write_text(model)

          tests_path = Path("src/integrations/televoting/advanced-friend-voting.test.ts")
          tests = tests_path.read_text()
          marker = '\n});'
          if marker not in tests:
              raise SystemExit("Advanced model test describe terminator not found")
          scale_test = '''\n  it("normalizes historical deviation across different voting scales", () => {\n    const pair = [obs("3", 8, 10)];\n    const history = [obs("1", 8, 10), obs("2", 80, 100), ...pair];\n    const result = calculateAdvancedFriendVotingRisk(pair, history);\n    expect(result.historicalDeviationRisk).toBe(0);\n    expect(result.evidence.averageScore).toBeCloseTo(0.8, 6);\n    expect(result.evidence.expectedAverageScore).toBeCloseTo(0.8, 6);\n  });\n'''
          if 'normalizes historical deviation across different voting scales' not in tests:
              tests = tests.rsplit(marker, 1)[0] + scale_test + marker
          tests_path.write_text(tests)

          contract_path = Path("src/lib/friend-voting-safe-scope-contract.test.ts")
          contract = contract_path.read_text()
          if 'keeps later editions out of a selected-edition advanced baseline' not in contract:
              contract_test = '''\n\n  it("routes narrowed scopes to advanced analysis while keeping the all-editions country view historical", () => {\n    const code = source("integrations/televoting/intelligence.functions.ts");\n    expect(code).not.toContain("allowAdvanced: false");\n    expect(code).toContain('return data.lens === "country" && !data.editionId && !data.hodPersonId;');\n    expect(code).toContain("isHistoricalAllEditionsScope(effectiveScope)");\n  });\n\n  it("keeps later editions out of a selected-edition advanced baseline", () => {\n    const code = source("integrations/televoting/intelligence-v4.server.ts");\n    expect(code).toContain("const selectedEditionNumber = options.editionId ? editionNumber(options.editionId) : null;");\n    expect(code).toContain("return row.editionNumber < selectedEditionNumber;");\n    expect(code).toContain("const advancedAll = historicalScope.map(advanced);");\n  });\n'''
              contract = contract.rsplit('\n});', 1)[0] + contract_test + '\n});'
          contract_path.write_text(contract)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused regression tests
        run: bun test src/integrations/televoting/advanced-friend-voting.test.ts src/lib/friend-voting-safe-scope-contract.test.ts src/lib/friend-voting-default-scope-contract.test.ts

      - name: Generate route tree and production build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-friend-voting-hotfix.yml
          git config user.name "Solaris Studio automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/integrations/televoting/intelligence.functions.ts \
                  src/integrations/televoting/advanced-friend-voting.ts \
                  src/integrations/televoting/advanced-friend-voting.test.ts \
                  src/lib/friend-voting-safe-scope-contract.test.ts \
                  .github/workflows/apply-friend-voting-hotfix.yml
          git diff --cached --check
          git commit -m "Fix Friend Voting advanced routing and scale normalization"
          git push origin HEAD:fix/friend-voting-advanced-routing
