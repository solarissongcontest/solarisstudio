name: Temporary fast Browser Audit patch

on:
  push:
    branches:
      - fix/browser-audit-fast-main-certification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-audit-fast-main-certification
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/browser-audit.yml')
          workflow = workflow_path.read_text()

          lines = workflow.splitlines()
          group_index = next(
              (index for index, line in enumerate(lines)
               if line.strip().startswith('group: browser-audit-') and 'github.ref' in line),
              None,
          )
          if group_index is None:
              raise SystemExit('concurrency contract not found')
          lines[group_index] = '  group: browser-audit-$' + '{{ github.event_name }}-$' + '{{ github.ref }}'
          workflow = '\n'.join(lines) + ('\n' if workflow.endswith('\n') else '')

          old_comment = (
              '          # Pull requests run a representative smoke set. Manual dispatch keeps\n'
              '          # the exhaustive ten-viewport + sitemap inventory available without\n'
              '          # turning every PR into a 40-minute crawl of the same archive data.\n'
              '          # The final public-quality release branch also runs the exhaustive set\n'
              '          # once before merge.'
          )
          new_comment = (
              '          # Pull requests and ordinary main pushes run a representative smoke set.\n'
              '          # Manual dispatch and designated release branches keep the exhaustive\n'
              '          # ten-viewport + sitemap inventory available without turning rapid\n'
              '          # integration merges into repeated 40-minute crawls.'
          )
          if old_comment not in workflow:
              raise SystemExit('audit mode comment not found')
          workflow = workflow.replace(old_comment, new_comment, 1)

          main_full = "github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || "
          if main_full not in workflow:
              raise SystemExit('main exhaustive audit condition not found')
          workflow = workflow.replace(main_full, "github.event_name == 'workflow_dispatch' || ", 1)
          workflow_path.write_text(workflow)

          test_path = Path('src/lib/pr455-browser-audit-regressions.test.ts')
          test = test_path.read_text()
          old_name = 'it("keeps PR browser audit representative while preserving exhaustive certification", () => {'
          new_name = 'it("keeps PR and main browser audits representative while preserving explicit exhaustive certification", () => {'
          if old_name not in test:
              raise SystemExit('browser audit regression test name not found')
          test = test.replace(old_name, new_name, 1)

          old_assertion = '    expect(workflow).toContain("Pull requests run a representative smoke set");'
          if old_assertion not in test:
              raise SystemExit('browser audit regression workflow assertion not found')
          group_assertion = (
              '    expect(workflow).toContain("group: browser-audit-$'
              + '{{ github.event_name }}-$'
              + '{{ github.ref }}");'
          )
          replacement = '\n'.join([
              '    expect(workflow).toContain("Pull requests and ordinary main pushes run a representative smoke set");',
              group_assertion,
              '    expect(workflow).not.toContain("github.ref == \'refs/heads/main\'");',
          ])
          test = test.replace(old_assertion, replacement, 1)
          test_path.write_text(test)

          Path('.github/workflows/_temporary-fast-browser-audit-patch.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/browser-audit.yml src/lib/pr455-browser-audit-regressions.test.ts .github/workflows/_temporary-fast-browser-audit-patch.yml
          git commit -m "Make routine Browser Audit fast without weakening full certification"
          git push origin HEAD:fix/browser-audit-fast-main-certification
