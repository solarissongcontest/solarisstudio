name: Temporary fast Browser Audit patch

on:
  push:
    branches:
      - fix/browser-audit-fast-main-certification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-audit-fast-main-certification
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          config_path = Path('playwright.config.ts')
          config = config_path.read_text()
          old_mode = '''const fullAudit = process.env.E2E_FULL_AUDIT === "1";
          const prSmoke = Boolean(process.env.CI) && process.env.GITHUB_EVENT_NAME === "pull_request" && !fullAudit;'''.replace('          ', '')
          new_mode = '''const fullAuditRequested = process.env.E2E_FULL_AUDIT === "1";
          const routineMainPush =
            Boolean(process.env.CI) &&
            process.env.GITHUB_EVENT_NAME === "push" &&
            process.env.GITHUB_REF === "refs/heads/main";
          const fullAudit = fullAuditRequested && !routineMainPush;
          const representativeCI =
            Boolean(process.env.CI) &&
            !fullAudit &&
            (process.env.GITHUB_EVENT_NAME === "pull_request" || routineMainPush);'''.replace('          ', '')
          if old_mode not in config:
              raise SystemExit('Playwright audit mode contract not found')
          config = config.replace(old_mode, new_mode, 1)
          config = config.replace('const representativePrProjects = [', 'const representativeCiProjects = [', 1)
          config = config.replace('timeout: prSmoke ? 90_000 : process.env.CI ? 8 * 60_000 : 5 * 60_000,', 'timeout: representativeCI ? 90_000 : process.env.CI ? 8 * 60_000 : 5 * 60_000,', 1)
          config = config.replace('retries: prSmoke ? 0 : process.env.CI ? 1 : 0,', 'retries: representativeCI ? 0 : process.env.CI ? 1 : 0,', 1)
          config = config.replace('...(prSmoke ? representativePrProjects : exhaustiveProjects),', '...(representativeCI ? representativeCiProjects : exhaustiveProjects),', 1)
          config = config.replace(
              '// A PR is a release proof, not an exhaustive crawler. The broad inventory is\n  // still preserved for main/manual certification below; PRs run a deterministic\n  // representative matrix after the separate Organizer fail-fast preflight.',
              '// Routine PR and main-push CI is release feedback, not an exhaustive crawler.\n  // The broad inventory stays available for explicit/manual and release-branch\n  // certification; routine CI runs a deterministic representative matrix after\n  // the separate Organizer fail-fast preflight.',
              1,
          )
          config = config.replace(
              '// The representative PR matrix is already bounded. Do not stop after the first\n  // failure: one CI run must report the whole actionable browser failure set.',
              '// The representative CI matrix is already bounded. Do not stop after the first\n  // failure: one run must report the whole actionable browser failure set.',
              1,
          )
          config_path.write_text(config)

          test_path = Path('src/lib/pr455-browser-audit-regressions.test.ts')
          test = test_path.read_text()
          test = test.replace(
              'it("keeps PR browser audit representative while preserving exhaustive certification", () => {',
              'it("keeps routine PR and main-push browser audits representative while preserving exhaustive certification", () => {',
              1,
          )
          old_assertions = '''    expect(config).toContain('const fullAudit = process.env.E2E_FULL_AUDIT === "1";');
              expect(config).toContain("const personalityViewportMatrix = fullAudit");'''.replace('              ', '    ')
          new_assertions = '''    expect(config).toContain('const fullAuditRequested = process.env.E2E_FULL_AUDIT === "1";');
              expect(config).toContain('process.env.GITHUB_EVENT_NAME === "push"');
              expect(config).toContain('process.env.GITHUB_REF === "refs/heads/main"');
              expect(config).toContain("const fullAudit = fullAuditRequested && !routineMainPush;");
              expect(config).toContain("const representativeCI =");
              expect(config).toContain("const personalityViewportMatrix = fullAudit");'''.replace('              ', '    ')
          if old_assertions not in test:
              raise SystemExit('Playwright regression assertion block not found')
          test = test.replace(old_assertions, new_assertions, 1)
          test = test.replace(
              'expect(workflow).toContain("Pull requests run a representative smoke set");',
              'expect(workflow).toContain("Pull requests run a representative smoke set");\n    expect(workflow).toContain("github.ref == \'refs/heads/main\'");',
              1,
          )
          test = test.replace(
              '"grepInvert: fullAudit ? undefined : /installed-app route invariant crawl/",',
              '"grepInvert: fullAudit ? undefined : /installed-app route invariant crawl/",',
              1,
          )
          marker = '    expect(config).toContain("const personalityViewportMatrix = fullAudit");'
          if marker not in test:
              raise SystemExit('personality matrix assertion missing')
          test = test.replace(
              marker,
              marker + '\n    expect(config).toContain("...(representativeCI ? representativeCiProjects : exhaustiveProjects)");',
              1,
          )
          test_path.write_text(test)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playwright.config.ts src/lib/pr455-browser-audit-regressions.test.ts
          git commit -m "Make routine main Browser Audit use representative matrix"
          git push origin HEAD:fix/browser-audit-fast-main-certification
