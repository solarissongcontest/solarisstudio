name: V3 HTTP409 forward-repair isolated PostgreSQL rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v3-http409-forward-repair-local.yml"
      - "docs/v3/recovery-candidates/forward-only-deterministic-http409.sql"
      - "scripts/rehearse-v3-http409-recovery-local.mjs"
      - "src/lib/v3-forward-only-conflict-reconciliation.contract.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-http409-local-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  isolated-postgresql:
    name: Forward-repair synthetic SQL verification on loopback only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      V3_VERIFICATION_TARGET: local
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PROJECT_ID: local
      SUPABASE_PROJECT_REF: local
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PROJECT_ID: local
      VITE_SUPABASE_PROJECT_REF: local
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "127.0.0.1:54322:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Fail closed on stale commit and hosted credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SHA" ]] || {
            echo "::error::Exact-SHA candidate mismatch"
            exit 1
          }
          [[ "$V3_VERIFICATION_TARGET" == "local" ]] || exit 1
          [[ "$SUPABASE_URL" == "http://127.0.0.1:54321" ]] || exit 1
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL POSTGRES_URL                      SUPABASE_DB_URL DB_URL PGSERVICE PGSERVICEFILE PGHOSTADDR PGHOST; do
            if [[ -n "${!key:-}" ]]; then
              echo "::error::$key must be unset for isolated PostgreSQL verification"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install local PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Check local PostgreSQL is available
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -w -X -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -Atq -c 'select current_database()' | grep -qx postgres

      - name: Verify JavaScript syntax without any database activity
        run: node --check scripts/rehearse-v3-http409-recovery-local.mjs

      - name: Execute synthetic local-only SQL rehearsal
        env:
          SOLARIS_RUN_LOCAL_DB_REHEARSAL: "YES"
          SOLARIS_LOCAL_DB_PORT: "54322"
          SOLARIS_LOCAL_DB_PASSWORD: postgres
        run: node scripts/rehearse-v3-http409-recovery-local.mjs

      - name: Confirm disposable DB was cleaned up
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(psql -w -X -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -Atq \
            -c "select count(*) from pg_database where datname like 'solaris_v3_http409_%'")"
          [[ "$remaining" == "0" ]] || {
            echo "::error::Disposable SQL rehearsal left temporary databases behind"
            exit 1
          }

      - name: Verify PT409 maps to HTTP 409 through isolated local PostgREST 14
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -w -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role v3_http409_local_anon nologin;
          create role v3_http409_local_authenticator login noinherit password 'localonly';
          grant v3_http409_local_anon to v3_http409_local_authenticator;
          grant usage on schema public to v3_http409_local_anon;
          create function public.v3_local_pt409_probe()
            returns void language plpgsql
            as $probe$
            begin
              raise sqlstate 'PT409' using message = 'VERSION_CONFLICT';
            end
            $probe$;
          revoke all on function public.v3_local_pt409_probe() from public;
          grant execute on function public.v3_local_pt409_probe() to v3_http409_local_anon;
          SQL

          docker run --detach --rm --network host \
            --name v3-http409-postgrest-local \
            -e PGRST_DB_URI=postgres://v3_http409_local_authenticator:localonly@127.0.0.1:54322/postgres \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=v3_http409_local_anon \
            -e PGRST_SERVER_HOST=127.0.0.1 \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v14.18

          ready=no
          for attempt in $(seq 1 25); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:3000/ > /dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 1
          done
          if [[ "$ready" != yes ]]; then
            docker logs v3-http409-postgrest-local || true
            echo "::error::Isolated local PostgREST never became ready"
            exit 1
          fi

          response="$(mktemp)"
          status="$(curl --silent --show-error --max-time 5 \
            --output "$response" --write-out "%{http_code}" \
            --request POST http://127.0.0.1:3000/rpc/v3_local_pt409_probe \
            --header 'Content-Type: application/json' --data '{}')"
          if [[ "$status" != "409" ]]; then
            cat "$response"
            echo "::error::Local PostgREST failed to map PT409 to HTTP 409 (got $status)"
            exit 1
          fi
          grep -q '"code":"PT409"' "$response" || {
            cat "$response"
            echo "::error::HTTP 409 did not retain the expected PT409 error code"
            exit 1
          }
          echo "PASS: local PostgREST 14 translated synthetic PT409 to HTTP 409"

      - name: Stop the temporary local PostgREST container
        if: always()
        run: docker rm --force v3-http409-postgrest-local > /dev/null 2>&1 || true

      - name: State limitations explicitly
        run: |
          echo "Synthetic local PostgreSQL and PostgREST transport proofs only; NOT hosted-head-equivalent and NOT production certified."
          echo "No production Supabase project, credentials, application rows, or hosted migration history were accessed."
