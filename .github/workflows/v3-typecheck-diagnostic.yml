name: V3 TypeScript diagnostic

on:
  push:
    branches:
      - v3/live-real-app-update
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-typecheck-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Exact TypeScript diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Isolate diagnostic from hosted Supabase
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "VITE_SUPABASE_URL=http://127.0.0.1:54321"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_quality_ci_local_only"
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_PUBLISHABLE_KEY=sb_publishable_quality_ci_local_only"
            echo "SUPABASE_PROJECT_ID=local"
            echo "SUPABASE_PROJECT_REF=local"
            echo "VITE_SUPABASE_PROJECT_ID=local"
            echo "VITE_SUPABASE_PROJECT_REF=local"
            echo "V3_VERIFICATION_TARGET=local"
          } >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run exact Quality TypeScript command
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck-output.txt

      - name: Upload TypeScript diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-typecheck-diagnostic
          path: typecheck-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish TypeScript diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -s typecheck-output.txt ]; then
            {
              echo '### Exact TypeScript diagnostic'
              echo
              echo '```text'
              cat typecheck-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
