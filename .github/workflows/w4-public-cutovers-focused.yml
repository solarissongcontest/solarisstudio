name: W4 Public Cutovers Focused

on:
  push:
    branches:
      - v3/burndown-w4-public-cutovers

permissions:
  contents: read

concurrency:
  group: w4-public-cutovers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused public cutover checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_w4_ci_local_only
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_w4_ci_local_only
    steps:
      - name: Checkout exact worker head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Worker 4 focused contracts
        run: >-
          bun test
          src/lib/v3-private-delegation-history-cutover.contract.test.ts
          src/lib/v3-country-hub-cutover.contract.test.ts
          src/lib/v3-me.test.ts
          src/lib/v3-me-screen.contract.test.ts
          src/lib/v3-me-screen.test.tsx

      - name: Generate route types with production build
        run: bun run build

      - name: TypeScript
        run: bun run typecheck
