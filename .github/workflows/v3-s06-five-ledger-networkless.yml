name: V3 S06 five FK-closed version ledgers networkless local parity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v3-s06-five-ledger-networkless.yml"
      - "docs/v3/recovery-candidates/evidence/s06-five-version-ledgers-local.sql"
      - "scripts/verify-v3-s06-five-ledger-parity.mjs"
      - "scripts/verify-v3-s06-five-ledger-parity.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-catalog-digests-2026-11-10.json"
      - "docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-54-table-schema-fixture.sql"
      - "docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-extra-2-dependencies-local.sql"
      - "scripts/v3-s06-hosted-catalog-digests-local.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s06-five-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg17-networkless-fk-ledgers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Refuse wrong commit or hosted connection aliases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXACT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXACT_SHA" ]]
          for key in DATABASE_URL POSTGRES_URL SUPABASE_DB_URL SUPABASE_URL VITE_SUPABASE_URL SUPABASE_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY PGHOST PGHOSTADDR PGPORT PGSERVICE PGSERVICEFILE DOCKER_HOST DOCKER_CONTEXT; do
            [[ -z "$(printenv "$key" || true)" ]] || { echo "::error::Remote config forbidden $key"; exit 1; }
          done
      - name: Offline no-certification and fail-closed negative tests
        run: |
          node --check scripts/verify-v3-s06-five-ledger-parity.mjs
          node --test scripts/verify-v3-s06-five-ledger-parity.test.mjs
      - name: Fetch reviewed PostgreSQL 17.11 and verify image ID
        run: |
          set -euo pipefail
          docker pull postgres:17.11
          [[ "$(docker image inspect --format '{{.Id}}' postgres:17.11)" == "sha256:eb0fb2377534e65aad04f37838956b3dfb888e1a3dd3c1acf957bc6557eb6c7d" ]] || exit 1
      - name: Restore 56 verified parents plus 5 FK-bound ledgers in same networkless database
        shell: bash
        run: |
          set -euo pipefail
          cid=""
          cleanup() { code=$?; if [[ -n "$cid" ]]; then docker rm -f "$cid" >/dev/null || code=1; fi; exit "$code"; }
          trap cleanup EXIT
          cid="$(docker run -d --rm --pull=never --network none \
            --name "solaris-s06-five-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -e POSTGRES_PASSWORD=disposable-local-only postgres:17.11)"
          [[ "$cid" =~ ^[0-9a-f0-9]{64}$ ]]
          [[ "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" == none ]]
          [[ "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid")" == '{}' ]]
          ready=false
          for n in $(seq 1 45); do
            if docker exec "$cid" pg_isready -h /var/run/postgresql -U postgres >/dev/null; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]]
          sql() { docker exec -i "$cid" psql -w -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres "$@"; }
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-54-table-schema-fixture.sql >/dev/null
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-extra-2-dependencies-local.sql >/dev/null
          sql -f - < docs/v3/recovery-candidates/evidence/s06-five-version-ledgers-local.sql >/dev/null
          sql -f - < scripts/v3-s06-hosted-catalog-digests-local.sql > "$RUNNER_TEMP/s06-61-table-catalog.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/s06-61-table-catalog.json','utf8'));
          const five = new Set([
            'public.studio2_confirmation_review_versions',
            'public.studio2_confirmation_round_versions',
            'public.studio2_jury_window_versions',
            'public.studio2_participation_status_versions',
            'public.studio2_permission_subject_versions'
          ]);
          const ids = d.relations.map(r=>r.schema_name+'.'+r.object_name);
          const actual = d.relations.filter(r=>five.has(r.schema_name+'.'+r.object_name));
          if (d.pg_version_num!==170011||d.relations.length!==61||
              new Set(ids).size!==61||actual.length!==5||new Set(actual.map(r=>r.object_name)).size!==5||
              actual.some(r=>r.constraint_count!==3||r.index_count!==1||r.policy_count!==0||r.trigger_count!==0)) {
            throw Error('S06 blocked: expected exactly 56 known parent tables and five FK-bound ledgers');
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s06-five-local.json',JSON.stringify({
            pg_version_num:d.pg_version_num,relations:actual
          }));
          NODE
          node scripts/verify-v3-s06-five-ledger-parity.mjs \
            docs/v3/recovery-candidates/evidence/s06-hosted-catalog-digests-2026-11-10.json \
            "$RUNNER_TEMP/s06-five-local.json" "$RUNNER_TEMP/s06-five-proof.json"
          echo "PASS: five FK-closed hosted-observed ledgers in 61-table local fixture; NO hosted-equivalence certification."
      - name: State release boundary
        run: |
          echo "Five new table identities, NOT 61 full-catalog parity; no user rows, no hosted DB access."
          echo "No role membership, 727 routine body, auth extension, S13/S14 full replay or release certification."
