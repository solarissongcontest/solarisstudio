name: V3 S14 Televote deadline extension rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s14-televote-deadline-extension-rehearsal.sh"
      - ".github/workflows/v3-s14-televote-deadline-extension-rehearsal.yml"
      - "src/lib/v3-s14-televote-deadline-extension.contract.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-televote-deadline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + genuine Televote deadline extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain locally
        run: supabase db reset --local --no-seed
      - name: Rehearse deadline set, expiry, extension and ballot acceptance
        run: bash .github/scripts/v3-s14-televote-deadline-extension-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + genuine Televote deadline extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s14-deadline-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-deadline-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply only the feature migrations locally
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017001900_v3_s14_televote_deadline_column.sql" \
            /tmp/solaris-s14-deadline-main/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017002000_v3_s14_televote_deadline_extension.sql" \
            /tmp/solaris-s14-deadline-main/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017002100_v3_s14_televote_deadline_replay_fix.sql" \
            /tmp/solaris-s14-deadline-main/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017002200_v3_s14_televote_deadline_open_compatibility.sql" \
            /tmp/solaris-s14-deadline-main/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017002300_v3_s14_televote_round_binding_id_fix.sql" \
            /tmp/solaris-s14-deadline-main/supabase/migrations/
          cd /tmp/solaris-s14-deadline-main
          supabase migration up --local --include-all
      - name: Rehearse genuine deadline extension after upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-deadline-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s14-televote-deadline-extension-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-s14-deadline-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
