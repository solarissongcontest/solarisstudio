name: Browser audit

# Browser audits are intentionally manual. They are expensive end-to-end tests
# and must never be triggered by every pull-request update.
on:
  workflow_dispatch:
    inputs:
      full_audit:
        description: Run the exhaustive viewport + sitemap audit
        required: true
        type: boolean
        default: false
      capture_personality_reference:
        description: Capture personality reference artifacts
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require an isolated non-production Supabase backend
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${E2E_SUPABASE_URL:-}" ] || [ -z "${E2E_SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Browser audit is blocked: configure a dedicated non-production E2E Supabase URL and publishable key."
            exit 1
          fi

          prod_url="$(python - <<'PY'
          from pathlib import Path

          value = ""
          for line in Path(".env").read_text().splitlines():
              if line.startswith("VITE_SUPABASE_URL="):
                  value = line.split("=", 1)[1].strip().strip('"').strip("'").rstrip("/")
                  break
          print(value)
          PY
          )"

          e2e_url="${E2E_SUPABASE_URL%/}"

          if [ -z "$prod_url" ]; then
            echo "::error::Browser audit is blocked: could not determine the production Supabase URL from .env."
            exit 1
          fi

          if [ "$e2e_url" = "$prod_url" ]; then
            echo "::error::Browser audit refused to run against the production Supabase project. Use a dedicated E2E project."
            exit 1
          fi

          case "$e2e_url" in
            https://*.supabase.co) ;;
            *)
              echo "::error::Browser audit is blocked: E2E_SUPABASE_URL must be a dedicated Supabase project URL."
              exit 1
              ;;
          esac

          # Force every build/server/browser process in this job onto the isolated
          # E2E backend. This also prevents Vite from silently falling back to the
          # checked-in production .env during the production build.
          {
            echo "VITE_SUPABASE_URL=$E2E_SUPABASE_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$E2E_SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_URL=$E2E_SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$E2E_SUPABASE_PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Install browser-audit runner
        run: |
          bun add --dev @playwright/test@1.55.0
          bunx playwright install --with-deps chromium webkit

      - name: Start stable audit server
        run: |
          set -euo pipefail

          bun run dev --host 127.0.0.1 --port 4173 --strictPort > /tmp/solaris-audit-server.log 2>&1 &
          echo $! > /tmp/solaris-audit-server.pid

          ready=0
          for attempt in $(seq 1 45); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/ || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Audit server failed to become ready. Last server output:"
            tail -n 200 /tmp/solaris-audit-server.log || true
            exit 1
          fi

          if ! kill -0 "$(cat /tmp/solaris-audit-server.pid)" 2>/dev/null; then
            echo "Audit server exited after becoming ready. Last server output:"
            tail -n 200 /tmp/solaris-audit-server.log || true
            exit 1
          fi

      - name: Run responsive browser audit
        run: bunx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_FULL_AUDIT: ${{ inputs.full_audit && '1' || '0' }}
          PERSONALITY_REFERENCE_CAPTURE: ${{ inputs.capture_personality_reference && '1' || '0' }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_COUNTRY_EMAIL: ${{ secrets.E2E_COUNTRY_EMAIL }}
          E2E_COUNTRY_PASSWORD: ${{ secrets.E2E_COUNTRY_PASSWORD }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
          E2E_SUSPENDED_EMAIL: ${{ secrets.E2E_SUSPENDED_EMAIL }}
          E2E_SUSPENDED_PASSWORD: ${{ secrets.E2E_SUSPENDED_PASSWORD }}

      - name: Print audit server log on failure
        if: failure()
        run: tail -n 300 /tmp/solaris-audit-server.log || true

      - name: Stop audit server
        if: always()
        run: |
          if [ -f /tmp/solaris-audit-server.pid ]; then
            kill "$(cat /tmp/solaris-audit-server.pid)" 2>/dev/null || true
          fi

      - name: Upload browser summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-summary
          path: playwright-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 14
