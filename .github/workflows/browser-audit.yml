name: Browser audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-playwright-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout navbar branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Restore full Browser Audit and generate repository-owned Playwright lock
        shell: bash
        run: |
          set -euo pipefail

          git show 195aa5d5156648f683a77f1c2af922f4a1b83f47:.github/workflows/browser-audit.yml > .github/workflows/browser-audit.yml

          installed=0
          for attempt in 1 2 3; do
            if bun add --dev --exact @playwright/test@1.55.0 --network-concurrency 4; then
              installed=1
              break
            fi
            sleep $((attempt * 8))
          done
          if [ "$installed" -ne 1 ]; then
            echo 'Unable to generate the repository-owned Playwright lock after three bounded attempts.'
            exit 1
          fi

          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/browser-audit.yml')
          text = path.read_text()
          old = '''      - name: Install browser-audit runner
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun add --dev @playwright/test@1.55.0 --no-save --network-concurrency 4; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Browser-audit Playwright install failed after ${attempt} attempts."
              exit 1
            fi
            sleep $((attempt * 8))
          done
          bunx playwright install --with-deps chromium webkit
'''
          new = '''      - name: Install browser-audit browser binaries
        run: bunx playwright install --with-deps chromium webkit
'''
          if old not in text:
              raise SystemExit('Expected runtime Playwright install block was not found in restored Browser Audit')
          path.write_text(text.replace(old, new))
          PY

          rm -f .github/workflows/v3-navbar-lock-refresh.yml

          rm -rf node_modules
          bun install --frozen-lockfile
          test "$(bunx playwright --version)" = 'Version 1.55.0'

      - name: Commit Bun-generated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock .github/workflows/browser-audit.yml
          git add -u .github/workflows/v3-navbar-lock-refresh.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No dependency changes generated'; exit 1; }
          git commit -m '[V3-NAV] Lock Playwright test runner dependency'
          git push origin HEAD:v3/navbar-complete-redesign
