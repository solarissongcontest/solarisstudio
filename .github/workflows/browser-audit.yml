name: Browser audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Install browser-audit runner
        run: |
          bun add --dev @playwright/test@1.55.0
          bunx playwright install --with-deps chromium

      - name: Start stable audit server
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Only override the app's normal public configuration when both E2E
          # endpoint secrets exist. Empty GitHub secrets must not replace the
          # checked public development config with empty VITE_ variables.
          if [ -n "$E2E_SUPABASE_URL" ] && [ -n "$E2E_SUPABASE_PUBLISHABLE_KEY" ]; then
            export VITE_SUPABASE_URL="$E2E_SUPABASE_URL"
            export VITE_SUPABASE_PUBLISHABLE_KEY="$E2E_SUPABASE_PUBLISHABLE_KEY"
            export SUPABASE_URL="$E2E_SUPABASE_URL"
            export SUPABASE_PUBLISHABLE_KEY="$E2E_SUPABASE_PUBLISHABLE_KEY"
          fi

          bun run dev --host 127.0.0.1 --port 4173 --strictPort > /tmp/solaris-audit-server.log 2>&1 &
          echo $! > /tmp/solaris-audit-server.pid

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Audit server failed to become ready. Last server output:"
            tail -n 200 /tmp/solaris-audit-server.log || true
            exit 1
          fi

          if ! kill -0 "$(cat /tmp/solaris-audit-server.pid)" 2>/dev/null; then
            echo "Audit server exited after becoming ready. Last server output:"
            tail -n 200 /tmp/solaris-audit-server.log || true
            exit 1
          fi

      - name: Run responsive browser audit
        run: bunx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          # Pull requests run a representative smoke set. Manual dispatch keeps
          # the exhaustive nine-width + sitemap inventory available without
          # turning every PR into a 40-minute crawl of the same archive data.
          E2E_FULL_AUDIT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_COUNTRY_EMAIL: ${{ secrets.E2E_COUNTRY_EMAIL }}
          E2E_COUNTRY_PASSWORD: ${{ secrets.E2E_COUNTRY_PASSWORD }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
          E2E_SUSPENDED_EMAIL: ${{ secrets.E2E_SUSPENDED_EMAIL }}
          E2E_SUSPENDED_PASSWORD: ${{ secrets.E2E_SUSPENDED_PASSWORD }}

      - name: Print audit server log on failure
        if: failure()
        run: tail -n 300 /tmp/solaris-audit-server.log || true

      - name: Stop audit server
        if: always()
        run: |
          if [ -f /tmp/solaris-audit-server.pid ]; then
            kill "$(cat /tmp/solaris-audit-server.pid)" 2>/dev/null || true
          fi

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 14
