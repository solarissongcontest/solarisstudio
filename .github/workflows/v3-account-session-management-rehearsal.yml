name: V3 Account session management rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/country-auth/**"
      - ".github/scripts/v3-account-session-management-rehearsal.sh"
      - ".github/scripts/v3-password-recovery-rehearsal.sh"
      - ".github/workflows/v3-account-session-management-rehearsal.yml"
      - "src/lib/v3-account-session-management.contract.test.ts"
      - "src/lib/password-recovery-regression.test.ts"
      - "src/lib/maintenance-hod-portal.ts"
      - "src/lib/country-auth.ts"
      - "src/routes/auth/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-account-session-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + account session checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain
        run: supabase db reset --local --no-seed
      - name: Rehearse account session contract
        run: bash .github/scripts/v3-account-session-management-rehearsal.sh
      - name: Rehearse country password recovery
        env:
          RECOVERY_TRACE_FILE: ${{ runner.temp }}/recovery-traces/clean.log
        run: bash .github/scripts/v3-password-recovery-rehearsal.sh
      - name: Upload clean recovery stage trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-recovery-trace-clean-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-traces/clean.log
          if-no-files-found: error
          retention-days: 3
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + account session checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-account-session-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-account-session-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply additive feature migration delta
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-copy-migration-delta.sh" "$GITHUB_WORKSPACE" /tmp/solaris-account-session-main
          cd /tmp/solaris-account-session-main
          supabase migration up --local --include-all
      - name: Rehearse contract after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-account-session-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-account-session-management-rehearsal.sh"
      - name: Probe Supabase runtime-root ownership
        shell: bash
        run: |
          set -u
          probe="$RUNNER_TEMP/supabase-root-probe.txt"
          runtime_root=/tmp/solaris-account-session-main
          pr_root="$GITHUB_WORKSPACE"

          runtime_status=0
          (cd "$runtime_root" && supabase status -o env >/dev/null 2>&1) || runtime_status=$?
          pr_status=0
          (cd "$pr_root" && supabase status -o env >/dev/null 2>&1) || pr_status=$?

          runtime_config=no
          [[ -f "$runtime_root/supabase/config.toml" ]] && runtime_config=yes
          pr_config=no
          [[ -f "$pr_root/supabase/config.toml" ]] && pr_config=yes

          {
            printf 'runtime_root=%s\n' "$runtime_root"
            printf 'runtime_status=%s\n' "$runtime_status"
            printf 'runtime_config=%s\n' "$runtime_config"
            printf 'pr_root=%s\n' "$pr_root"
            printf 'pr_status=%s\n' "$pr_status"
            printf 'pr_config=%s\n' "$pr_config"
          } | tee "$probe"

          [[ "$runtime_status" -eq 0 ]]
      - name: Upload Supabase runtime-root probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-root-probe-${{ github.sha }}
          path: ${{ runner.temp }}/supabase-root-probe.txt
          if-no-files-found: error
          retention-days: 3
      - name: Rehearse password recovery after current-main upgrade
        shell: bash
        env:
          RECOVERY_TRACE_FILE: ${{ runner.temp }}/recovery-traces/upgrade.log
          RECOVERY_MAIN_WORKTREE: /tmp/solaris-account-session-main
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/v3-password-recovery-rehearsal.sh
      - name: Upload upgrade recovery stage trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-recovery-trace-upgrade-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-traces/upgrade.log
          if-no-files-found: error
          retention-days: 3
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-account-session-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
