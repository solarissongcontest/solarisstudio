name: V3 S14 Archive consequence rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s14-archive-command-rehearsal.sh"
      - ".github/workflows/v3-s14-archive-consequences-rehearsal.yml"
      - "src/lib/v3-s14-archive-consequences.contract.test.ts"
      - "src/lib/v3-archive-command.contract.test.ts"
      - "src/lib/v3-archive-command.ts"
      - "src/lib/studio2-control-room.ts"
      - "src/routes/_authenticated/admin/control-room.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-archive-consequences-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + archive command/consequences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain locally
        run: supabase db reset --local --no-seed
      - name: Rehearse canonical Archive command
        run: bash .github/scripts/v3-s14-archive-command-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + Archive command/consequences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install feature dependencies
        run: bun install --frozen-lockfile
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s14-archive-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-archive-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply only Archive feature migrations locally
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017003000_v3_s14_archive_consequences.sql" \
            /tmp/solaris-s14-archive-main/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017003100_v3_resolved_task_notification_reconciliation.sql" \
            /tmp/solaris-s14-archive-main/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017003200_v3_s14_archive_command_integrity.sql" \
            /tmp/solaris-s14-archive-main/supabase/migrations/
          cd /tmp/solaris-s14-archive-main
          supabase migration up --local --include-all
      - name: Rehearse Archive after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-archive-main
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s14-archive-command-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-s14-archive-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
