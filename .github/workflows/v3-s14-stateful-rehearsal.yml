name: V3 S14 stateful contest rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional exact commit SHA. Defaults to the dispatched branch SHA.
        required: false
        type: string
      require_complete:
        description: Require release-grade complete S14 evidence instead of developmental partial evidence
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v3-s14-stateful-${{ inputs.candidate_sha || github.sha }}-${{ inputs.require_complete }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Stateful local contest rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      V3_VERIFICATION_TARGET: local
      V3_SEED_TARGET: local
      V3_CLEANUP_TARGET: local
      V3_DESTRUCTIVE_VERIFICATION: "1"
      V3_SERVICE_ROLE_SCOPE: local
      V3_RELEASE_EVIDENCE_DIR: v3-release-evidence
      LOCAL_SUPABASE_URL: http://127.0.0.1:54321

    steps:
      - name: Validate requested SHA and rehearsal mode
        id: identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUIRE_COMPLETE: ${{ inputs.require_complete }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_SHA:-$DISPATCH_SHA}"
          if [[ ! "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be an exact 40-character Git commit SHA"
            exit 1
          fi
          requested="$(printf '%s' "$requested" | tr '[:upper:]' '[:lower:]')"
          echo "sha=$requested" >> "$GITHUB_OUTPUT"

          if [[ "$REQUIRE_COMPLETE" == "true" ]]; then
            echo "V3_S14_ALLOW_PARTIAL=0" >> "$GITHUB_ENV"
            echo "V3_S14_REQUIRE_COMPLETE=1" >> "$GITHUB_ENV"
            echo "mode=complete" >> "$GITHUB_OUTPUT"
          else
            echo "V3_S14_ALLOW_PARTIAL=1" >> "$GITHUB_ENV"
            echo "V3_S14_REQUIRE_COMPLETE=0" >> "$GITHUB_ENV"
            echo "mode=partial-allowed" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::checked out $actual but S14 requested $EXPECTED_SHA"
            exit 1
          fi
          echo "V3_CANDIDATE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start disposable local Supabase
        run: supabase start

      - name: Reset clean local database
        run: supabase db reset --local --no-seed

      - name: Verify production isolation before destructive rehearsal
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          if [[ "$API_URL" != "$LOCAL_SUPABASE_URL" ]]; then
            echo "::error::Refusing audit server with hosted Supabase URL: $API_URL"
            exit 1
          fi
          export VITE_SUPABASE_URL="$API_URL"
          export SUPABASE_URL="$API_URL"
          export E2E_SUPABASE_URL="$API_URL"
          export VITE_CONFIRMATIONS_SUPABASE_URL="$API_URL"
          export CONFIRMATIONS_SUPABASE_URL="$API_URL"
          export DATABASE_URL="$DB_URL"
          export SUPABASE_PROJECT_ID=local
          export SUPABASE_PROJECT_REF=local
          export E2E_SUPABASE_PROJECT_ID=local
          export E2E_SUPABASE_PROJECT_REF=local
          export VITE_SUPABASE_PROJECT_ID=local
          export VITE_SUPABASE_PROJECT_REF=local
          bun run scripts/check-v3-production-isolation.ts

      - name: Run one persistent S14 contest state
        shell: bash
        run: bash .github/scripts/v3-full-contest-rehearsal.sh

      - name: Verify exact-SHA S14 evidence semantics
        if: always()
        shell: bash
        env:
          REQUIRE_COMPLETE: ${{ inputs.require_complete }}
        run: |
          set -euo pipefail
          final="$V3_RELEASE_EVIDENCE_DIR/s14-full-contest.json"
          partial="$V3_RELEASE_EVIDENCE_DIR/s14-full-contest.partial.json"

          if [[ -s "$final" && -s "$partial" ]]; then
            echo "::error::S14 emitted both final and partial evidence for one candidate"
            exit 1
          fi
          if [[ ! -s "$final" && ! -s "$partial" ]]; then
            echo "::error::S14 emitted neither final nor partial evidence"
            exit 1
          fi

          if [[ -s "$final" ]]; then
            node - "$final" "$V3_CANDIDATE_SHA" <<'NODE'
          const fs = require("fs");
          const [path, expected] = process.argv.slice(2);
          const evidence = JSON.parse(fs.readFileSync(path, "utf8"));
          if (evidence.candidateSha !== expected) throw new Error(`S14 final evidence SHA mismatch: ${evidence.candidateSha} != ${expected}`);
          if (evidence.passed !== true) throw new Error("Release-grade S14 evidence must prove passed=true");
          if (evidence.partial === true) throw new Error("Release-grade S14 evidence cannot be marked partial");
          if (Array.isArray(evidence.pendingStages) && evidence.pendingStages.length > 0) throw new Error("Release-grade S14 evidence still has pending stages");
          if (Array.isArray(evidence.blockedContestExtensions) && evidence.blockedContestExtensions.length > 0) throw new Error("Release-grade S14 evidence still has blocked contest extensions");
          NODE
            echo "S14 final exact-SHA evidence is release-grade."
            exit 0
          fi

          node - "$partial" "$V3_CANDIDATE_SHA" <<'NODE'
          const fs = require("fs");
          const [path, expected] = process.argv.slice(2);
          const evidence = JSON.parse(fs.readFileSync(path, "utf8"));
          if (evidence.candidateSha !== expected) throw new Error(`S14 partial evidence SHA mismatch: ${evidence.candidateSha} != ${expected}`);
          if (evidence.passed !== false || evidence.partial !== true) throw new Error("Incomplete S14 must remain explicit passed=false, partial=true evidence");
          const pending = Array.isArray(evidence.pendingStages) ? evidence.pendingStages.length : 0;
          const blocked = Array.isArray(evidence.blockedContestExtensions) ? evidence.blockedContestExtensions.length : 0;
          if (pending === 0 && blocked === 0) throw new Error("Partial S14 evidence must identify at least one unfinished stage or blocked contest extension");
          NODE

          if [[ "$REQUIRE_COMPLETE" == "true" ]]; then
            echo "::error::complete S14 was required but the candidate emitted only partial evidence"
            exit 1
          fi
          echo "S14 partial exact-SHA evidence is valid for developmental rehearsal only."

      - name: Upload S14 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-s14-stateful-${{ steps.identity.outputs.sha }}-${{ steps.identity.outputs.mode }}
          path: |
            v3-release-evidence/
            playwright-s14-results-summary.json
            playwright-s14-grand-final-results-summary.json
            test-results/v3-s14-results/
            test-results/v3-s14-grand-final-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Publish S14 summary
        if: always()
        shell: bash
        run: |
          {
            echo "## S14 stateful contest rehearsal"
            echo
            echo "Candidate: \`${{ steps.identity.outputs.sha }}\`"
            echo "Mode: \`${{ steps.identity.outputs.mode }}\`"
            echo
            echo "This workflow is local-only and destructive only against disposable local Supabase."
            echo "Partial evidence is accepted only in developmental mode. Complete mode requires one exact-SHA release-grade s14-full-contest.json and fails closed on partial evidence."
            echo "This workflow does not emit S16 certification semantics."
          } >> "$GITHUB_STEP_SUMMARY"
