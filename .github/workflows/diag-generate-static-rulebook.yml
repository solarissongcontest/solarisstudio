name: DIAG materialize static V4 canon

on:
  push:
    branches:
      - v3/nav-client-budget-static-rulebook

permissions:
  contents: write

concurrency:
  group: diag-static-v4-canon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: v3/nav-client-budget-static-rulebook
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate exact static canon
        run: bun run scripts/generate-ssc-rules-static-canon.ts

      - name: Commit generated canon and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/diag-generate-static-rulebook.yml
          git add src/lib/ssc-rules/canon-v4.generated.ts .github/workflows/diag-generate-static-rulebook.yml
          git diff --cached --check
          git commit -m "V3 performance: materialize exact static V4 canon"
          git push origin HEAD:v3/nav-client-budget-static-rulebook
