name: V3 navbar guarded final owner probes

on:
  push:
    branches: [v3/navbar-complete-redesign]
    paths: [.github/workflows/v3-navbar-final-owner-probes.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3/navbar-complete-redesign
          fetch-depth: 0
      - name: Apply fail-closed canonical AppTabBar ownership and probe migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all_checked(path: str, old: str, new: str, minimum: int = 1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} matches, got {count}: {old!r}")
              p.write_text(text.replace(old, new))
              return count

          shell = "src/components/v3/V3AppShell.tsx"
          replace_once(
              shell,
              'import { useSolarisApp } from "@/components/app/AppRuntime";\n',
              'import { AppTabBar } from "@/components/app/AppTabBar";\nimport { useSolarisApp } from "@/components/app/AppRuntime";\n',
          )
          replace_once(
              shell,
              '''      {!isAppMode ? (\n        <V3LiquidTabBar\n          key={navigationInteractionKey}\n          pathname={pathname}\n          destinations={navigationDestinations}\n          onSelect={selectDestination}\n        />\n      ) : null}''',
              '''      {isAppMode ? (\n        <AppTabBar\n          pathname={pathname}\n          searchStr={searchStr}\n          signedIn={Boolean(rollout.data?.userId)}\n          participateBadge={participateAttentionCount}\n          meBadge={attention.me}\n        />\n      ) : (\n        <V3LiquidTabBar\n          key={navigationInteractionKey}\n          pathname={pathname}\n          destinations={navigationDestinations}\n          onSelect={selectDestination}\n        />\n      )}''',
          )

          probes = [
              "e2e/v3-navigation/frame-profile-installed-app.e2e.ts",
              "e2e/v3-navigation/geometry-report-installed-app.e2e.ts",
              "e2e/v3-navigation/installed-app.e2e.ts",
          ]
          for path in probes:
              replace_once(
                  path,
                  'import { expect, test, type BrowserContext, type Page } from "@playwright/test";\n',
                  'import { expect, test, type BrowserContext, type Page } from "@playwright/test";\n\nimport { applyNavbarInstalledCssEmulation } from "./navbar-local-rollout";\n',
              )
              replace_all_checked(path, '[data-v3-liquid-tabbar]', '.solaris-app-tabbar')
              replace_all_checked(path, '.v3-liquid-tabbar__material', '.solaris-app-tabbar-material')
              replace_all_checked(path, '[data-v3-tab-index]', '[data-app-tab-index]')
              replace_once(
                  path,
                  '  await page.goto(`${baseURL}/my-solaris/account`, { waitUntil: "domcontentloaded" });\n',
                  '  await page.goto(`${baseURL}/my-solaris/account`, { waitUntil: "domcontentloaded" });\n  await applyNavbarInstalledCssEmulation(page);\n',
              )

          geometry = "e2e/v3-navigation/geometry-report-installed-app.e2e.ts"
          replace_all_checked(geometry, '.v3-liquid-tabbar__lens', '.solaris-app-tab-indicator')
          replace_all_checked(geometry, '.v3-liquid-tabbar__icon', '.solaris-app-tab-icon')

          installed = "e2e/v3-navigation/installed-app.e2e.ts"
          replace_all_checked(installed, '.v3-liquid-tabbar__backdrop', '.solaris-app-tabbar-backdrop')
          replace_all_checked(installed, '.v3-liquid-tabbar__lens', '.solaris-app-tab-indicator')
          replace_once(
              installed,
              '      layoutDirection: bar.getAttribute("data-layout-direction") ?? "ltr",',
              '      layoutDirection: getComputedStyle(bar).direction === "rtl" ? "rtl" : "ltr",',
          )
          replace_all_checked(installed, '--v3-bottom-obstruction', '--solaris-app-bottom-obstruction')
          replace_once(
              installed,
              '  await expect(nav).toHaveAttribute("data-layout-direction", direction);',
              '  await expect.poll(() => nav.evaluate((element) => getComputedStyle(element).direction)).toBe(direction);',
          )
          replace_once(
              installed,
              '  await expect(page.locator(".solaris-app-tabbar")).toHaveAttribute(\n    "data-layout-direction",\n    "rtl",\n  );',
              '  await expect\n    .poll(() => page.locator(".solaris-app-tabbar").evaluate((element) => getComputedStyle(element).direction))\n    .toBe("rtl");',
          )
          replace_once(
              installed,
              '  await expect(page.locator(".solaris-app-tabbar")).toHaveAttribute(\n    "data-layout-direction",\n    "ltr",\n  );',
              '  await expect\n    .poll(() => page.locator(".solaris-app-tabbar").evaluate((element) => getComputedStyle(element).direction))\n    .toBe("ltr");',
          )
          replace_once(
              installed,
              'installed app shell survives representative navigation without duplicate chrome: V3 Liquid Glass stays bounded, compact and keyboard-safe',
              'installed app shell survives representative navigation without duplicate chrome: canonical AppTabBar stays bounded, compact and keyboard-safe',
          )

          # CSS-owner-specific geometry aliases must all be gone from installed probes.
          for path in probes:
              text = Path(path).read_text()
              stale = [
                  '[data-v3-liquid-tabbar]',
                  '.v3-liquid-tabbar__material',
                  '.v3-liquid-tabbar__lens',
                  '[data-v3-tab-index]',
              ]
              remaining = [token for token in stale if token in text]
              if remaining:
                  raise SystemExit(f"{path}: stale transient navbar hooks remain: {remaining}")

          Path('.github/workflows/v3-navbar-final-owner-probes.yml').unlink()
          PY

          git diff --check
          git diff -- src/components/v3/V3AppShell.tsx e2e/v3-navigation/frame-profile-installed-app.e2e.ts e2e/v3-navigation/geometry-report-installed-app.e2e.ts e2e/v3-navigation/installed-app.e2e.ts

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/v3/V3AppShell.tsx e2e/v3-navigation/frame-profile-installed-app.e2e.ts e2e/v3-navigation/geometry-report-installed-app.e2e.ts e2e/v3-navigation/installed-app.e2e.ts .github/workflows/v3-navbar-final-owner-probes.yml
          git commit -m "fix(v3-nav): complete canonical AppTabBar ownership"
          git push origin HEAD:v3/navbar-complete-redesign
