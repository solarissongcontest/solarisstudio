name: V3 release candidate preflight

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v3-release-preflight-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact-SHA V3 release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_v3_release_local_only
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_v3_release_local_only
      SUPABASE_PROJECT_ID: local
      SUPABASE_PROJECT_REF: local
      VITE_SUPABASE_PROJECT_ID: local
      VITE_SUPABASE_PROJECT_REF: local
      V3_VERIFICATION_TARGET: local
      V3_SEED_TARGET: local
      V3_CLEANUP_TARGET: local
      VITE_CONFIRMATIONS_SUPABASE_URL: http://127.0.0.1:54321
      VITE_CONFIRMATIONS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_v3_release_local_only
      CONFIRMATIONS_SUPABASE_URL: http://127.0.0.1:54321
      CONFIRMATIONS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_v3_release_local_only

    steps:
      - name: Validate candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be one exact 40-character Git commit SHA"
            exit 1
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="$(printf '%s' "$CANDIDATE_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked out $actual but certification preflight requested $expected"
            exit 1
          fi
          echo "V3_CANDIDATE_SHA=$actual" >> "$GITHUB_ENV"
          echo "Exact candidate verified: $actual"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production isolation
        run: bun run scripts/check-v3-production-isolation.ts

      - name: Discover every independent static release failure
        run: bun --env-file=/dev/null run scripts/v3-release-preflight.ts --group=static

      - name: Report S16 static mutation authority
        if: always()
        env:
          V3_PREFLIGHT_DIR: v3-release-preflight/static
        run: bun --env-file=/dev/null run scripts/check-v3-s16-mutation-authority.ts --static

      - name: Setup Supabase CLI for exact-SHA S16 catalog proof
        if: always()
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase for S16
        if: always()
        run: supabase start

      - name: Rebuild exact migration chain for S16
        if: always()
        run: supabase db reset --local --no-seed

      - name: Collect exact-SHA S16 catalog evidence
        if: always()
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          V3_S16_CATALOG_OUT: v3-release-preflight/s16/catalog-evidence.json
        run: bun --env-file=/dev/null run scripts/collect-v3-s16-catalog-evidence.ts

      - name: Enforce S16 against exact-SHA local catalog evidence
        if: always()
        env:
          V3_PREFLIGHT_DIR: v3-release-preflight/s16
          V3_RELEASE_EVIDENCE_DIR: v3-release-preflight
        run: bun --env-file=/dev/null run scripts/check-v3-s16-mutation-authority.ts --catalog=v3-release-preflight/s16/catalog-evidence.json --enforce

      - name: Verify shared Results integration contract
        if: always()
        env:
          V3_RELEASE_EVIDENCE_DIR: v3-release-preflight
        run: bun --env-file=/dev/null run scripts/check-v3-results-integration.ts

      - name: Generate exact-SHA discovery dashboard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected="$V3_CANDIDATE_SHA"
          mkdir -p v3-release-preflight
          GITHUB_SHA="$expected" bun run scripts/generate-v3-completion-dashboard.ts > v3-release-preflight/completion-dashboard.md
          GITHUB_SHA="$expected" bun run scripts/generate-v3-completion-dashboard.ts --json > v3-release-preflight/completion-dashboard.json
          dashboard_sha="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("v3-release-preflight/completion-dashboard.json","utf8")).candidateSha)')"
          if [ "$dashboard_sha" != "$expected" ]; then
            echo "::error::release evidence identity mismatch: dashboard=$dashboard_sha expected=$expected"
            exit 1
          fi
          echo "Discovery is not a release certificate; exact-SHA runtime artifacts remain mandatory."

      - name: Retain strict external release evidence requirements
        if: always()
        env:
          V3_RELEASE_EVIDENCE_DIR: v3-release-preflight
        run: bun run scripts/check-v3-release-integrity.ts --release

      - name: Generate fail-closed exact-SHA release manifest
        if: always()
        env:
          V3_RELEASE_EVIDENCE_DIR: v3-release-preflight
          V3_RELEASE_RISK_REPORT: v3-release-preflight/static/s15-burndown.json
          V3_RELEASE_MANIFEST_DIR: v3-release-preflight
        run: bun run scripts/build-v3-release-manifest.ts

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload exact-SHA discovery summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-release-preflight-${{ inputs.candidate_sha }}
          path: v3-release-preflight/
          if-no-files-found: error
          retention-days: 30
