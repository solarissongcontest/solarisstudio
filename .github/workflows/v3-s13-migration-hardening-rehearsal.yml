name: V3 S13 Migration hardening rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s13-migration-hardening-rehearsal.sh"
      - ".github/workflows/v3-s13-migration-hardening-rehearsal.yml"
      - "src/lib/v3-s13-migration-hardening.contract.test.ts"
      - "docs/runbooks/migration-hardening.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s13-migration-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + migration hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain locally
        run: supabase db reset --local --no-seed
      - name: Rehearse S13 migration controls
        run: bash .github/scripts/v3-s13-migration-hardening-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + migration hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s13-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s13-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply only the S13 feature migration locally
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261016234500_v3_s13_migration_hardening.sql" \
            /tmp/solaris-s13-main/supabase/migrations/
          cd /tmp/solaris-s13-main
          supabase migration up --local --include-all
      - name: Rehearse S13 controls after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s13-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s13-migration-hardening-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-s13-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
