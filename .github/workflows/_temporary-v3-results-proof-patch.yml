name: Temporary V3 Results proof patch

on:
  push:
    branches:
      - v3/results-root-cutover-main

permissions:
  contents: write

jobs:
  patch-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3/results-root-cutover-main
          fetch-depth: 0
      - name: Apply deterministic proof patch
        run: python scripts/_temporary_v3_results_proof_patch.py
      - name: Remove temporary patch files and commit
        run: |
          set -euo pipefail
          rm scripts/_temporary_v3_results_proof_patch.py
          rm .github/workflows/_temporary-v3-results-proof-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/seed-browser-e2e-local.sh e2e/account-states.e2e.ts scripts/_temporary_v3_results_proof_patch.py .github/workflows/_temporary-v3-results-proof-patch.yml
          git diff --cached --check
          git commit -m 'Add local V3 Results browser regression proof'
          git push origin HEAD:v3/results-root-cutover-main
