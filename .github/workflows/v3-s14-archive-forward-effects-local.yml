    branches: [main]
    paths: *s06_archive_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-archive-forward-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-forward-upgrade:
    name: Local full-chain -> Archive-gap -> forward-effects -> canonical behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLARIS_RUN_LOCAL_DB_REHEARSAL: "YES"
      SOLARIS_VERIFICATION_TARGET: local
      SUPABASE_PROJECT_ID: local
      SUPABASE_PROJECT_REF: local
      SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - name: Checkout reviewed exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Refuse hosted config and stale source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SHA" ]] || exit 1
          [[ "$SOLARIS_VERIFICATION_TARGET" == local ]] || exit 1
          [[ "$SUPABASE_URL" == http://127.0.0.1:54321 ]] || exit 1
          for name in DATABASE_URL POSTGRES_URL SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN PGSERVICE PGSERVICEFILE PGHOST PGHOSTADDR; do
            [[ -z "${!name:-}" ]] || { echo "::error::Refusing remote DB config $name"; exit 1; }
          done

      - name: Verify Archive source-integrity tests without dependencies
        id: source_contract
        run: node --test scripts/v3-s14-archive-forward-effects.contract.test.mjs

      - name: Check shell syntax
        run: bash -n scripts/rehearse-v3-s14-archive-forward-effects-local.sh

      - name: Set up Bun for canonical Archive integration scripts
        uses: oven-sh/setup-bun@v2

      - name: Set up Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: bash .github/scripts/v3-start-disposable-supabase.sh

      - name: Rebuild disposable full source migration chain
        id: clean_replay
        run: supabase db reset --local --no-seed

      - name: Simulate missing S13 and S14 effects, restore in dependency order
        id: ordered_recovery
        env:
          SOLARIS_INCLUDE_S13_FORWARD_RECOVERY: "YES"
        run: bash scripts/rehearse-v3-s14-archive-forward-effects-local.sh

      - name: Rehearse governed Archive, results, receipt and S4 consequence behavior
        id: archive_behavior
        run: bash .github/scripts/v3-s14-archive-system-rehearsal.sh

      - name: Test Archive authorization, invalid transitions and irreversible state
        id: authorization
        run: bash .github/scripts/v3-s14-archive-guard-rehearsal.sh

      - name: Test archive runtime deletion and terminal boundaries
        id: terminal_boundaries
        run: bash .github/scripts/v3-s14-archive-delete-guard-rehearsal.sh

      - name: Test terminal Tasks, failed delivery evidence and notification convergence
        id: task_convergence
        run: bash .github/scripts/v3-s14-archive-task-resurrection-rehearsal.sh

      - name: Second independent clean replay and interrupted-restart proof
        id: second_replay
        env:
          SOLARIS_INCLUDE_S13_FORWARD_RECOVERY: "YES"
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed
          bash scripts/rehearse-v3-s14-archive-forward-effects-local.sh
          bash .github/scripts/v3-s14-archive-system-rehearsal.sh

      - name: State release boundary
        run: |
          echo "This used only synthetic local Supabase and a simulated Archive gap."
          echo "It does NOT reproduce full hosted production schema/migration history, certify release readiness, or authorize hosted DDL."

      - name: Record scoped machine-readable recovery outcomes
        if: always()
        env:
          S06_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          # S06 structured evidence: actual CI outcomes, never hosted certification.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(sha) || sha !== process.env.REVIEWED_SHA) throw Error('S06 evidence SHA mismatch');
          const expected = ['source_contract','clean_replay','ordered_recovery','archive_behavior','authorization','terminal_boundaries','task_convergence','second_replay'];
          const steps = JSON.parse(process.env.S06_STEP_OUTCOMES || '{}');
          const outcomes = Object.fromEntries(expected.map(key => [key, steps[key]?.outcome || 'not_executed']));
          const passed = Object.values(outcomes).every(value => value === 'success');
          const files = ['docs/v3/recovery-candidates/forward-only-s13-foundation.sql','docs/v3/recovery-candidates/forward-only-s14-archive-integrated-local.sql'];
          const report = { task: 'S06', schemaVersion: 1, candidateSha: sha, runId: process.env.GITHUB_RUN_ID || null,
            evidenceLevel: 'REPRODUCED_IN_ISOLATION', fixture: 'clean-source-chain-with-simulated-S13-S14-effect-gap',
            sourceHashes: Object.fromEntries(files.map(path => [path, createHash('sha256').update(readFileSync(path)).digest('hex')])),
            outcomes, status: passed ? 'ISOLATED_RECOVERY_PASSED_NOT_HOSTED_EQUIVALENT' : 'ISOLATED_RECOVERY_INCOMPLETE',
            hostedEquivalent: false, productionRecoveryEligible: false, ownerOnlyBetaApproved: false };
          writeFileSync(process.env.S06_REPORT_PATH || 's06-isolated-recovery-proof.json', JSON.stringify(report, null, 2) + '\n');
          if (!passed) process.exitCode = 1;
          NODE

      - name: Retain exact-SHA isolated recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s06-isolated-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: s06-isolated-recovery-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true


  hosted-observed-archive-scope:
    name: Networkless PG17.11 hosted-observed Archive-scope upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLARIS_S02_TARGET: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Reject remote database and Docker aliases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXACT_SHA" ]] || exit 1
          for key in SUPABASE_URL VITE_SUPABASE_URL E2E_SUPABASE_URL CONFIRMATIONS_SUPABASE_URL VITE_CONFIRMATIONS_SUPABASE_URL DATABASE_URL POSTGRES_URL SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY PGHOST PGHOSTADDR PGPORT PGSERVICE PGSERVICEFILE DOCKER_HOST DOCKER_CONTEXT; do
            [[ -z "$(printenv "$key" || true)" ]] || { echo "::error::Remote target alias forbidden: $key"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert 21 upstream fingerprint source integrity and fail-closed cases
        run: node scripts/verify-v3-s06-hosted-upstream-rpc-catalog.mjs --self-test
      - name: Verify bounded catalog export and drift refusals
        run: node --test scripts/v3-s13-s14-catalog-export.test.mjs scripts/stage-v3-hosted-result-sync.test.mjs scripts/v3-atomic-calculation-actor.test.mjs scripts/stage-v3-public-snapshot-recovery.test.mjs scripts/stage-v3-auth-uid-authority-local.test.mjs scripts/stage-v3-atomic-calculation-recovery.test.mjs scripts/stage-v3-hosted-api-roles-local.test.mjs scripts/stage-v3-recovery-owner-local.test.mjs scripts/stage-v3-result-authority-recovery.test.mjs
      - name: Test authorization dependency reconstruction and incomplete-manifest refusal
        run: node --test scripts/v3-s13-s14-authorization-dependencies.test.mjs
      - name: Assert all-hosted catalog digests and incomplete-fixture rejection (offline only)
        run: |
          node --test scripts/verify-v3-s06-hosted-catalog-coverage.test.mjs
          node --test scripts/verify-v3-s06-seven-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-five-ledger-parity.test.mjs
          node --test scripts/verify-v3-s06-eight-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-seven-secure-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-seventeen-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-fifty-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-second-fifty-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-final-fifteen-relation-parity.test.mjs
      - name: Verify and obtain pinned PG17.11
        run: |
          set -euo pipefail
          docker pull postgres:17.11
          [[ "$(docker image inspect --format '{{.Id}}' postgres:17.11)" == "sha256:eb0fb2377534e65aad04f37838956b3dfb888e1a3dd3c1acf957bc6557eb6c7d" ]] || exit 1
      - name: Rehearse exact SHA with the S02 56-table hosted-observed schema
        shell: bash
        run: |
          set -euo pipefail
          cid=""
          cleanup() {
            code=$?
            if [[ -n "$cid" ]]; then docker rm -f "$cid" >/dev/null || code=1; fi
            exit "$code"
          }
          trap cleanup EXIT
          cid="$(docker run -d --rm --pull=never --network none --name "solaris-s06-hosted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -e POSTGRES_USER=solaris_recovery_bootstrap -e POSTGRES_PASSWORD=s06_disposable \
            -e POSTGRES_INITDB_ARGS="--locale-provider=icu --icu-locale=en-US" postgres:17.11 -c track_functions=all)"
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" == none ]] || exit 1
          [[ "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid")" == '{}' ]] || exit 1
          # Docker's first pg_isready can observe the SHORT-LIVED initdb server,
          # which shuts down before the real PG17.11 server starts. Never race it.
          ready=false
          for n in $(seq 1 75); do
            if docker logs "$cid" 2>&1 | grep -Fq 'PostgreSQL init process complete; ready for start up.' \
              && docker exec "$cid" pg_isready -h /var/run/postgresql -U solaris_recovery_bootstrap >/dev/null; then
              ready=true; break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || { docker logs "$cid" 2>&1 | tail -80; exit 1; }
          # Do not use PostgreSQL's initial superuser as the recovery operator:
          # the bootstrap role cannot be demoted, while real hosted postgres is NOSUPERUSER.
          docker exec "$cid" psql -w -X -qAt -v ON_ERROR_STOP=1 -U solaris_recovery_bootstrap -d postgres -c 'create role postgres login superuser; alter database postgres owner to postgres;'
          sql() { docker exec -i "$cid" psql -w -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres "$@"; }
          # Hosted catalog probe confirmed PG17.11 with datlocprovider=i and
          # datlocale=en-US. Preserve hosted ICU collation for deterministic
          # index-name ordering inside the original unchanged digest query.
          [[ "$(sql -c "select (datlocprovider='i' and datlocale='en-US')::text from pg_database where datname=current_database()")" == true ]] ||
            { echo "::error::S06 requires hosted en-US ICU database collation"; exit 1; }
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-54-table-schema-fixture.sql
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-extra-2-dependencies-local.sql
          # Reuse independently proven S06 seven-object zero-row fixture in
          # the SAME isolated database, not a separate synthetic test.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-seven-no-fk-relations-local.sql
          # Five hosted-observed FK ledgers have real parents in the 56 S02 tables.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-five-version-ledgers-local.sql
          # All eight newly observed objects are FK-closed by 68 prior tables
          # or by the staged releases->events order; no application rows.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-eight-fk-closed-relations-local.sql
          # Seven new FK-closed tables: Jury, Televoting integrity, account sessions. Zero rows.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-seven-jury-integrity-account-local.sql
          # 17 new hosted-observed zero-row tables; auth ownership + FK closure verified strictly.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-seventeen-next-relations-local.sql
          # Fifty additional FK-closed hosted-observed metadata identities, NO application rows.
          # Trigger placeholders are fail-closed catalog fixtures; not runtime function parity.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-fifty-next-relations-local.sql
          # 50 more dependency-closed catalog-only relations; the first 150 must remain unchanged.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-second-fifty-relations-local.sql
          # Final 15 zero-row catalog-only identities; never deployed.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-final-fifteen-relations-local.sql
          sql -f - < scripts/v3-s02-hosted-archive-catalog-local.sql > /tmp/s06-archive-catalog.json
          node scripts/verify-v3-s02-s14-archive-catalog.mjs /tmp/s06-archive-catalog.json s06-archive-catalog-proof.json
          sql -f - < scripts/v3-s02-hosted-nine-parent-catalog-local.sql > /tmp/s06-parent-catalog.json
          node scripts/verify-v3-s02-parent-catalog.mjs /tmp/s06-parent-catalog.json s06-parent-catalog-proof.json
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-56-table-grants-local.sql
          node scripts/stage-v3-hosted-api-roles-local.mjs > /tmp/hosted-api-roles-local.sql
          sql -f - < /tmp/hosted-api-roles-local.sql
          # The original S02 comparison is strictly 56 IDs. Keep that
          # comparator UNCHANGED; explicitly prove the original 44 additions and
          # another 50 distinct new identities, then scope its original JSON input.
          sql -f - < scripts/v3-s02-hosted-56-acl-local.sql > /tmp/s06-acl-76.json
          node - <<'NODE'
          const fs = require('node:fs');
          const actual = JSON.parse(fs.readFileSync('/tmp/s06-acl-76.json','utf8'));
          const frozen = JSON.parse(fs.readFileSync(
            'docs/v3/recovery-candidates/evidence/s02-hosted-s14-56-table-acls-2026-11-09.json','utf8'
          ));
          const scoped = new Set(Object.keys(frozen.privileges));
          const added = new Set([
            'private.country_auth_rate_limits',
            'private.studio2_platform_exit_write_probe',
            'public.ssc_rule_registry',
            'public.studio2_televote_global_versions',
            'public.studio2_televote_round_versions',
            'televoting.legacy_friend_voting_relationships',
            'televoting.legacy_import_metadata',
            'public.studio2_confirmation_review_versions',
