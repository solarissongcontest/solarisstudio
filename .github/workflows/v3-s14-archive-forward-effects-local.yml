name: V3 S14 Archive forward-effects recovery local proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v3-s14-archive-forward-effects-local.yml"
      - "scripts/rehearse-v3-s14-archive-forward-effects-local.sh"
      - "scripts/v3-s14-archive-forward-effects.contract.test.mjs"
      - "scripts/v3-s06-hosted-upstream-rpc-catalog-local.sql"
      - "scripts/v3-s06-hosted-catalog-digests-local.sql"
      - "scripts/verify-v3-s06-hosted-catalog-coverage.mjs"
      - "scripts/verify-v3-s06-hosted-catalog-coverage.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-catalog-digests-2026-11-10.json"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-relation-coverage-gap-20261110.json"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-seven-no-fk-relations-local.sql"
      - "scripts/verify-v3-s06-seven-relation-parity.mjs"
      - "scripts/verify-v3-s06-seven-relation-parity.test.mjs"
      - "scripts/verify-v3-s06-hosted-upstream-rpc-catalog.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-upstream-rpc-fingerprints-20261110.json"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-upstream-rpc-acls-local.sql"
      - "docs/v3/recovery-candidates/forward-only-s13-foundation.sql"
      - "docs/v3/recovery-candidates/forward-only-s14-archive-integrated-local.sql"
      - "supabase/migrations/20261003003000_organisation_os_v5_task_notifications.sql"
      - "supabase/migrations/20261019112100_v3_s14_archive_consequence_reconciliation.sql"
      - "supabase/migrations/20261019112200_v3_s14_final_results_readiness_hardening.sql"
      - "supabase/migrations/20261019202636_v3_s14_resolved_task_delivery_reconciliation.sql"
      - "supabase/migrations/20261020140000_v3_s14_archive_runtime_update_guard.sql"
      - "supabase/migrations/20261021161000_v3_s14_task_reconciliation_service_boundary.sql"
      - "supabase/migrations/20261019112300_v3_s14_transition_http409.sql"
      - "supabase/migrations/20261019112400_v3_s14_archive_task_registry_alignment.sql"
      - "supabase/migrations/20261019112500_v3_s14_resolved_task_notification_invariant.sql"
      - "supabase/migrations/20261020130000_v3_s14_archive_invariant_forward_fixes.sql"
      - "supabase/migrations/20261021110000_v3_s14_archive_guard_authority_forward_fix.sql"
      - "supabase/migrations/20261021163000_v3_s14_failed_task_delivery_evidence.sql"
      - "supabase/migrations/20261021202000_v3_s14_archive_reconciliation_convergence.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-archive-forward-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-forward-upgrade:
    name: Local full-chain -> Archive-gap -> forward-effects -> canonical behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLARIS_RUN_LOCAL_DB_REHEARSAL: "YES"
      SOLARIS_VERIFICATION_TARGET: local
      SUPABASE_PROJECT_ID: local
      SUPABASE_PROJECT_REF: local
      SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - name: Checkout reviewed exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Refuse hosted config and stale source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SHA" ]] || exit 1
          [[ "$SOLARIS_VERIFICATION_TARGET" == local ]] || exit 1
          [[ "$SUPABASE_URL" == http://127.0.0.1:54321 ]] || exit 1
          for name in DATABASE_URL POSTGRES_URL SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN PGSERVICE PGSERVICEFILE PGHOST PGHOSTADDR; do
            [[ -z "${!name:-}" ]] || { echo "::error::Refusing remote DB config $name"; exit 1; }
          done

      - name: Verify Archive source-integrity tests without dependencies
        run: node --test scripts/v3-s14-archive-forward-effects.contract.test.mjs

      - name: Check shell syntax
        run: bash -n scripts/rehearse-v3-s14-archive-forward-effects-local.sh

      - name: Set up Bun for canonical Archive integration scripts
        uses: oven-sh/setup-bun@v2

      - name: Set up Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: bash .github/scripts/v3-start-disposable-supabase.sh

      - name: Rebuild disposable full source migration chain
        run: supabase db reset --local --no-seed

      - name: Simulate missing S13 and S14 effects, restore in dependency order
        env:
          SOLARIS_INCLUDE_S13_FORWARD_RECOVERY: "YES"
        run: bash scripts/rehearse-v3-s14-archive-forward-effects-local.sh

      - name: Rehearse governed Archive, results, receipt and S4 consequence behavior
        run: bash .github/scripts/v3-s14-archive-system-rehearsal.sh

      - name: Test Archive authorization, invalid transitions and irreversible state
        run: bash .github/scripts/v3-s14-archive-guard-rehearsal.sh

      - name: Test archive runtime deletion and terminal boundaries
        run: bash .github/scripts/v3-s14-archive-delete-guard-rehearsal.sh

      - name: Test terminal Tasks, failed delivery evidence and notification convergence
        run: bash .github/scripts/v3-s14-archive-task-resurrection-rehearsal.sh

      - name: Second independent clean replay and interrupted-restart proof
        env:
          SOLARIS_INCLUDE_S13_FORWARD_RECOVERY: "YES"
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed
          bash scripts/rehearse-v3-s14-archive-forward-effects-local.sh
          bash .github/scripts/v3-s14-archive-system-rehearsal.sh

      - name: State release boundary
        run: |
          echo "This used only synthetic local Supabase and a simulated Archive gap."
          echo "It does NOT reproduce full hosted production schema/migration history, certify release readiness, or authorize hosted DDL."

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true


  hosted-observed-archive-scope:
    name: Networkless PG17.11 hosted-observed Archive-scope upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLARIS_S02_TARGET: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Reject remote database and Docker aliases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXACT_SHA" ]] || exit 1
          for key in SUPABASE_URL VITE_SUPABASE_URL E2E_SUPABASE_URL CONFIRMATIONS_SUPABASE_URL VITE_CONFIRMATIONS_SUPABASE_URL DATABASE_URL POSTGRES_URL SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY PGHOST PGHOSTADDR PGPORT PGSERVICE PGSERVICEFILE DOCKER_HOST DOCKER_CONTEXT; do
            [[ -z "$(printenv "$key" || true)" ]] || { echo "::error::Remote target alias forbidden: $key"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert 21 upstream fingerprint source integrity and fail-closed cases
        run: node scripts/verify-v3-s06-hosted-upstream-rpc-catalog.mjs --self-test
      - name: Assert all-hosted catalog digests and incomplete-fixture rejection (offline only)
        run: |
          node --test scripts/verify-v3-s06-hosted-catalog-coverage.test.mjs
          node --test scripts/verify-v3-s06-seven-relation-parity.test.mjs
      - name: Verify and obtain pinned PG17.11
        run: |
          set -euo pipefail
          docker pull postgres:17.11
          [[ "$(docker image inspect --format '{{.Id}}' postgres:17.11)" == "sha256:eb0fb2377534e65aad04f37838956b3dfb888e1a3dd3c1acf957bc6557eb6c7d" ]] || exit 1
      - name: Rehearse exact SHA with the S02 56-table hosted-observed schema
        shell: bash
        run: |
          set -euo pipefail
          cid=""
          cleanup() {
            code=$?
            if [[ -n "$cid" ]]; then docker rm -f "$cid" >/dev/null || code=1; fi
            exit "$code"
          }
          trap cleanup EXIT
          cid="$(docker run -d --rm --pull=never --network none --name "solaris-s06-hosted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -e POSTGRES_PASSWORD=s06_disposable postgres:17.11)"
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" == none ]] || exit 1
          [[ "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid")" == '{}' ]] || exit 1
          ready=false
          for n in $(seq 1 45); do
            if docker exec "$cid" pg_isready -h /var/run/postgresql -U postgres >/dev/null; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]] || exit 1
          sql() { docker exec -i "$cid" psql -w -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres "$@"; }
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-54-table-schema-fixture.sql
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-extra-2-dependencies-local.sql
          # Reuse independently proven S06 seven-object zero-row fixture in
          # the SAME isolated database, not a separate synthetic test.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-seven-no-fk-relations-local.sql
          sql -f - < scripts/v3-s02-hosted-archive-catalog-local.sql > /tmp/s06-archive-catalog.json
          node scripts/verify-v3-s02-s14-archive-catalog.mjs /tmp/s06-archive-catalog.json s06-archive-catalog-proof.json
          sql -f - < scripts/v3-s02-hosted-nine-parent-catalog-local.sql > /tmp/s06-parent-catalog.json
          node scripts/verify-v3-s02-parent-catalog.mjs /tmp/s06-parent-catalog.json s06-parent-catalog-proof.json
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-56-table-grants-local.sql
          # The original S02 comparison is strictly 56 IDs. Keep that
          # comparator UNCHANGED; explicitly prove the seven other tables are
          # exactly the expected known additions, then scope its JSON input.
          sql -f - < scripts/v3-s02-hosted-56-acl-local.sql > /tmp/s06-acl-63.json
          node - <<'NODE'
          const fs = require('node:fs');
          const actual = JSON.parse(fs.readFileSync('/tmp/s06-acl-63.json','utf8'));
          const frozen = JSON.parse(fs.readFileSync(
            'docs/v3/recovery-candidates/evidence/s02-hosted-s14-56-table-acls-2026-11-09.json','utf8'
          ));
          const scoped = new Set(Object.keys(frozen.privileges));
          const added = new Set([
            'private.country_auth_rate_limits',
            'private.studio2_platform_exit_write_probe',
            'public.ssc_rule_registry',
            'public.studio2_televote_global_versions',
            'public.studio2_televote_round_versions',
            'televoting.legacy_friend_voting_relationships',
            'televoting.legacy_import_metadata',
          ]);
          const identities = actual.tables.map(t => t.relation);
          const found = new Set(identities);
          if (scoped.size !== 56 || added.size !== 7 || actual.tables.length !== 63
            || found.size !== 63 || actual.schemas.length !== 4
            || ![...scoped, ...added].every(k => found.has(k))
            || identities.some(k => !scoped.has(k) && !added.has(k))) {
            throw Error('S06 fail closed: 56 frozen S02 identities + seven known extras not exact');
          }
          fs.writeFileSync('/tmp/s06-acl-56-scoped.json', JSON.stringify({
            tables: actual.tables.filter(t => scoped.has(t.relation)), schemas: actual.schemas
          }));
          console.log('S06: scoped exact 56 ACL identities without dropping seven table evidence');
          NODE
          node scripts/verify-v3-s02-56-acl.mjs /tmp/s06-acl-56-scoped.json s06-acl-proof.json
          # Compare 21 exact upstream RPCs to bounded read-only hosted catalog
          # fingerprints: definitions, owner, privileges and security flags.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-upstream-rpc-acls-local.sql
          sql -f - < scripts/v3-s06-hosted-upstream-rpc-catalog-local.sql > /tmp/s06-upstream-rpc.json
          node scripts/verify-v3-s06-hosted-upstream-rpc-catalog.mjs /tmp/s06-upstream-rpc.json s06-upstream-rpc-proof.json
          [[ "$(sql -c 'show server_version_num')" == 170011 ]] || exit 1

          # S06 FULL COVERAGE NEGATIVE: integrated 63-table scope must NEVER pass a
          # 215-relation / 727-function hosted-equivalence fingerprint gate.
          # This step is NOT S06 certification. It only proves safe refusal.
          sql -f - < scripts/v3-s06-hosted-catalog-digests-local.sql > /tmp/s06-full-catalog-local.json
          # Assert exactly 56 original + 7 independent names and isolate seven
          # actual catalog entries for complete per-field digest comparison.
          node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('/tmp/s06-full-catalog-local.json', 'utf8'));
          const names = new Set([
            'private.country_auth_rate_limits',
            'private.studio2_platform_exit_write_probe',
            'public.ssc_rule_registry',
            'public.studio2_televote_global_versions',
            'public.studio2_televote_round_versions',
            'televoting.legacy_friend_voting_relationships',
            'televoting.legacy_import_metadata',
          ]);
          const actual = d.relations.filter(r => names.has(r.schema_name + '.' + r.object_name));
          if (d.relations.length !== 63 || actual.length !== 7
             || new Set(d.relations.map(r => r.schema_name + '.' + r.object_name)).size !== 63) {
            throw Error('S06 combined fixture must contain exactly 63 distinct tables, including all seven new identities');
          }
          fs.writeFileSync('/tmp/s06-seven-in-63-local.json', JSON.stringify({
            pg_version_num: d.pg_version_num, relations: actual
          }));
          console.log('S06: exactly 63 distinct tables installed in one networkless PG17.11 fixture');
          NODE
          node scripts/verify-v3-s06-seven-relation-parity.mjs             docs/v3/recovery-candidates/evidence/s06-hosted-catalog-digests-2026-11-10.json             /tmp/s06-seven-in-63-local.json /tmp/s06-seven-63-proof.json
          # The remaining 56 host-observed objects retain their existing scope
          # comparators. DO NOT treat seven-table parity as full 63-table parity.
          set +e
          node scripts/verify-v3-s06-hosted-catalog-coverage.mjs \
            docs/v3/recovery-candidates/evidence/s06-hosted-catalog-digests-2026-11-10.json \
            /tmp/s06-full-catalog-local.json > /tmp/s06-full-coverage-result.json
          coverage_rc="$?"
          set -e
          [[ "$coverage_rc" == 1 ]] || { echo "::error::Incomplete fixture did not fail closed"; exit 1; }
          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/s06-full-coverage-result.json', 'utf8'));
          if (result.status !== 'S06_CATALOG_COVERAGE_BLOCKED'
              || result.expected.relations !== 215 || result.expected.routines !== 727
              || result.observed.relations !== 63
              || result.observed.routines >= 727) {
            throw Error('Unexpected S06 full-hosted coverage finding');
          }
          console.log('PASS: INTEGRATED 63-TABLE FIXTURE; full hosted equivalence REJECTED; S06 remains PARTIAL/BLOCKED.');
          console.log('Observed local relations: ' + result.observed.relations + '/215.');
          console.log('Observed local functions: ' + result.observed.routines + '/727.');
          NODE


          # Missing S13 must fail before Archive DDL, with a catalog proof.
          if sql -f - < docs/v3/recovery-candidates/forward-only-s14-archive-integrated-local.sql > /tmp/s06-s13-absent.log 2>&1; then
            echo "::error::S14 accepted missing S13 foundation"; exit 1
          fi
          grep -q 'S14 Archive recovery BLOCKED: S13 governance foundation absent' /tmp/s06-s13-absent.log || exit 1
          [[ "$(sql -c "select (to_regclass('private.v3_archive_runtime_transition_gates') is null)::text")" == true ]] || exit 1

          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s13-prerequisite-local.sql
          sql -f - < docs/v3/recovery-candidates/forward-only-s13-foundation.sql

          # A failed install on the hosted-observed fixture must leave no
          # partially created Archive functions, triggers, grants or records.
          # This is a disposable, networkless container; never production.
          archive_schema_digest() {
            # PG17.11 uses a random pg_dump \\restrict key by default. The
            # fixed test-only key makes two LOCAL schema dumps comparable.
            # Never pin a restrict key on untrusted/hosted SQL dumps.
            docker exec "$cid" pg_dump -U postgres -d postgres --schema-only --no-comments --restrict-key=S06LocalOnlyStable |
              sha256sum | awk '{print $1}'
          }
          schema_before="$(archive_schema_digest)"
          contracts_before="$(sql -c "select count(*) from private.v3_migration_contracts")"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('docs/v3/recovery-candidates/forward-only-s14-archive-integrated-local.sql').read_text()
          trigger = 'create trigger v3_guard_archive_runtime_transition'
          next_function = 'create or replace function private.v3_edition_final_results_ready('
          assert source.count(next_function) >= 1, 'S14 source anchor missing'
          assert 0 < source.index(trigger) < source.index(next_function), 'Archive trigger must precede injection'
          exception = "do $s06_local_interrupt$ begin raise exception 'S06 hosted-fixture injected post-DDL failure'; end $s06_local_interrupt$;\n\n"
          injected = source.replace(next_function, exception + next_function, 1)
          assert injected != source
          Path('/tmp/s06-hosted-interrupted.sql').write_text(injected)
          PY
          if sql -f - < /tmp/s06-hosted-interrupted.sql > /tmp/s06-hosted-interrupted.log 2>&1; then
            echo "::error::Injected hosted-fixture failure did not interrupt Archive"; exit 1
          fi
          grep -Fq 'S06 hosted-fixture injected post-DDL failure' /tmp/s06-hosted-interrupted.log || {
            echo "::error::Unexpected Archive interruption error"; exit 1;
          }
          [[ "$schema_before" == "$(archive_schema_digest)" ]] || {
            echo "::error::Post-DDL interruption changed hosted-observed fixture schema/ACL"; exit 1;
          }
          [[ "$contracts_before" == "$(sql -c "select count(*) from private.v3_migration_contracts")" ]] || {
            echo "::error::Post-DDL interruption changed semantic registry records"; exit 1;
          }
          [[ "$(sql -c "select (to_regprocedure('private.v3_guard_archive_runtime_transition()') is null and to_regclass('private.v3_archive_runtime_transition_gates') is null)::text")" == true ]] || {
            echo "::error::Post-DDL interruption left a partial Archive function/gate"; exit 1;
          }

          # Restart on the SAME disposable hosted-observed database, without
          # modifying the original candidate or resetting the S13 foundation.
          sql -f - < docs/v3/recovery-candidates/forward-only-s14-archive-integrated-local.sql
          echo "PASS: hosted-observed fixture post-DDL rollback and same-DB S14 restart"
          before="$(sql -c "select (select count(*) from private.v3_migration_contracts)::text || '|' || (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='private' and c.relname like 'v3_archive_%')::text")"
          if sql -f - < docs/v3/recovery-candidates/forward-only-s14-archive-integrated-local.sql > /tmp/s06-duplicate.log 2>&1; then
            echo "::error::Archive forward candidate allowed duplicate application"; exit 1
          fi
          grep -q 'S14 Archive recovery BLOCKED:' /tmp/s06-duplicate.log || exit 1
          after="$(sql -c "select (select count(*) from private.v3_migration_contracts)::text || '|' || (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='private' and c.relname like 'v3_archive_%')::text")"
          [[ "$before" == "$after" ]] || { echo "::error::Duplicate Archive attempt changed catalog"; exit 1; }
          denied="$(sql -c "select has_table_privilege('anon','private.v3_archive_runtime_transition_gates','INSERT')::text || '|' || has_table_privilege('authenticated','private.v3_archive_runtime_transition_gates','INSERT')::text || '|' || has_table_privilege('service_role','private.v3_archive_runtime_transition_gates','INSERT')::text")"
          [[ "$denied" == 'false|false|false' ]] || exit 1
          # Explicitly re-read seven table fingerprints AFTER S13, successful
          # S14, duplicate refusal and rollback/restart. No evidence of drift
          # in the same DB is stronger than pre-recovery-only checking.
          sql -f - < scripts/v3-s06-hosted-catalog-digests-local.sql > /tmp/s06-post-s14-full-catalog-local.json
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const pre = JSON.parse(fs.readFileSync('/tmp/s06-seven-in-63-local.json','utf8'));
          const post = JSON.parse(fs.readFileSync('/tmp/s06-post-s14-full-catalog-local.json','utf8'));
          const names = new Set(pre.relations.map(r => r.schema_name + '.' + r.object_name));
          const actual = post.relations.filter(r => names.has(r.schema_name + '.' + r.object_name));
          assert.equal(actual.length, 7, 'seven observed relations must survive S13->S14');
          assert.deepEqual(actual, pre.relations, 'seven hosted-observed table definitions, RLS and grants drifted through S13->S14');
          console.log('PASS: seven complete table fingerprints unchanged after S13->S14, restart and duplicate refusal');
          NODE
          [[ "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" == none ]] || exit 1
          [[ "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid")" == '{}' ]] || exit 1
          docker rm -f "$cid" >/dev/null
          cid=""
          echo "PASS: S13 then S14 against integrated 63 hosted-observed PG17.11 tables (56 scoped + seven full fingerprints); missing S13/duplicate fail closed."
          echo "LIMITATION: 63/215 table names, only seven new full-field digests; no production rows; NOT fully hosted-equivalent or S06 certified."

      - name: Retain scoped proof without implying production parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s06-hosted-observed-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            s06-archive-catalog-proof.json
            s06-parent-catalog-proof.json
            s06-acl-proof.json
            s06-upstream-rpc-proof.json
            /tmp/s06-seven-63-proof.json
          if-no-files-found: ignore
          retention-days: 14
