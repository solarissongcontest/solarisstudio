name: V3 S14 Archive forward-effects recovery local proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v3-s14-archive-forward-effects-local.yml"
      - "scripts/rehearse-v3-s14-archive-forward-effects-local.sh"
      - "scripts/v3-s14-archive-forward-effects.contract.test.mjs"
      - "scripts/v3-s06-hosted-upstream-rpc-catalog-local.sql"
      - "scripts/v3-s06-hosted-catalog-digests-local.sql"
      - "scripts/verify-v3-s06-hosted-catalog-coverage.mjs"
      - "scripts/verify-v3-s06-hosted-catalog-coverage.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-catalog-digests-2026-11-10.json"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-relation-coverage-gap-20261110.json"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-seven-no-fk-relations-local.sql"
      - "scripts/verify-v3-s06-seven-relation-parity.mjs"
      - "scripts/verify-v3-s06-seven-relation-parity.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-five-version-ledgers-local.sql"
      - "scripts/verify-v3-s06-five-ledger-parity.mjs"
      - "scripts/verify-v3-s06-five-ledger-parity.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-eight-fk-closed-relations-local.sql"
      - "scripts/verify-v3-s06-eight-relation-parity.mjs"
      - "scripts/verify-v3-s06-eight-relation-parity.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-seven-jury-integrity-account-local.sql"
      - "scripts/verify-v3-s06-seven-secure-relation-parity.mjs"
      - "scripts/verify-v3-s06-seven-secure-relation-parity.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-seventeen-next-relations-local.sql"
      - "scripts/verify-v3-s06-seventeen-relation-parity.mjs"
      - "scripts/verify-v3-s06-seventeen-relation-parity.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-fifty-next-relations-local.sql"
      - "scripts/verify-v3-s06-fifty-relation-parity.mjs"
      - "scripts/verify-v3-s06-fifty-relation-parity.test.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-second-fifty-relations-local.sql"
      - "scripts/verify-v3-s06-second-fifty-relation-parity.mjs"
      - "scripts/verify-v3-s06-second-fifty-relation-parity.test.mjs"
      - "scripts/verify-v3-s06-hosted-upstream-rpc-catalog.mjs"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-upstream-rpc-fingerprints-20261110.json"
      - "docs/v3/recovery-candidates/evidence/s06-hosted-upstream-rpc-acls-local.sql"
      - "docs/v3/recovery-candidates/forward-only-s13-foundation.sql"
      - "docs/v3/recovery-candidates/forward-only-s14-archive-integrated-local.sql"
      - "supabase/migrations/20261003003000_organisation_os_v5_task_notifications.sql"
      - "supabase/migrations/20261019112100_v3_s14_archive_consequence_reconciliation.sql"
      - "supabase/migrations/20261019112200_v3_s14_final_results_readiness_hardening.sql"
      - "supabase/migrations/20261019202636_v3_s14_resolved_task_delivery_reconciliation.sql"
      - "supabase/migrations/20261020140000_v3_s14_archive_runtime_update_guard.sql"
      - "supabase/migrations/20261021161000_v3_s14_task_reconciliation_service_boundary.sql"
      - "supabase/migrations/20261019112300_v3_s14_transition_http409.sql"
      - "supabase/migrations/20261019112400_v3_s14_archive_task_registry_alignment.sql"
      - "supabase/migrations/20261019112500_v3_s14_resolved_task_notification_invariant.sql"
      - "supabase/migrations/20261020130000_v3_s14_archive_invariant_forward_fixes.sql"
      - "supabase/migrations/20261021110000_v3_s14_archive_guard_authority_forward_fix.sql"
      - "supabase/migrations/20261021163000_v3_s14_failed_task_delivery_evidence.sql"
      - "supabase/migrations/20261021202000_v3_s14_archive_reconciliation_convergence.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-archive-forward-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-forward-upgrade:
    name: Local full-chain -> Archive-gap -> forward-effects -> canonical behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLARIS_RUN_LOCAL_DB_REHEARSAL: "YES"
      SOLARIS_VERIFICATION_TARGET: local
      SUPABASE_PROJECT_ID: local
      SUPABASE_PROJECT_REF: local
      SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - name: Checkout reviewed exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Refuse hosted config and stale source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SHA" ]] || exit 1
          [[ "$SOLARIS_VERIFICATION_TARGET" == local ]] || exit 1
          [[ "$SUPABASE_URL" == http://127.0.0.1:54321 ]] || exit 1
          for name in DATABASE_URL POSTGRES_URL SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN PGSERVICE PGSERVICEFILE PGHOST PGHOSTADDR; do
            [[ -z "${!name:-}" ]] || { echo "::error::Refusing remote DB config $name"; exit 1; }
          done

      - name: Verify Archive source-integrity tests without dependencies
        run: node --test scripts/v3-s14-archive-forward-effects.contract.test.mjs

      - name: Check shell syntax
        run: bash -n scripts/rehearse-v3-s14-archive-forward-effects-local.sh

      - name: Set up Bun for canonical Archive integration scripts
        uses: oven-sh/setup-bun@v2

      - name: Set up Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: bash .github/scripts/v3-start-disposable-supabase.sh

      - name: Rebuild disposable full source migration chain
        run: supabase db reset --local --no-seed

      - name: Simulate missing S13 and S14 effects, restore in dependency order
        env:
          SOLARIS_INCLUDE_S13_FORWARD_RECOVERY: "YES"
        run: bash scripts/rehearse-v3-s14-archive-forward-effects-local.sh

      - name: Rehearse governed Archive, results, receipt and S4 consequence behavior
        run: bash .github/scripts/v3-s14-archive-system-rehearsal.sh

      - name: Test Archive authorization, invalid transitions and irreversible state
        run: bash .github/scripts/v3-s14-archive-guard-rehearsal.sh

      - name: Test archive runtime deletion and terminal boundaries
        run: bash .github/scripts/v3-s14-archive-delete-guard-rehearsal.sh

      - name: Test terminal Tasks, failed delivery evidence and notification convergence
        run: bash .github/scripts/v3-s14-archive-task-resurrection-rehearsal.sh

      - name: Second independent clean replay and interrupted-restart proof
        env:
          SOLARIS_INCLUDE_S13_FORWARD_RECOVERY: "YES"
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed
          bash scripts/rehearse-v3-s14-archive-forward-effects-local.sh
          bash .github/scripts/v3-s14-archive-system-rehearsal.sh

      - name: State release boundary
        run: |
          echo "This used only synthetic local Supabase and a simulated Archive gap."
          echo "It does NOT reproduce full hosted production schema/migration history, certify release readiness, or authorize hosted DDL."

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true


  hosted-observed-archive-scope:
    name: Networkless PG17.11 hosted-observed Archive-scope upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOLARIS_S02_TARGET: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Reject remote database and Docker aliases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXACT_SHA" ]] || exit 1
          for key in SUPABASE_URL VITE_SUPABASE_URL E2E_SUPABASE_URL CONFIRMATIONS_SUPABASE_URL VITE_CONFIRMATIONS_SUPABASE_URL DATABASE_URL POSTGRES_URL SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY PGHOST PGHOSTADDR PGPORT PGSERVICE PGSERVICEFILE DOCKER_HOST DOCKER_CONTEXT; do
            [[ -z "$(printenv "$key" || true)" ]] || { echo "::error::Remote target alias forbidden: $key"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert 21 upstream fingerprint source integrity and fail-closed cases
        run: node scripts/verify-v3-s06-hosted-upstream-rpc-catalog.mjs --self-test
      - name: Assert all-hosted catalog digests and incomplete-fixture rejection (offline only)
        run: |
          node --test scripts/verify-v3-s06-hosted-catalog-coverage.test.mjs
          node --test scripts/verify-v3-s06-seven-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-five-ledger-parity.test.mjs
          node --test scripts/verify-v3-s06-eight-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-seven-secure-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-seventeen-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-fifty-relation-parity.test.mjs
          node --test scripts/verify-v3-s06-second-fifty-relation-parity.test.mjs
      - name: Verify and obtain pinned PG17.11
        run: |
          set -euo pipefail
          docker pull postgres:17.11
          [[ "$(docker image inspect --format '{{.Id}}' postgres:17.11)" == "sha256:eb0fb2377534e65aad04f37838956b3dfb888e1a3dd3c1acf957bc6557eb6c7d" ]] || exit 1
      - name: Rehearse exact SHA with the S02 56-table hosted-observed schema
        shell: bash
        run: |
          set -euo pipefail
          cid=""
          cleanup() {
            code=$?
            if [[ -n "$cid" ]]; then docker rm -f "$cid" >/dev/null || code=1; fi
            exit "$code"
          }
          trap cleanup EXIT
          cid="$(docker run -d --rm --pull=never --network none --name "solaris-s06-hosted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -e POSTGRES_PASSWORD=s06_disposable \
            -e POSTGRES_INITDB_ARGS="--locale-provider=icu --icu-locale=en-US" postgres:17.11)"
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" == none ]] || exit 1
          [[ "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$cid")" == '{}' ]] || exit 1
          # Docker's first pg_isready can observe the SHORT-LIVED initdb server,
          # which shuts down before the real PG17.11 server starts. Never race it.
          ready=false
          for n in $(seq 1 75); do
            if docker logs "$cid" 2>&1 | grep -Fq 'PostgreSQL init process complete; ready for start up.' \
              && docker exec "$cid" pg_isready -h /var/run/postgresql -U postgres >/dev/null; then
              ready=true; break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || { docker logs "$cid" 2>&1 | tail -80; exit 1; }
          sql() { docker exec -i "$cid" psql -w -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres "$@"; }
          # Hosted catalog probe confirmed PG17.11 with datlocprovider=i and
          # datlocale=en-US. Preserve hosted ICU collation for deterministic
          # index-name ordering inside the original unchanged digest query.
          [[ "$(sql -c "select (datlocprovider='i' and datlocale='en-US')::text from pg_database where datname=current_database()")" == true ]] ||
            { echo "::error::S06 requires hosted en-US ICU database collation"; exit 1; }
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-54-table-schema-fixture.sql
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-archive-extra-2-dependencies-local.sql
          # Reuse independently proven S06 seven-object zero-row fixture in
          # the SAME isolated database, not a separate synthetic test.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-seven-no-fk-relations-local.sql
          # Five hosted-observed FK ledgers have real parents in the 56 S02 tables.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-five-version-ledgers-local.sql
          # All eight newly observed objects are FK-closed by 68 prior tables
          # or by the staged releases->events order; no application rows.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-eight-fk-closed-relations-local.sql
          # Seven new FK-closed tables: Jury, Televoting integrity, account sessions. Zero rows.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-seven-jury-integrity-account-local.sql
          # 17 new hosted-observed zero-row tables; auth ownership + FK closure verified strictly.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-seventeen-next-relations-local.sql
          # Fifty additional FK-closed hosted-observed metadata identities, NO application rows.
          # Trigger placeholders are fail-closed catalog fixtures; not runtime function parity.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-fifty-next-relations-local.sql
          # 50 more dependency-closed catalog-only relations; the first 150 must remain unchanged.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-second-fifty-relations-local.sql
          sql -f - < scripts/v3-s02-hosted-archive-catalog-local.sql > /tmp/s06-archive-catalog.json
          node scripts/verify-v3-s02-s14-archive-catalog.mjs /tmp/s06-archive-catalog.json s06-archive-catalog-proof.json
          sql -f - < scripts/v3-s02-hosted-nine-parent-catalog-local.sql > /tmp/s06-parent-catalog.json
          node scripts/verify-v3-s02-parent-catalog.mjs /tmp/s06-parent-catalog.json s06-parent-catalog-proof.json
          sql -f - < docs/v3/recovery-candidates/evidence/s02-hosted-s14-56-table-grants-local.sql
          # The original S02 comparison is strictly 56 IDs. Keep that
          # comparator UNCHANGED; explicitly prove the original 44 additions and
          # another 50 distinct new identities, then scope its original JSON input.
          sql -f - < scripts/v3-s02-hosted-56-acl-local.sql > /tmp/s06-acl-76.json
          node - <<'NODE'
          const fs = require('node:fs');
          const actual = JSON.parse(fs.readFileSync('/tmp/s06-acl-76.json','utf8'));
          const frozen = JSON.parse(fs.readFileSync(
            'docs/v3/recovery-candidates/evidence/s02-hosted-s14-56-table-acls-2026-11-09.json','utf8'
          ));
          const scoped = new Set(Object.keys(frozen.privileges));
          const added = new Set([
            'private.country_auth_rate_limits',
            'private.studio2_platform_exit_write_probe',
            'public.ssc_rule_registry',
            'public.studio2_televote_global_versions',
            'public.studio2_televote_round_versions',
            'televoting.legacy_friend_voting_relationships',
            'televoting.legacy_import_metadata',
            'public.studio2_confirmation_review_versions',
            'public.studio2_confirmation_round_versions',
            'public.studio2_jury_window_versions',
            'public.studio2_participation_status_versions',
            'public.studio2_permission_subject_versions',
            'private.v3_confirmation_account_drafts',
            'private.v3_televote_recovery_handles',
            'public.ssc_rulebook_events',
            'public.ssc_rulebook_releases',
            'public.studio2_eligibility_override_versions',
            'public.studio2_next_in_line_submission_revisions',
            'public.studio2_platform_operational_state',
            'public.studio2_voting_declaration_policy',
            'private.v3_jury_drafts',
            'private.v3_jury_operations',
            'public.studio2_account_session_revocations',
            'televoting.historical_vote_observations',
            'televoting.integrity_action_audit',
            'televoting.vote_integrity_decisions',
            'televoting.voter_sanctions',
            'auth.audit_log_entries',
            'auth.instances',
            'auth.oauth_client_states',
            'auth.schema_migrations',
            'public.ssc_rule_interpretations',
            'public.ssc_rulebook_change_items',
            'public.studio2_country_media_upload_tokens',
            'public.studio2_host_bids',
            'public.studio2_host_bid_evaluations',
            'public.studio2_host_operation_executions',
            'public.studio2_host_operations',
            'public.studio2_platform_exit_preflights',
            'public.studio2_story_operation_executions',
            'public.studio2_storyline_items',
            'public.studio2_storylines',
            'public.studio2_upload_authorizations',
            'televoting.round_influence_results',
          ]);
          const fifty = new Set([...fs.readFileSync(
            "docs/v3/recovery-candidates/evidence/s06-hosted-fifty-next-relations-local.sql", "utf8"
          ).matchAll(/CREATE TABLE "([a-z]+)"\."([a-z_0-9]+)"/g)].map(m => m[1]+"."+m[2]));
          const secondFifty = new Set([...fs.readFileSync(
            "docs/v3/recovery-candidates/evidence/s06-hosted-second-fifty-relations-local.sql", "utf8"
          ).matchAll(/CREATE TABLE "([a-z]+)"\."([a-z_0-9]+)"/g)].map(m => m[1]+"."+m[2]));
          const identities = actual.tables.map(t => t.relation);
          const found = new Set(identities);
          if (scoped.size !== 56 || added.size !== 44 || fifty.size !== 50 || secondFifty.size !== 50
            || [...fifty].some(k => scoped.has(k) || added.has(k))
            || [...secondFifty].some(k => scoped.has(k) || added.has(k) || fifty.has(k))
            || actual.tables.length !== 200 || found.size !== 200 || actual.schemas.length !== 4
            || ![...scoped, ...added, ...fifty, ...secondFifty].every(k => found.has(k))
            || identities.some(k => !scoped.has(k) && !added.has(k) && !fifty.has(k) && !secondFifty.has(k))) {
            throw Error('S06 fail closed: 56 frozen S02 + 44 prior + 50 first + 50 second not exact');
          }
          fs.writeFileSync('/tmp/s06-acl-56-scoped.json', JSON.stringify({
            tables: actual.tables.filter(t => scoped.has(t.relation)), schemas: actual.schemas
          }));
          console.log('S06: scoped 56 original ACL identities, retaining 144 strict full-field tables');
          NODE
          node scripts/verify-v3-s02-56-acl.mjs /tmp/s06-acl-56-scoped.json s06-acl-proof.json
          # Compare 21 exact upstream RPCs to bounded read-only hosted catalog
          # fingerprints: definitions, owner, privileges and security flags.
          sql -f - < docs/v3/recovery-candidates/evidence/s06-hosted-upstream-rpc-acls-local.sql
          sql -f - < scripts/v3-s06-hosted-upstream-rpc-catalog-local.sql > /tmp/s06-upstream-rpc.json
          node scripts/verify-v3-s06-hosted-upstream-rpc-catalog.mjs /tmp/s06-upstream-rpc.json s06-upstream-rpc-proof.json
          [[ "$(sql -c 'show server_version_num')" == 170011 ]] || exit 1

          # S06 FULL COVERAGE NEGATIVE: integrated 200-table scope must NEVER pass a
          # 215-relation / 727-function hosted-equivalence fingerprint gate.
          # This step is NOT S06 certification. It only proves safe refusal.
          sql -f - < scripts/v3-s06-hosted-catalog-digests-local.sql > /tmp/s06-full-catalog-local.json
          # Assert 56 original + 44 prior + 50 first + 50 second catalog identities;
          # compare all 144 newer tables with complete 17-field catalog digests.
          node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('/tmp/s06-full-catalog-local.json', 'utf8'));
          const names = new Set([
            'private.country_auth_rate_limits',
            'private.studio2_platform_exit_write_probe',
            'public.ssc_rule_registry',
            'public.studio2_televote_global_versions',
            'public.studio2_televote_round_versions',
            'televoting.legacy_friend_voting_relationships',
            'televoting.legacy_import_metadata',
          ]);
          const five = new Set([
            'public.studio2_confirmation_review_versions',
            'public.studio2_confirmation_round_versions',
            'public.studio2_jury_window_versions',
            'public.studio2_participation_status_versions',
            'public.studio2_permission_subject_versions',
          ]);
          const eight = new Set([
            'private.v3_confirmation_account_drafts',
            'private.v3_televote_recovery_handles',
            'public.ssc_rulebook_events',
            'public.ssc_rulebook_releases',
            'public.studio2_eligibility_override_versions',
            'public.studio2_next_in_line_submission_revisions',
            'public.studio2_platform_operational_state',
            'public.studio2_voting_declaration_policy',
          ]);
          const secure = new Set([
            'private.v3_jury_drafts',
            'private.v3_jury_operations',
            'public.studio2_account_session_revocations',
            'televoting.historical_vote_observations',
            'televoting.integrity_action_audit',
            'televoting.vote_integrity_decisions',
            'televoting.voter_sanctions',
          ]);
          const seventeen = new Set([
            'auth.audit_log_entries',
            'auth.instances',
            'auth.oauth_client_states',
            'auth.schema_migrations',
            'public.ssc_rule_interpretations',
            'public.ssc_rulebook_change_items',
            'public.studio2_country_media_upload_tokens',
            'public.studio2_host_bids',
            'public.studio2_host_bid_evaluations',
            'public.studio2_host_operation_executions',
            'public.studio2_host_operations',
            'public.studio2_platform_exit_preflights',
            'public.studio2_story_operation_executions',
            'public.studio2_storyline_items',
            'public.studio2_storylines',
            'public.studio2_upload_authorizations',
            'televoting.round_influence_results',
          ]);
          const fifty = new Set([...fs.readFileSync(
            'docs/v3/recovery-candidates/evidence/s06-hosted-fifty-next-relations-local.sql','utf8'
          ).matchAll(/CREATE TABLE "([a-z]+)"\."([a-z_0-9]+)"/g)].map(m=>m[1]+'.'+m[2]));
          const secondFifty = new Set([...fs.readFileSync(
            'docs/v3/recovery-candidates/evidence/s06-hosted-second-fifty-relations-local.sql','utf8'
          ).matchAll(/CREATE TABLE "([a-z]+)"\."([a-z_0-9]+)"/g)].map(m=>m[1]+'.'+m[2]));
          const id = r => r.schema_name + '.' + r.object_name;
          const actual = d.relations.filter(r => names.has(id(r)));
          const fiveActual = d.relations.filter(r => five.has(id(r)));
          const eightActual = d.relations.filter(r => eight.has(id(r)));
          const secureActual = d.relations.filter(r => secure.has(id(r)));
          const seventeenActual = d.relations.filter(r => seventeen.has(id(r)));
          const prior27 = new Set([...names,...five,...eight,...secure]);
          const combined44 = new Set([...prior27,...seventeen]);
          const twentySeven = d.relations.filter(r => prior27.has(id(r)));
          const fortyFour = d.relations.filter(r => combined44.has(id(r)));
          const ninetyFour = new Set([...combined44,...fifty]);
          const oneFortyFour = new Set([...ninetyFour,...secondFifty]);
          const fiftyActual = d.relations.filter(r => fifty.has(id(r)));
          const ninetyFourActual = d.relations.filter(r => ninetyFour.has(id(r)));
