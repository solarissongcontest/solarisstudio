name: V3 P14 Entry Media Rehearsal

on:
  pull_request:
    branches:
      - main
      - v3/sys-entry-media-participant-current-main
    paths:
      - "supabase/migrations/20261019235500_v3_p14_entry_media_participant_authority.sql"
      - "supabase/migrations/20261019235900_v3_p14_entry_media_commit_receipt.sql"
      - "src/lib/v3-entry-media-authority.ts"
      - "src/lib/v3-entry-media-authority*.test.ts"
      - ".github/scripts/v3-p14-entry-media-rehearsal.sh"
      - ".github/workflows/v3-p14-entry-media-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-p14-entry-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + participant media authority proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local --no-seed

      - name: Rehearse participant Entry Media authority
        shell: bash
        run: bash .github/scripts/v3-p14-entry-media-rehearsal.sh

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + participant media authority proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-p14-main origin/main

      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-p14-main
          supabase start
          supabase db reset --local --no-seed

      - name: Apply exact branch migration delta
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-copy-migration-delta.sh" "$GITHUB_WORKSPACE" /tmp/solaris-p14-main
          cd /tmp/solaris-p14-main
          supabase migration up --local --include-all

      - name: Rehearse participant Entry Media authority after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-p14-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-p14-entry-media-rehearsal.sh"

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-p14-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
