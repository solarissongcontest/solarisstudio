name: V3 S9 Operation Trace rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s9-operation-trace-rehearsal.sh"
      - ".github/workflows/v3-s9-operation-trace-rehearsal.yml"
      - "src/lib/v3-s9-operation-trace.contract.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s9-operation-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + privacy-safe operation trace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain locally
        run: supabase db reset --local --no-seed
      - name: Rehearse operation trace projection
        run: bash .github/scripts/v3-s9-operation-trace-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + privacy-safe operation trace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s9-trace-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s9-trace-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply feature migration delta locally
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete "$GITHUB_WORKSPACE/supabase/migrations/" /tmp/solaris-s9-trace-main/supabase/migrations/
          cd /tmp/solaris-s9-trace-main
          supabase migration up --local --include-all
      - name: Rehearse operation trace after upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s9-trace-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s9-operation-trace-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-s9-trace-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
