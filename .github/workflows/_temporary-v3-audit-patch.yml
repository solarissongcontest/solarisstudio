name: Temporary V3 audit patch

on:
  push:
    branches:
      - fix/v3-full-browser-audit-stability

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3-full-browser-audit-stability
          fetch-depth: 0
      - name: Apply verified Browser Audit fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one target, found {count}")
              p.write_text(source.replace(old, new, 1))

          replace_once(
              "src/routes/_authenticated/admin/next-in-line.tsx",
              '''const nextInLineRpc = confirmationsSupabase.rpc as unknown as (\n  functionName: string,\n  args: Record<string, unknown>,\n) => Promise<RpcResult>;''',
              '''const nextInLineRpc = (\n  functionName: string,\n  args: Record<string, unknown>,\n) => confirmationsSupabase.rpc(functionName, args) as Promise<RpcResult>;''',
          )
          replace_once(
              "src/routes/_authenticated/admin/next-in-line.tsx",
              '''            <Input\n              value={query}\n              onChange={(event) => setQuery(event.target.value)}\n              placeholder="Search country, artist or song…"''',
              '''            <Input\n              aria-label="Search Next in Line responses"\n              value={query}\n              onChange={(event) => setQuery(event.target.value)}\n              placeholder="Search country, artist or song…"''',
          )
          replace_once(
              "src/routes/_authenticated/admin/jury/$slug.tsx",
              '''const lifecycleRpc = supabase.rpc as unknown as (\n  functionName: string,\n  args: Record<string, unknown>,\n) => Promise<LifecycleRpcResult>;''',
              '''const lifecycleRpc = (\n  functionName: string,\n  args: Record<string, unknown>,\n) => (supabase as any).rpc(functionName, args) as Promise<LifecycleRpcResult>;''',
          )

          replace_once(
              "e2e/installed-app.e2e.ts",
              '''async function waitForRememberedAppTab(page: Page, activeTab: string) {\n  await expect\n    .poll(() =>\n      page.evaluate(() => {\n        const raw = localStorage.getItem("solaris:app-navigation:v1");\n        if (!raw) return null;\n        try {\n          return JSON.parse(raw).activeTab ?? null;\n        } catch {\n          return null;\n        }\n      }),\n    )\n    .toBe(activeTab);\n}''',
              '''async function readRememberedAppTab(page: Page) {\n  try {\n    return await page.evaluate(() => {\n      const raw = localStorage.getItem("solaris:app-navigation:v1");\n      if (!raw) return null;\n      try {\n        return JSON.parse(raw).activeTab ?? null;\n      } catch {\n        return null;\n      }\n    });\n  } catch (error) {\n    const message = error instanceof Error ? error.message : String(error);\n    if (/execution context was destroyed|cannot find context|navigation/i.test(message)) {\n      return null;\n    }\n    throw error;\n  }\n}\n\nasync function waitForRememberedAppTab(page: Page, activeTab: string) {\n  await expect.poll(() => readRememberedAppTab(page), { timeout: 10_000 }).toBe(activeTab);\n}\n\nasync function expectCommittedPath(page: Page, pathname: string) {\n  await expect\n    .poll(() => {\n      try {\n        return new URL(page.url()).pathname;\n      } catch {\n        return "";\n      }\n    }, { timeout: 8_000 })\n    .toBe(pathname);\n}''',
          )
          replace_once(
              "e2e/installed-app.e2e.ts",
              '''  await launchInstalledApp(page);\n  await expect(page).toHaveURL(/\\/auth(?:\\?|$)/, { timeout: 4_000 });\n\n  await setNavigation("participate", "/televoting");\n  await launchInstalledApp(page);\n  await expect(page).toHaveURL(/\\/participate(?:\\?|$)/, { timeout: 4_000 });''',
              '''  await launchInstalledApp(page);\n  await expectCommittedPath(page, "/auth");\n\n  await setNavigation("participate", "/televoting");\n  await launchInstalledApp(page);\n  await expectCommittedPath(page, "/participate");''',
          )

          Path("src/lib/supabase-rpc-binding.contract.test.ts").write_text('''import { readFileSync } from "node:fs";\n\nimport { describe, expect, it } from "vitest";\n\nconst organizerRpcCallers = [\n  "src/routes/_authenticated/admin/next-in-line.tsx",\n  "src/routes/_authenticated/admin/jury/$slug.tsx",\n] as const;\n\ndescribe("Supabase RPC method binding", () => {\n  it("never detaches rpc from its Supabase client receiver", () => {\n    for (const path of organizerRpcCallers) {\n      const source = readFileSync(path, "utf8");\n      expect(source).not.toMatch(/=\\s*(?:confirmationsSupabase|supabase)\\.rpc\\s+as/);\n    }\n  });\n\n  it("keeps the known dynamic RPC wrappers as client method calls", () => {\n    const nextInLine = readFileSync(organizerRpcCallers[0], "utf8");\n    const jury = readFileSync(organizerRpcCallers[1], "utf8");\n    expect(nextInLine).toContain("confirmationsSupabase.rpc(functionName, args)");\n    expect(jury).toContain("(supabase as any).rpc(functionName, args)");\n  });\n});\n''')

          Path(".github/workflows/_temporary-v3-audit-patch.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix full Browser Audit root causes"
          git push origin HEAD:fix/v3-full-browser-audit-stability
