name: DIAG V4 canon snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diag-v4-canon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canon-snapshot:
    name: Export V4 canon snapshot
    runs-on: ubuntu-slim
    timeout-minutes: 8

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export exact canonical V4 snapshot
        shell: bash
        run: |
          set -euo pipefail
          bun -e '
            import { writeFileSync } from "node:fs";
            import { LEGACY_RULE_ALIASES, SSC_RULE_CHAPTERS } from "./src/lib/ssc-rules/canon-v4.ts";
            const generated = [
              "// Generated by scripts/generate-ssc-rules-static-canon.ts. Do not edit by hand.",
              "import type { SscRuleChapter } from \"@/lib/ssc-rules/types\";",
              "",
              `export const CANONICAL_RULE_CHAPTERS: SscRuleChapter[] = ${JSON.stringify(SSC_RULE_CHAPTERS, null, 2)};`,
              "",
              `export const CANONICAL_LEGACY_RULE_ALIASES: Record<string, string> = ${JSON.stringify(LEGACY_RULE_ALIASES, null, 2)};`,
              "",
            ].join("\n");
            writeFileSync("canon-v4.generated.ts", generated);
            writeFileSync(
              "canon-v4.snapshot.json",
              JSON.stringify({ chapters: SSC_RULE_CHAPTERS, aliases: LEGACY_RULE_ALIASES }, null, 2) + "\n",
            );
          '

      - name: Upload V4 canon snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ssc-v4-static-canon-snapshot
          path: |
            canon-v4.generated.ts
            canon-v4.snapshot.json
          if-no-files-found: error
          retention-days: 1
