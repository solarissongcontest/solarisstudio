name: V3 navbar lock refresh

on:
  push:
    branches: [v3/navbar-complete-redesign]

permissions:
  contents: write

jobs:
  refresh-playwright-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: v3/navbar-complete-redesign
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Add repository-owned Playwright test dependency
        run: bun add --dev --exact @playwright/test@1.55.0

      - name: Remove runtime dependency mutation from Browser Audit
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/browser-audit.yml')
          text = path.read_text()
          old = '''      - name: Install browser-audit runner
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun add --dev @playwright/test@1.55.0 --no-save --network-concurrency 4; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Browser-audit Playwright install failed after ${attempt} attempts."
              exit 1
            fi
            sleep $((attempt * 8))
          done
          bunx playwright install --with-deps chromium webkit
'''
          new = '''      - name: Install browser-audit browser binaries
        run: bunx playwright install --with-deps chromium webkit
'''
          if old not in text:
              raise SystemExit('Expected Browser Audit runner-install block was not found')
          path.write_text(text.replace(old, new))

      - name: Remove one-shot lock refresh workflow
        run: rm .github/workflows/v3-navbar-lock-refresh.yml

      - name: Verify frozen dependency graph includes Playwright
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile
          bunx playwright --version | grep -F 'Version 1.55.0'

      - name: Commit generated dependency graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock .github/workflows/browser-audit.yml .github/workflows/v3-navbar-lock-refresh.yml
          git diff --cached --check
          git commit -m '[V3-NAV] Lock Playwright test runner dependency'
          git push origin HEAD:v3/navbar-complete-redesign
