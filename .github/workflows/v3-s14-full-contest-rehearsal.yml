name: V3 S14 stateful full-contest rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s14-*.sh"
      - ".github/scripts/v3-full-contest-rehearsal.sh"
      - ".github/workflows/v3-s14-full-contest-rehearsal.yml"
      - "scripts/v3-s14-full-contest-spec.ts"
      - "scripts/check-v3-s14-rehearsal-readiness.ts"
      - "scripts/check-v3-s15-*.ts"
      - "scripts/build-v3-s15-zero-orphan-evidence.ts"
      - "src/lib/v3-s14-*.test.ts"
      - "src/components/admin/ShowLineupWorkspace.tsx"
      - "src/lib/show-lineup-selection*"
      - "playwright.s14-grand-final.config.ts"
      - "playwright.s14-grand-final-results.config.ts"
      - "e2e/v3-s14-grand-final-results-runtime.e2e.ts"
      - "e2e/v3-s14-grand-final-runtime.e2e.ts"
      - "src/lib/v3-s15-*.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-stateful-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stateful-rehearsal:
    name: One-state contest lifecycle through Archive + S15 zero-orphan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V3_RELEASE_EVIDENCE_DIR: v3-release-evidence
      V3_S14_ALLOW_PARTIAL: "0"
      V3_S14_REQUIRE_COMPLETE: "1"
      LOCAL_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for canonical Organizer promotion
        run: bunx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild exact migration chain locally
        run: supabase db reset --local --no-seed

      - name: Verify production isolation before destructive rehearsal
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          if [[ "$API_URL" != "$LOCAL_SUPABASE_URL" ]]; then
            echo "::error::Refusing audit server with hosted Supabase URL: $API_URL"
            exit 1
          fi
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::Refusing S14 against non-local Supabase API_URL=$API_URL"; exit 1 ;;
          esac
          export VITE_SUPABASE_URL="$API_URL"
          export SUPABASE_URL="$API_URL"
          export E2E_SUPABASE_URL="$API_URL"
          export VITE_CONFIRMATIONS_SUPABASE_URL="$API_URL"
          export CONFIRMATIONS_SUPABASE_URL="$API_URL"
          export DATABASE_URL="$DB_URL"
          export SUPABASE_PROJECT_ID=local
          export SUPABASE_PROJECT_REF=local
          export E2E_SUPABASE_PROJECT_ID=local
          export E2E_SUPABASE_PROJECT_REF=local
          export VITE_SUPABASE_PROJECT_ID=local
          export VITE_SUPABASE_PROJECT_REF=local
          bun run scripts/check-v3-production-isolation.ts

      - name: Regress canonical Results lineup before full rehearsal
        run: bash .github/scripts/v3-s14-results-lineup-regression.sh

      - name: Regress canonical semi-final qualification before full rehearsal
        run: bash .github/scripts/v3-s14-qualification-regression.sh

      - name: Regress shared integration runtime permissions
        run: bash .github/scripts/v3-s14-integration-runtime-regression.sh

      - name: Verify focused qualifier and Grand Final contracts
        run: |
          bunx vitest run src/lib/v3-s14-grand-final-prep.contract.test.ts src/lib/show-lineup-selection.test.ts
          bunx eslint src/lib/v3-s14-grand-final-prep.contract.test.ts src/lib/show-lineup-selection.ts src/lib/show-lineup-selection.test.ts

      - name: Run complete one-state S14 contest lifecycle
        id: rehearsal
        shell: bash
        run: |
          set -euo pipefail
          export V3_CANDIDATE_SHA="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          bash .github/scripts/v3-full-contest-rehearsal.sh

      - name: Validate exact-SHA S14 evidence
        if: always()
        shell: bash
        env:
          REHEARSAL_OUTCOME: ${{ steps.rehearsal.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          final_path = Path("v3-release-evidence/s14-full-contest.json")
          partial_path = Path("v3-release-evidence/s14-full-contest.partial.json")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          outcome = os.environ.get("REHEARSAL_OUTCOME", "")

          if final_path.is_file() and partial_path.is_file():
              raise SystemExit("S14 emitted both final and partial evidence for one candidate")
          if not final_path.is_file() and not partial_path.is_file():
              raise SystemExit("S14 emitted neither final nor failure evidence")

          expected_stages = [
              "stage-1-setup",
              "stage-2-delegation-onboarding",
              "stage-3-confirmations",
              "stage-4-entries",
              "stage-5-running-orders",
              "stage-6-jury",
              "stage-7-public-voting",
              "stage-8-results",
              "stage-9-publication",
              "stage-10-archive",
          ]
          expected_extensions = [
              "grand-final-qualifier-bridge",
              "grand-final-voting",
              "grand-final-results",
              "grand-final-publication",
          ]
          required_invariants = {
              "confirmation-no-effective-duplicates",
              "entry-valid-revision",
              "media-accepted-revision",
              "jury-single-final-ballot",
              "televote-canonical-ballot",
              "result-reproducible",
              "publication-final-version",
              "tasks-canonical",
              "notifications-reconcilable",
          }
          required_failures = {
              "network-after-commit",
              "db-timeout-before-commit",
              "duplicate-request",
              "worker-crash",
              "realtime-disconnect",
              "stale-client",
              "two-organizers",
              "supabase-outage",
          }

          if outcome == "success":
              if not final_path.is_file():
                  raise SystemExit("successful complete rehearsal did not emit s14-full-contest.json")
              data = json.loads(final_path.read_text())
              if data.get("candidateSha") != sha:
                  raise SystemExit(f"candidate SHA mismatch: {data.get('candidateSha')} != {sha}")
              if data.get("passed") is not True or data.get("partial") is not False or data.get("runtimeFailure") is not False:
                  raise SystemExit("release-grade S14 evidence must be passed=true, partial=false, runtimeFailure=false")
              if data.get("completedStages") != expected_stages or data.get("pendingStages") != []:
                  raise SystemExit(f"S14 lifecycle completion mismatch: completed={data.get('completedStages')} pending={data.get('pendingStages')}")
              if data.get("completedContestExtensions") != expected_extensions:
                  raise SystemExit(f"unexpected completed contest extensions: {data.get('completedContestExtensions')}")
              if data.get("pendingContestExtensions") != [] or data.get("blockedContestExtensions") != []:
                  raise SystemExit("release-grade S14 still has pending/blocked contest extensions")
              missing_invariants = sorted(required_invariants - set(data.get("implementedInvariants", [])))
              missing_failures = sorted(required_failures - set(data.get("implementedFailureInjections", [])))
              if missing_invariants:
                  raise SystemExit(f"S14 omitted required invariant evidence: {missing_invariants}")
              if missing_failures:
                  raise SystemExit(f"S14 omitted required failure-injection evidence: {missing_failures}")
              seed = data.get("seed", {})
              if seed.get("editionCount") != 1 or seed.get("delegationCount") != 66 or seed.get("showCount", 0) < 3:
                  raise SystemExit(f"S14 seed evidence is not the bounded 66-delegation contest: {seed}")
              identity = data.get("runIdentity", {})
              if identity.get("candidateSha") != sha or not identity.get("editionId") or not identity.get("databaseFingerprint"):
                  raise SystemExit("S14 run identity is incomplete or not exact-SHA bound")
              if data.get("lifecycle", {}).get("finalState") != "archived":
                  raise SystemExit("S14 final evidence does not prove canonical archived state")
              print(f"Release-grade S14 evidence valid for exact candidate {sha}")
          elif outcome == "failure":
              if not partial_path.is_file():
                  raise SystemExit("failed S14 did not emit partial/failure evidence")
              data = json.loads(partial_path.read_text())
              if data.get("candidateSha") != sha:
                  raise SystemExit(f"failure evidence SHA mismatch: {data.get('candidateSha')} != {sha}")
              if data.get("passed") is not False or data.get("partial") is not True or data.get("runtimeFailure") is not True:
                  raise SystemExit("failed S14 evidence must remain passed=false, partial=true, runtimeFailure=true")
              failure_stage = data.get("failureStage")
              failure_phase = data.get("failurePhase")
              if not isinstance(failure_stage, str) or not failure_stage or not isinstance(failure_phase, str) or not failure_phase:
                  raise SystemExit("failed S14 evidence is missing canonical failure diagnostics")
              if failure_phase == "unknown":
                  raise SystemExit(f"failed rehearsal emitted unknown canonical failure phase for {failure_stage}")
              print(f"S14 failure evidence valid for {sha}: failed in {failure_stage} ({failure_phase})")
          else:
              raise SystemExit(f"unexpected rehearsal step outcome: {outcome!r}")
          PY

      - name: Build exact-SHA S15 zero-orphan evidence
        if: steps.rehearsal.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export V3_CANDIDATE_SHA="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          bun run scripts/check-v3-s15-zero-orphan-readiness.ts --require-zero
          bun run scripts/build-v3-s15-zero-orphan-evidence.ts --require-zero
          node - <<'NODE'
          const fs = require("fs");
          const cp = require("child_process");
          const evidence = JSON.parse(fs.readFileSync("v3-release-evidence/s15-zero-orphan.json", "utf8"));
          const sha = cp.execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim().toLowerCase();
          if (evidence.candidateSha !== sha) throw new Error(`S15 candidate mismatch: ${evidence.candidateSha} != ${sha}`);
          if (evidence.zeroOrphans !== true) throw new Error("S15 did not prove zeroOrphans=true");
          if (!Array.isArray(evidence.findings) || evidence.findings.length !== 0) throw new Error("S15 retained orphan findings");
          if ((evidence.schemaVersion ?? 0) < 4) throw new Error("S15 evidence predates physical-ownership proof");
          if (evidence.physicalOwnership?.zeroOwnershipConflicts !== true) throw new Error("S15 physical ownership is not conflict-free");
          NODE

      - name: Upload exact-SHA S14 and S15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-s14-stateful-${{ github.event.pull_request.head.sha || github.sha }}
          path: v3-release-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA Organizer promotion browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-s14-promotion-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/v3-s14-grand-final/
            test-results/v3-s14-grand-final-results/
            playwright-s14-grand-final-summary.json
            playwright-s14-grand-final-results-summary.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true
