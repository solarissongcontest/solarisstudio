name: V3 S14 stateful full-contest rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s14-*.sh"
      - ".github/workflows/v3-s14-full-contest-rehearsal.yml"
      - "scripts/v3-s14-full-contest-spec.ts"
      - "scripts/check-v3-s14-rehearsal-readiness.ts"
      - "src/lib/v3-s14-*.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-stateful-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stateful-rehearsal:
    name: One-state contest lifecycle through implemented S14 stages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V3_RELEASE_EVIDENCE_DIR: v3-release-evidence
      V3_S14_ALLOW_PARTIAL: "1"
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild exact migration chain locally
        run: supabase db reset --local --no-seed

      - name: Run one-state S14 contest lifecycle
        id: rehearsal
        shell: bash
        run: |
          set -euo pipefail
          export V3_CANDIDATE_SHA="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          bash .github/scripts/v3-full-contest-rehearsal.sh

      - name: Validate exact-SHA rehearsal evidence
        if: always()
        shell: bash
        env:
          REHEARSAL_OUTCOME: ${{ steps.rehearsal.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path("v3-release-evidence/s14-full-contest.partial.json")
          if not path.is_file():
              raise SystemExit("missing S14 partial/failure evidence")

          data = json.loads(path.read_text())
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          if data.get("candidateSha") != sha:
              raise SystemExit(f"candidate SHA mismatch: {data.get('candidateSha')} != {sha}")
          if data.get("passed") is not False or data.get("partial") is not True:
              raise SystemExit("S14 non-final evidence must remain passed=false, partial=true")

          outcome = os.environ.get("REHEARSAL_OUTCOME", "")
          expected_completed = [
              "stage-1-setup",
              "stage-2-delegation-onboarding",
              "stage-3-confirmations",
              "stage-4-entries",
              "stage-5-running-orders",
              "stage-6-jury",
              "stage-7-public-voting",
              "stage-8-results",
              "stage-9-publication",
          ]
          expected_pending = ["stage-10-archive"]
          expected_extensions = [
              "grand-final-qualifier-bridge",
              "grand-final-jury",
              "grand-final-televote",
              "grand-final-results",
              "grand-final-publication",
          ]
          required_invariants = {
              "televote-canonical-ballot",
              "result-reproducible",
              "publication-final-version",
              "grand-final-televote-source-parity",
              "grand-final-result-reproducible",
              "grand-final-publication-final-version",
          }

          if outcome == "success":
              if data.get("runtimeFailure") is not False:
                  raise SystemExit("successful rehearsal emitted runtime-failure evidence")
              if data.get("completedStages") != expected_completed:
                  raise SystemExit(f"unexpected completed stages: {data.get('completedStages')}")
              if data.get("pendingStages") != expected_pending:
                  raise SystemExit(f"unexpected pending stages: {data.get('pendingStages')}")
              if data.get("completedContestExtensions") != expected_extensions:
                  raise SystemExit(f"unexpected completed contest extensions: {data.get('completedContestExtensions')}")
              if data.get("pendingContestExtensions") != []:
                  raise SystemExit(f"unexpected pending contest extensions: {data.get('pendingContestExtensions')}")
              invariants = set(data.get("implementedInvariants", []))
              missing_invariants = sorted(required_invariants - invariants)
              if missing_invariants:
                  raise SystemExit(f"successful rehearsal omitted required invariant evidence: {missing_invariants}")
              print(f"S14 partial evidence valid for {sha}: Stages 1-9 and Grand Final extensions complete; Archive pending")
          elif outcome == "failure":
              if data.get("runtimeFailure") is not True:
                  raise SystemExit("failed rehearsal did not emit runtimeFailure=true")
              failure_stage = data.get("failureStage")
              failure_phase = data.get("failurePhase")
              if not isinstance(failure_stage, str) or not failure_stage:
                  raise SystemExit("failed rehearsal evidence is missing failureStage")
              if not isinstance(failure_phase, str) or not failure_phase:
                  raise SystemExit("failed rehearsal evidence is missing failurePhase")
              if failure_phase == "unknown":
                  raise SystemExit(f"failed rehearsal emitted an unknown canonical failure phase for {failure_stage}")
              completed_stages = data.get("completedStages", [])
              completed_extensions = data.get("completedContestExtensions", [])
              pending_stages = data.get("pendingStages", [])
              pending_extensions = data.get("pendingContestExtensions", [])
              if not all(isinstance(items, list) for items in [completed_stages, completed_extensions, pending_stages, pending_extensions]):
                  raise SystemExit("failed rehearsal emitted malformed completion/pending arrays")
              if failure_phase in completed_stages or failure_phase in completed_extensions:
                  raise SystemExit(f"failure phase {failure_phase} was incorrectly marked complete")
              if failure_phase != "bootstrap" and failure_phase not in pending_stages and failure_phase not in pending_extensions:
                  raise SystemExit(f"failure phase {failure_phase} is missing from canonical pending evidence")
              print(f"S14 failure evidence valid for {sha}: failed in {failure_stage} (canonical phase {failure_phase})")
          else:
              raise SystemExit(f"unexpected rehearsal step outcome: {outcome!r}")
          PY

      - name: Upload exact-SHA S14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-s14-stateful-${{ github.event.pull_request.head.sha || github.sha }}
          path: v3-release-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true
