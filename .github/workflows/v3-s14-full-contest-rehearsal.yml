name: V3 S14 stateful full-contest rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s14-*.sh"
      - ".github/scripts/v3-full-contest-rehearsal.sh"
      - ".github/workflows/v3-s14-full-contest-rehearsal.yml"
      - "scripts/v3-s14-full-contest-spec.ts"
      - "scripts/v3-s14-evidence-validator.ts"
      - "scripts/validate-v3-s14-evidence.ts"
      - "scripts/check-v3-s14-rehearsal-readiness.ts"
      - "scripts/check-v3-s15-*.ts"
      - "scripts/build-v3-s15-zero-orphan-evidence.ts"
      - "src/lib/v3-s14-*.test.ts"
      - "src/lib/v3-s15-*.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-stateful-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stateful-rehearsal:
    name: One-state contest lifecycle through Archive + S15 zero-orphan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V3_RELEASE_EVIDENCE_DIR: v3-release-evidence
      V3_S14_ALLOW_PARTIAL: "0"
      V3_S14_REQUIRE_COMPLETE: "1"
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild exact migration chain locally
        run: supabase db reset --local --no-seed

      - name: Verify production isolation before destructive rehearsal
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::Refusing S14 against non-local Supabase API_URL=$API_URL"; exit 1 ;;
          esac
          export VITE_SUPABASE_URL="$API_URL"
          export SUPABASE_URL="$API_URL"
          export E2E_SUPABASE_URL="$API_URL"
          export VITE_CONFIRMATIONS_SUPABASE_URL="$API_URL"
          export CONFIRMATIONS_SUPABASE_URL="$API_URL"
          export DATABASE_URL="$DB_URL"
          export SUPABASE_PROJECT_ID=local
          export SUPABASE_PROJECT_REF=local
          export E2E_SUPABASE_PROJECT_ID=local
          export E2E_SUPABASE_PROJECT_REF=local
          export VITE_SUPABASE_PROJECT_ID=local
          export VITE_SUPABASE_PROJECT_REF=local
          bun run scripts/check-v3-production-isolation.ts

      - name: Run complete one-state S14 contest lifecycle
        id: rehearsal
        shell: bash
        run: |
          set -euo pipefail
          export V3_CANDIDATE_SHA="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          bash .github/scripts/v3-s14-run-with-diagnostics.sh

      - name: Validate exact-SHA S14 evidence
        if: always()
        shell: bash
        env:
          REHEARSAL_OUTCOME: ${{ steps.rehearsal.outcome }}
        run: |
          set -euo pipefail
          final="$V3_RELEASE_EVIDENCE_DIR/s14-full-contest.json"
          partial="$V3_RELEASE_EVIDENCE_DIR/s14-full-contest.partial.json"
          sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"

          if [[ -s "$final" && -s "$partial" ]]; then
            echo "::error::S14 emitted both final and partial evidence for one candidate"
            exit 1
          fi

          case "$REHEARSAL_OUTCOME" in
            success)
              [[ -s "$final" ]] || { echo "::error::successful complete rehearsal did not emit s14-full-contest.json"; exit 1; }
              [[ ! -s "$partial" ]] || { echo "::error::successful complete rehearsal retained partial evidence"; exit 1; }
              bun run scripts/validate-v3-s14-evidence.ts \
                --file "$final" \
                --candidate-sha "$sha" \
                --require-complete
              ;;
            failure)
              [[ -s "$partial" ]] || { echo "::error::failed S14 did not emit partial/failure evidence"; exit 1; }
              [[ ! -s "$final" ]] || { echo "::error::failed S14 manufactured final completion evidence"; exit 1; }
              bun run scripts/validate-v3-s14-evidence.ts \
                --file "$partial" \
                --candidate-sha "$sha"

              failure_stage="$(python3 - "$partial" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              evidence = json.load(handle)
          print(evidence.get("failureStage") or evidence.get("failurePhase") or "")
          PY
          )"
              if [[ "$failure_stage" == "stage-8-results" ]]; then
                diagnostic="$V3_RELEASE_EVIDENCE_DIR/s14-stage8-diagnostic.json"
                [[ -s "$diagnostic" ]] || {
                  echo "::error::Stage 8 failure did not emit s14-stage8-diagnostic.json"
                  exit 1
                }
                python3 - "$diagnostic" "$sha" <<'PY'
          import json
          import sys

          path, expected_sha = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as handle:
              diagnostic = json.load(handle)

          if diagnostic.get("stage") != "stage-8-results":
              raise SystemExit("Stage 8 diagnostic has wrong stage identity")
          if diagnostic.get("candidateSha") != expected_sha:
              raise SystemExit(
                  f"Stage 8 diagnostic candidate mismatch: {diagnostic.get('candidateSha')} != {expected_sha}"
              )
          if not isinstance(diagnostic.get("rehearsalExitCode"), int) or diagnostic["rehearsalExitCode"] == 0:
              raise SystemExit("Stage 8 diagnostic did not preserve the original nonzero rehearsal exit")
          if not diagnostic.get("failedPhase"):
              raise SystemExit("Stage 8 diagnostic did not identify a failed phase")
          if not isinstance(diagnostic.get("error"), dict):
              raise SystemExit("Stage 8 diagnostic did not include an error object")
          PY
              fi
              ;;
            *)
              echo "::error::unexpected rehearsal step outcome: $REHEARSAL_OUTCOME"
              exit 1
              ;;
          esac

      - name: Build exact-SHA S15 zero-orphan evidence
        if: steps.rehearsal.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export V3_CANDIDATE_SHA="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          bun run scripts/check-v3-s15-zero-orphan-readiness.ts --require-zero
          bun run scripts/build-v3-s15-zero-orphan-evidence.ts --require-zero
          node - <<'NODE'
          const fs = require("fs");
          const cp = require("child_process");
          const evidence = JSON.parse(fs.readFileSync("v3-release-evidence/s15-zero-orphan.json", "utf8"));
          const sha = cp.execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim().toLowerCase();
          if (evidence.candidateSha !== sha) throw new Error(`S15 candidate mismatch: ${evidence.candidateSha} != ${sha}`);
          if (evidence.zeroOrphans !== true) throw new Error("S15 did not prove zeroOrphans=true");
          if (!Array.isArray(evidence.findings) || evidence.findings.length !== 0) throw new Error("S15 retained orphan findings");
          if ((evidence.schemaVersion ?? 0) < 4) throw new Error("S15 evidence predates physical-ownership proof");
          if (evidence.physicalOwnership?.zeroOwnershipConflicts !== true) throw new Error("S15 physical ownership is not conflict-free");
          NODE

      - name: Upload exact-SHA S14 and S15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-s14-stateful-${{ github.event.pull_request.head.sha || github.sha }}
          path: v3-release-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true
