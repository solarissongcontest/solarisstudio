name: V3 S10 SLI Snapshot rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s10-sli-snapshot-rehearsal.sh"
      - ".github/workflows/v3-s10-sli-snapshot-rehearsal.yml"
      - "src/lib/v3-s10-sli-snapshot.contract.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s10-sli-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + measured SLI snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain locally
        run: supabase db reset --local --no-seed
      - name: Rehearse measured SLI snapshot
        run: bash .github/scripts/v3-s10-sli-snapshot-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + measured SLI snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s10-sli-main origin/main
      - name: Build current main locally
        run: |
          set -euo pipefail
          cd /tmp/solaris-s10-sli-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply only the S10 feature migration locally
        run: |
          set -euo pipefail
          feature_migration="$GITHUB_WORKSPACE/supabase/migrations/20261016065000_v3_s10_sli_snapshot.sql"
          target="/tmp/solaris-s10-sli-main/supabase/migrations/20261016065000_v3_s10_sli_snapshot.sql"
          if [[ -e "$target" ]]; then
            cmp -s "$feature_migration" "$target" || {
              echo "::error::Current main already has a conflicting S10 migration"
              exit 1
            }
          else
            cp "$feature_migration" "$target"
          fi
          cd /tmp/solaris-s10-sli-main
          supabase migration up --local --include-all
      - name: Rehearse measured SLI snapshot after upgrade
        run: |
          set -euo pipefail
          cd /tmp/solaris-s10-sli-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s10-sli-snapshot-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        run: |
          cd /tmp/solaris-s10-sli-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
