name: PR457 merge probe

on:
  push:
    branches:
      - pr457-merge-probe

permissions:
  contents: read

jobs:
  merge-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout slice 5 probe
        uses: actions/checkout@v4
        with:
          ref: pr457-merge-probe
          fetch-depth: 0
      - name: Build reconciliation bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git branch -f bundle-slice5 b8906650d23244c3561078a433f973157cf08cb9
          git branch -f bundle-main origin/main
          git bundle create pr457-reconcile.bundle bundle-slice5 bundle-main
          git bundle verify pr457-reconcile.bundle
      - name: Upload reconciliation bundle
        uses: actions/upload-artifact@v4
        with:
          name: pr457-reconcile-bundle
          path: pr457-reconcile.bundle
          if-no-files-found: error
          retention-days: 1
