name: V3 S13 foundation local-only recovery rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v3-s13-foundation-local-recovery.yml"
      - "scripts/rehearse-v3-s13-foundation-local.mjs"
      - "docs/v3/recovery-candidates/s13-foundation-local-rehearsal.md"
      - "supabase/migrations/20261019111000_v3_s13_migration_hardening.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s13-foundation-local-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  isolated-foundation:
    name: S13 canonical foundation against disposable LOCAL PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      V3_VERIFICATION_TARGET: local
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PROJECT_REF: local
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "127.0.0.1:54322:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Prevent remote credentials, stale code and hosted traffic
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SHA" ]] || {
            echo "::error::S13 rehearsal source SHA mismatch"
            exit 1
          }
          [[ "$V3_VERIFICATION_TARGET" == local ]] || exit 1
          [[ "$SUPABASE_URL" == "http://127.0.0.1:54321" ]] || exit 1
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL DB_URL                      POSTGRES_URL SUPABASE_DB_URL PGSERVICE PGHOST PGHOSTADDR; do
            if [[ -n "${!key:-}" ]]; then
              echo "::error::$key must be absent from disposable local S13 rehearsal"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Syntax check and disposable PostgreSQL rehearsal
        env:
          SOLARIS_S13_DISPOSABLE_CLUSTER: "YES"
          SOLARIS_LOCAL_DB_PORT: "54322"
          SOLARIS_LOCAL_DB_PASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/rehearse-v3-s13-foundation-local.mjs
          node scripts/rehearse-v3-s13-foundation-local.mjs

      - name: Verify no synthetic S13 cluster state remains
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -w -X -h 127.0.0.1 -p 54322 -U postgres -d postgres             -v ON_ERROR_STOP=1 -Atq             -c "select count(*) from pg_database where datname like 'solaris_v3_s13_%'"             | grep -qx 0
          psql -w -X -h 127.0.0.1 -p 54322 -U postgres -d postgres             -v ON_ERROR_STOP=1 -Atq             -c "select count(*) from pg_roles where rolname in ('anon','authenticated','service_role')"             | grep -qx 0

      - name: Record limitations
        run: |
          echo "Local synthetic S13 source execution only: not hosted-equivalent schema, not a new migration, not release certification."
          echo "No hosted Supabase project, production application rows, credentials or migration history were accessed."
