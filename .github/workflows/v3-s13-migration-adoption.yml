name: V3 S13 Migration Adoption

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s13-migration-adoption-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-adoption:
    name: S13 migration adoption
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Enforce S13 migration adoption
        run: bun run scripts/check-v3-s13-migration-adoption.ts --require-clean
