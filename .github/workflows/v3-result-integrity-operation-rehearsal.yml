name: V3 Result Integrity operation rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "src/integrations/televoting/result-integrity.server.ts"
      - "src/integrations/televoting/result-integrity-replay.server.ts"
      - "src/integrations/televoting/result-integrity.functions.ts"
      - "src/lib/v3-result-integrity-operation.contract.test.ts"
      - "src/lib/v3-result-integrity-replay.contract.test.ts"
      - ".github/scripts/v3-result-integrity-operation-rehearsal.sh"
      - ".github/workflows/v3-result-integrity-operation-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-result-integrity-operation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + governed Result Integrity recompute
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain locally
        run: supabase db reset --local --no-seed
      - name: Rehearse governed Result Integrity operation
        run: bash .github/scripts/v3-result-integrity-operation-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + governed Result Integrity recompute
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-result-integrity-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-result-integrity-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply only the Result Integrity feature migrations locally
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017104500_v3_result_integrity_recompute_operation.sql" \
            /tmp/solaris-result-integrity-main/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017104600_v3_result_integrity_replay_lookup.sql" \
            /tmp/solaris-result-integrity-main/supabase/migrations/
          cd /tmp/solaris-result-integrity-main
          supabase migration up --local --include-all
      - name: Rehearse governed Result Integrity operation after upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-result-integrity-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-result-integrity-operation-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-result-integrity-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
