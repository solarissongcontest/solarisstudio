name: V3 S15 independent ownership and cutover evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s15-zero-orphan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  s15-zero-orphan:
    name: S15 exact-SHA structural ownership and cutover inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V3_RELEASE_EVIDENCE_DIR: v3-release-evidence
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_URL: http://127.0.0.1:54321
      E2E_SUPABASE_URL: http://127.0.0.1:54321
      VITE_CONFIRMATIONS_SUPABASE_URL: http://127.0.0.1:54321
      CONFIRMATIONS_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PROJECT_ID: local
      SUPABASE_PROJECT_REF: local
    steps:
      - name: Checkout exact PR head
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify structural versus release S15 risk classification
        run: node --test scripts/v3-s15-cutover-risk-gate.test.mjs

      # Keep the complete S15 inventory strict and visible. In particular,
      # PUBLIC/ORGANIZER_CUTOVER_UNRESOLVED entries must not be discarded,
      # treated as tested functionality, or silently reclassified as green.
      - name: Produce exact-SHA S15 inventory, including unfinished cutovers
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          export V3_CANDIDATE_SHA="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          bun run scripts/build-v3-s15-zero-orphan-evidence.ts

      - name: Validate exact-SHA S15 inventory and block structural ownership violations
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v3-s15-cutover-risk-gate.mjs v3-release-evidence/s15-zero-orphan.json

      # Explicit release certification remains stricter than merge-time
      # structural validation. No unresolved cutover is waived for a release.
      - name: Enforce full-release S15 zero-orphan contract
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          export V3_CANDIDATE_SHA="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          node scripts/v3-s15-cutover-risk-gate.mjs v3-release-evidence/s15-zero-orphan.json --full-release
          bun run scripts/build-v3-s15-zero-orphan-evidence.ts --require-zero

      - name: Upload exact-SHA S15 evidence, including failed gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-s15-zero-orphan-${{ github.event.pull_request.head.sha || github.sha }}
          path: v3-release-evidence/s15-zero-orphan.json
          if-no-files-found: error
          retention-days: 30
