name: V3 #1872 main unit baseline

on:
  push:
    branches:
      - ops/v3-1872-maintenance-probe

permissions:
  contents: read

jobs:
  unit-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact production main baseline
        uses: actions/checkout@v4
        with:
          ref: 31924b825aeb2dcbae5cf3e5a136350369b5594b
          fetch-depth: 1

      - name: Isolate from hosted Supabase
        shell: bash
        run: |
          {
            echo "VITE_SUPABASE_URL=http://127.0.0.1:54321"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_quality_ci_local_only"
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_PUBLISHABLE_KEY=sb_publishable_quality_ci_local_only"
            echo "SUPABASE_PROJECT_ID=local"
            echo "SUPABASE_PROJECT_REF=local"
            echo "VITE_SUPABASE_PROJECT_ID=local"
            echo "VITE_SUPABASE_PROJECT_REF=local"
            echo "V3_VERIFICATION_TARGET=local"
          } >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run exact main unit suite
        shell: bash
        run: |
          set +e
          bun test 2>&1 | tee main-unit-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload exact main unit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-1872-main-unit-baseline
          path: main-unit-output.txt
          if-no-files-found: error
          retention-days: 1
