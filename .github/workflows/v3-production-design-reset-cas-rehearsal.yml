name: V3 Production Design reset CAS rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*v3_production_design_authority.sql"
      - ".github/scripts/v3-production-design-reset-cas-rehearsal.sh"
      - ".github/workflows/v3-production-design-reset-cas-rehearsal.yml"
      - "src/lib/v3-production-design*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-production-design-reset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reset-source-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start disposable local Supabase and rehearse source drift
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local --no-seed
          bash .github/scripts/v3-production-design-reset-cas-rehearsal.sh
      - name: Stop disposable Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup
