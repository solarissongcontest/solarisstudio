name: V3 Integrity authority Chat 5

on:
  push:
    branches:
      - v3/integrity-authority-chat5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-integrity-authority-chat5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    name: Integrity focused contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Integrity authority contracts
        run: >-
          bun test
          src/lib/v3-integrity-authority.contract.test.ts
          src/lib/v3-integrity-participant-idempotency.contract.test.ts
          src/lib/v3-integrity-authority-runtime-corrections.contract.test.ts
          src/lib/v3-integrity-adjudication-writer-cutover.contract.test.ts
          src/lib/v3-integrity-reporter-response-authority.contract.test.ts
          src/lib/v3-integrity-remaining-case-writers.contract.test.ts
          src/lib/v3-integrity-intake-compatibility.contract.test.ts
          src/lib/v3-s16-integrity-authority-evidence.contract.test.ts

      - name: TypeScript
        run: bun run typecheck

      - name: Lint changed Integrity authority files
        run: >-
          bunx eslint
          src/lib/v3-s16-mutation-authority.ts
          src/lib/v3-integrity-authority.contract.test.ts
          src/lib/v3-integrity-participant-idempotency.contract.test.ts
          src/lib/v3-integrity-authority-runtime-corrections.contract.test.ts
          src/lib/v3-integrity-adjudication-writer-cutover.contract.test.ts
          src/lib/v3-integrity-reporter-response-authority.contract.test.ts
          src/lib/v3-integrity-remaining-case-writers.contract.test.ts
          src/lib/v3-integrity-intake-compatibility.contract.test.ts
          src/lib/v3-s16-integrity-authority-evidence.contract.test.ts

  local-database:
    name: Integrity local Supabase authority
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Start isolated local Supabase
        run: supabase start

      - name: Clean migration replay
        run: supabase db reset --local --no-seed

      - name: Verify migration history
        run: supabase migration list --local

      - name: Prove Integrity runtime authority catalog
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          case "${DB_URL:-}" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@localhost:*) ;;
            *) echo 'Refusing non-local Integrity catalog rehearsal' >&2; exit 1 ;;
          esac
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-authority-catalog.sql

      - name: Run hostile Rules + Integrity rehearsal
        run: bash .github/scripts/run-rules-integrity-security-rehearsal.sh

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup || true
