name: V3 Integrity authority Chat 5

on:
  push:
    branches:
      - v3/integrity-authority-chat5
      - v3/1629-integration-chat8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-integrity-authority-chat5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    name: Integrity focused contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Integrity and Confirmation authority contracts
        run: >-
          bun test
          src/lib/v3-integrity-authority.contract.test.ts
          src/lib/v3-integrity-participant-idempotency.contract.test.ts
          src/lib/v3-integrity-authority-runtime-corrections.contract.test.ts
          src/lib/v3-integrity-adjudication-writer-cutover.contract.test.ts
          src/lib/v3-integrity-reporter-response-authority.contract.test.ts
          src/lib/v3-integrity-remaining-case-writers.contract.test.ts
          src/lib/v3-integrity-intake-compatibility-cutover.contract.test.ts
          src/lib/v3-integrity-s16-authority.contract.test.ts
          src/lib/v3-integrity-residual-writer-authority.contract.test.ts
          src/lib/v3-confirmation-response-delete.test.ts
          src/lib/v3-organizer-confirmation-delete-review.contract.test.ts
          src/lib/confirmations-response-review-route.test.ts
          src/lib/confirmation-canonical-reconciliation.contract.test.ts

      - name: Generate fresh TanStack route tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/routeTree.gen.ts
          bun run build
          test -s src/routeTree.gen.ts

      - name: TypeScript
        run: bun run typecheck

      - name: Regenerate source S16 and require zero shared findings
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/s16-source"
          mkdir -p "$source_dir"
          V3_CANDIDATE_SHA="$GITHUB_SHA" \
          V3_PREFLIGHT_DIR="$source_dir" \
            bun --env-file=/dev/null scripts/check-v3-s16-mutation-authority.ts --static >/dev/null
          node -e '
            const report = require(process.argv[1]);
            const shared = report.findings.filter((finding) => finding.ownerBoundary === "shared");
            const results = report.findings.filter((finding) => finding.ownerBoundary === "results_pr_1400");
            console.log(`S16 source shared=${shared.length} results_owned=${results.length}`);
            if (shared.length !== 0) {
              console.error(JSON.stringify(shared, null, 2));
              process.exit(1);
            }
          ' "$source_dir/s16-mutation-authority.json"

      - name: Upload source S16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmation-delete-source-s16-${{ github.sha }}
          path: ${{ runner.temp }}/s16-source/s16-mutation-authority.json
          if-no-files-found: error

      - name: Lint changed Integrity and Confirmation authority files
        run: >-
          bunx eslint
          src/lib/v3-s16-mutation-authority.ts
          src/lib/v3-integrity-authority.contract.test.ts
          src/lib/v3-integrity-participant-idempotency.contract.test.ts
          src/lib/v3-integrity-authority-runtime-corrections.contract.test.ts
          src/lib/v3-integrity-adjudication-writer-cutover.contract.test.ts
          src/lib/v3-integrity-reporter-response-authority.contract.test.ts
          src/lib/v3-integrity-remaining-case-writers.contract.test.ts
          src/lib/v3-integrity-intake-compatibility-cutover.contract.test.ts
          src/lib/v3-integrity-s16-authority.contract.test.ts
          src/lib/v3-integrity-residual-writer-authority.contract.test.ts
          src/lib/v3-confirmation-response-delete.ts
          src/lib/v3-confirmation-response-delete.test.ts
          src/lib/v3-organizer-confirmation-delete-review.contract.test.ts
          'src/routes/confirmations/admin/responses/$id.tsx'

  local-database:
    name: Integrity clean local Supabase authority
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun for exact-SHA appeal catalog proof
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Start isolated local Supabase
        run: supabase start

      - name: Clean migration replay
        run: supabase db reset --local --no-seed

      - name: Verify migration history
        run: supabase migration list --local

      - name: Prove Confirmation response deletion authority
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          case "${DB_URL:-}" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@localhost:*) ;;
            *) echo 'Refusing non-local Confirmation deletion rehearsal' >&2; exit 1 ;;
          esac
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-confirmation-runtime-state-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-confirmation-requirement-authority.sql

      - name: Prove Integrity runtime authority catalog
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          case "${DB_URL:-}" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@localhost:*) ;;
            *) echo 'Refusing non-local Integrity catalog rehearsal' >&2; exit 1 ;;
          esac
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-authority-catalog.sql

      - name: Prove Integrity evidence boundary and concurrent appeal recovery
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          case "${DB_URL:-}" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@localhost:*) ;;
            *) echo 'Refusing non-local Integrity recovery proof' >&2; exit 1 ;;
          esac
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-evidence-write-boundary.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-register-evidence-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-core-actor-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-combined-delete-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-combined-metadata-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-combined-source-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-combined-create-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-residual-writer-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-appeal-recovery.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-appeal-outcome-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-case-relation-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-appeal-writer-boundary.sql
          bash .github/scripts/v3-integrity-appeal-race-rehearsal.sh
          bun --env-file=/dev/null scripts/collect-v3-s16-catalog-evidence.ts --out="$RUNNER_TEMP/integrity-appeal-catalog.json"
          bun --env-file=/dev/null scripts/check-v3-integrity-appeal-authority.ts --catalog="$RUNNER_TEMP/integrity-appeal-catalog.json" --out="$RUNNER_TEMP/integrity-appeal-authority.json"

      - name: Generate exact-SHA full S16 authority report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s16-preflight" "$RUNNER_TEMP/s16-evidence"
          printf '%s\n' "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" > "$RUNNER_TEMP/migration-count.txt"
          V3_CANDIDATE_SHA="$GITHUB_SHA" \
          V3_PREFLIGHT_DIR="$RUNNER_TEMP/s16-preflight" \
          V3_RELEASE_EVIDENCE_DIR="$RUNNER_TEMP/s16-evidence" \
            bun --env-file=/dev/null scripts/check-v3-s16-mutation-authority.ts --catalog="$RUNNER_TEMP/integrity-appeal-catalog.json"
          node -e '
            const report = require(process.argv[1]);
            const shared = report.findings.filter((finding) => finding.ownerBoundary === "shared");
            const confirmation = shared.filter((finding) => finding.domain === "confirmation");
            const deleteFindings = report.findings.filter((finding) => /admin_confirmation_delete_response|v3_confirmation_response_delete_revision/.test(`${finding.subject ?? ""} ${finding.path ?? ""} ${finding.detail ?? ""}`));
            console.log(`S16 runtime shared=${shared.length} confirmation=${confirmation.length}`);
            if (deleteFindings.length !== 0) {
              console.error(JSON.stringify(deleteFindings, null, 2));
              process.exit(1);
            }
          ' "$RUNNER_TEMP/s16-preflight/s16-mutation-authority.json"

      - name: Run hostile Rules + Integrity rehearsal
        run: bash .github/scripts/run-rules-integrity-security-rehearsal.sh

      - name: Upload exact-SHA authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-appeal-${{ github.job }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/integrity-appeal-*.json
            ${{ runner.temp }}/migration-count.txt
            ${{ runner.temp }}/s16-preflight/**
            ${{ runner.temp }}/s16-evidence/**
          if-no-files-found: ignore

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Integrity upgrade from current main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun for exact-SHA appeal catalog proof
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prepare current main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-integrity-main origin/main
          test -z "$(git -C /tmp/solaris-integrity-main status --porcelain --untracked-files=all)"

      - name: Build current main database locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-integrity-main
          supabase start
          supabase db reset --local --no-seed
          supabase migration list --local

      - name: Apply branch migration delta
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-copy-migration-delta.sh" "$GITHUB_WORKSPACE" /tmp/solaris-integrity-main
          cd /tmp/solaris-integrity-main
          supabase migration up --local --include-all
          supabase migration list --local

      - name: Prove Confirmation response deletion authority after upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-integrity-main
          eval "$(supabase status -o env)"
          case "${DB_URL:-}" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@localhost:*) ;;
            *) echo 'Refusing non-local Confirmation deletion upgrade rehearsal' >&2; exit 1 ;;
          esac
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/.github/tests/v3-confirmation-runtime-state-authority.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/.github/tests/v3-confirmation-requirement-authority.sql"

      - name: Prove upgraded Integrity runtime authority catalog
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-integrity-main
          eval "$(supabase status -o env)"
          case "${DB_URL:-}" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@localhost:*) ;;
            *) echo 'Refusing non-local Integrity upgrade rehearsal' >&2; exit 1 ;;
          esac
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/.github/tests/v3-integrity-authority-catalog.sql"

      - name: Prove Integrity evidence boundary and concurrent appeal recovery after upgrade
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          case "${DB_URL:-}" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@localhost:*) ;;
            *) echo 'Refusing non-local Integrity recovery proof' >&2; exit 1 ;;
          esac
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-evidence-write-boundary.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-register-evidence-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-core-actor-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-combined-delete-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-combined-metadata-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-combined-source-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-combined-create-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-residual-writer-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-appeal-recovery.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-appeal-outcome-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-case-relation-authority.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/tests/v3-integrity-appeal-writer-boundary.sql
          bash .github/scripts/v3-integrity-appeal-race-rehearsal.sh
          bun --env-file=/dev/null scripts/collect-v3-s16-catalog-evidence.ts --out="$RUNNER_TEMP/integrity-appeal-catalog.json"
          bun --env-file=/dev/null scripts/check-v3-integrity-appeal-authority.ts --catalog="$RUNNER_TEMP/integrity-appeal-catalog.json" --out="$RUNNER_TEMP/integrity-appeal-authority.json"

      - name: Run hostile Rules + Integrity rehearsal after upgrade
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/run-rules-integrity-security-rehearsal.sh

      - name: Upload exact-SHA appeal authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-appeal-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/integrity-appeal-*.json
          if-no-files-found: ignore

      - name: Stop isolated Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-integrity-main 2>/dev/null || exit 0
          supabase stop --no-backup || true