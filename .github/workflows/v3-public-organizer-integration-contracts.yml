name: V3 Public Organizer integration contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "vitest.config.*"
      - ".github/workflows/v3-public-organizer-integration-contracts.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "vitest.config.*"
      - ".github/workflows/v3-public-organizer-integration-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-public-organizer-contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-organizer-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified source $EXPECTED_SHA"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run public and organizer integration contracts
        run: |
          bunx vitest run \
            src/lib/v3-organizer-acceptance-test.contract.test.ts \
            src/lib/organizer-auth-authority.contract.test.ts \
            src/lib/organizer-public-notifications.integration.test.ts \
            src/lib/public-launch-wiring.contract.test.ts \
            src/lib/public-participate-status-recovery.contract.test.ts \
            src/lib/public-show-result-spoiler-boundary.contract.test.ts \
            src/lib/browser-e2e-v3-rollout-isolation.contract.test.ts
      - name: Record scope and boundary
        if: always()
        run: |
          {
            echo "## V3 Public/Organizer integration contracts"
            echo ""
            echo "Source: \`$(git rev-parse HEAD)\`"
            echo "Seven existing application contract suites; no production secrets, database, or deployment."
            echo "This job does not certify browser E2E, hosted authorization, S16, or 66-country stateful rehearsal."
          } >> "$GITHUB_STEP_SUMMARY"
