name: V3 S6 notification reconciliation rehearsal

on:
  pull_request:
    branches:
      - main
      - v3/sys-s10-sli-live-stack
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s6-notification-reconciliation-rehearsal.sh"
      - ".github/workflows/v3-s6-notification-reconciliation-rehearsal.yml"
      - "src/lib/v3-s6-notification-reconciliation.contract.test.ts"
      - "src/lib/v3-projection-reconciliation-registry.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s6-notification-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + notification reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain
        run: supabase db reset --local --no-seed
      - name: Rehearse notification reconciliation
        run: bash .github/scripts/v3-s6-notification-reconciliation-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + notification reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s6-notification-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s6-notification-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply feature migration delta
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete "$GITHUB_WORKSPACE/supabase/migrations/" /tmp/solaris-s6-notification-main/supabase/migrations/
          cd /tmp/solaris-s6-notification-main
          supabase migration up --local --include-all
      - name: Rehearse contract after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s6-notification-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s6-notification-reconciliation-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-s6-notification-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
