name: Temporary S14 phase patch

on:
  push:
    branches:
      - v3/sys-s9-s10-observability-review-fix-20261021
    paths:
      - .github/workflows/tmp-v3-s14-phase-patch.yml

permissions:
  contents: write

jobs:
  patch-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: v3/sys-s9-s10-observability-review-fix-20261021

      - name: Add canonical browser-bootstrap failure phase
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/v3-full-contest-rehearsal.sh')
          text = path.read_text()
          old = 'for phase in [*all_stages, *all_extensions, "results-runtime-reconciliation"]:'
          new = 'for phase in [*all_stages, *all_extensions, "grand-final-browser-bootstrap", "results-runtime-reconciliation"]:'
          if old not in text:
              raise SystemExit('expected S14 canonical failure-phase loop not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify shell syntax
        run: bash -n .github/scripts/v3-full-contest-rehearsal.sh

      - name: Commit driver patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/v3-full-contest-rehearsal.sh
          git commit -m "fix: classify S14 browser bootstrap failures"
          git push origin HEAD:v3/sys-s9-s10-observability-review-fix-20261021
