name: V3 Reveal Director lifecycle

on:
  pull_request:
    paths:
      - "supabase/migrations/20261026190500_v3_reveal_director_lifecycle.sql"
      - ".github/scripts/v3-reveal-director-lifecycle-rehearsal.sh"
      - ".github/workflows/v3-reveal-director-lifecycle.yml"
      - "src/lib/results-reveal-lifecycle.ts"
      - "src/lib/results-reveal-lifecycle.test.ts"
      - "src/lib/v3-reveal-director-lifecycle.contract.test.ts"
      - "src/lib/v3-public-reveal-lifecycle.contract.test.ts"
      - "src/lib/v3-live.ts"
      - "src/integrations/v3/live-source.server.ts"
      - "src/components/v3/V3LiveScreen.tsx"
      - "src/routes/_authenticated/admin/results-reveal.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-reveal-director-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    name: Focused reveal contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact worker head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact worker head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || { echo "::error::Expected $expected, checked out $actual"; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate canonical route tree
        run: bun run build

      - name: Verify route tree was generated
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s src/routeTree.gen.ts ]; then
            echo "::error::TanStack Router did not generate src/routeTree.gen.ts"
            exit 1
          fi
          if git ls-files --error-unmatch src/routeTree.gen.ts >/dev/null 2>&1; then
            echo "::error::src/routeTree.gen.ts must remain generated and untracked"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Run focused reveal tests
        run: bunx vitest run src/lib/results-reveal-lifecycle.test.ts src/lib/v3-reveal-director-lifecycle.contract.test.ts src/lib/v3-public-reveal-lifecycle.contract.test.ts

  local-supabase:
    name: Isolated local Supabase reveal rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact worker head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact worker head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || { echo "::error::Expected $expected, checked out $actual"; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild complete migration chain locally
        run: supabase db reset --local --no-seed

      - name: Rehearse governed Reveal Director lifecycle
        run: bash .github/scripts/v3-reveal-director-lifecycle-rehearsal.sh

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true
