name: V3 S14 Televote deadline authority rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s14-televote-deadline-authority-rehearsal.sh"
      - ".github/workflows/v3-s14-televote-deadline-authority-rehearsal.yml"
      - "src/lib/v3-s14-televote-deadline-authority.contract.test.ts"
      - "src/lib/solaris-v6-domain-registry.ts"
      - "src/lib/v3-domain-consequence-registry.ts"
      - "src/lib/contest-events.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s14-televote-deadline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + genuine Televote extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain locally
        run: supabase db reset --local --no-seed
      - name: Rehearse server-authoritative extension
        run: bash .github/scripts/v3-s14-televote-deadline-authority-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + genuine Televote extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install feature dependencies
        run: bun install --frozen-lockfile
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s14-deadline-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-deadline-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply only the feature migration locally
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261017002000_v3_s14_televote_deadline_authority.sql" \
            /tmp/solaris-s14-deadline-main/supabase/migrations/
          cd /tmp/solaris-s14-deadline-main
          supabase migration up --local --include-all
      - name: Rehearse extension after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s14-deadline-main
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s14-televote-deadline-authority-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-s14-deadline-main 2>/dev/null || exit 0
          supabase stop --no-backup || true
