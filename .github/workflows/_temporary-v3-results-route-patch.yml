name: Temporary V3 Results route patch

on:
  push:
    branches:
      - v3/results-root-cutover-main

permissions:
  contents: write

jobs:
  patch-route:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3/results-root-cutover-main
          fetch-depth: 0
      - name: Patch Results route before legacy hooks mount
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/results/index.tsx')
          source = path.read_text()

          import_anchor = 'import { PublicSecondaryLinks } from "@/components/public/PublicSecondaryLinks";\n'
          import_line = 'import { V3ResultsRouteGate } from "@/components/v3/V3ResultsRouteGate";\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('Results route import anchor changed')
          if import_line not in source:
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          component_anchor = '''function ResultsOverviewPage() {\n  const { isAppMode } = useSolarisApp();'''
          replacement = '''function ResultsOverviewPage() {\n  return <V3ResultsRouteGate legacy={<LegacyResultsOverviewPage />} />;\n}\n\nfunction LegacyResultsOverviewPage() {\n  const { isAppMode } = useSolarisApp();'''
          if source.count(component_anchor) != 1:
              raise SystemExit('Results route component anchor changed')
          source = source.replace(component_anchor, replacement, 1)

          path.write_text(source)
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary-v3-results-route-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/results/index.tsx .github/workflows/_temporary-v3-results-route-patch.yml
          git diff --cached --check
          git commit -m 'Gate Results before legacy archive hooks mount'
          git push origin HEAD:v3/results-root-cutover-main
