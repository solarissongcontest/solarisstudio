name: V3 Worker 10 replay-key fix

on:
  push:
    branches:
      - v3/burndown-w10-integration

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[V3-INTEGRATION] Canonical replay-key fix applied') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3/burndown-w10-integration
          fetch-depth: 0

      - name: Replace legacy replay key and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('supabase/migrations/20261026210500_v3_confirmation_edition_binding_operations.sql'),
              Path('supabase/migrations/20261026210600_v3_confirmation_edition_binding_r3_fresh_auth.sql'),
          ]
          old = "v_claim ->> 'replay'"
          new = "v_claim ->> 'replayed'"
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{path}: expected at least one legacy replay-key read, found {count}')
              text = text.replace(old, new)
              if old in text:
                  raise SystemExit(f'{path}: legacy replay-key read remains after replacement')
              if new not in text:
                  raise SystemExit(f'{path}: canonical replay-key read missing after replacement')
              path.write_text(text)
              print(f'{path}: corrected {count} replay-key read(s)')
          PY
          rm .github/workflows/v3-w10-replay-key-fix.yml

      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Solaris V3 Worker 10"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20261026210500_v3_confirmation_edition_binding_operations.sql \
                  supabase/migrations/20261026210600_v3_confirmation_edition_binding_r3_fresh_auth.sql \
                  .github/workflows/v3-w10-replay-key-fix.yml
          git commit -m "[V3-INTEGRATION] Canonical replay-key fix applied"
          git push origin HEAD:v3/burndown-w10-integration
