name: V3 S8 Prediction replay protection rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/v3-s8-prediction-replay-protection-rehearsal.sh"
      - ".github/workflows/v3-s8-prediction-replay-protection-rehearsal.yml"
      - "src/lib/v3-s8-prediction-replay-protection.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s8-prediction-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean replay + prediction retry/resource checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild complete migration chain
        run: supabase db reset --local --no-seed
      - name: Rehearse Prediction protections
        run: bash .github/scripts/v3-s8-prediction-replay-protection-rehearsal.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true

  upgrade-from-main:
    name: Current main upgrade + prediction retry/resource checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare disposable current-main worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git worktree add /tmp/solaris-s8-prediction-main origin/main
      - name: Build current main locally
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s8-prediction-main
          supabase start
          supabase db reset --local --no-seed
      - name: Apply additive feature migration delta
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-copy-migration-delta.sh" "$GITHUB_WORKSPACE" /tmp/solaris-s8-prediction-main
          cd /tmp/solaris-s8-prediction-main
          supabase migration up --local --include-all
      - name: Rehearse protections after current-main upgrade
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/solaris-s8-prediction-main
          bash "$GITHUB_WORKSPACE/.github/scripts/v3-s8-prediction-replay-protection-rehearsal.sh"
      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          cd /tmp/solaris-s8-prediction-main 2>/dev/null || exit 0
          supabase stop --no-backup || true