name: Debug Typecheck

on:
  push:
    branches:
      - feature/beta-informed-fan-discovery

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Capture TypeScript diagnostics
        run: |
          set +e
          bunx tsc --noEmit > typecheck-diagnostics.txt 2>&1
          code=$?
          echo "exit_code=$code" >> typecheck-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck-diagnostics.txt
          retention-days: 1
