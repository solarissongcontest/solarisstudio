name: V3 S15 Public private Activity pagination

on:
  push:
    branches:
      - v3/public-s15-activity-keyset-pagination-20261104

permissions:
  contents: read

concurrency:
  group: v3-s15-activity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activity-private-pagination:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V3_VERIFICATION_TARGET: local
      V3_SEED_TARGET: local
      V3_CLEANUP_TARGET: local
      V3_SERVICE_ROLE_SCOPE: local
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_quality_ci_local_only
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_quality_ci_local_only
      SUPABASE_PROJECT_ID: local
      SUPABASE_PROJECT_REF: local
      VITE_SUPABASE_PROJECT_ID: local
      VITE_SUPABASE_PROJECT_REF: local
      VITE_CONFIRMATIONS_SUPABASE_URL: http://127.0.0.1:54321
      VITE_CONFIRMATIONS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_quality_ci_local_only
      CONFIRMATIONS_SUPABASE_URL: http://127.0.0.1:54321
      CONFIRMATIONS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_quality_ci_local_only
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Refuse hosted Supabase settings
        run: bun run scripts/check-v3-production-isolation.ts
      - name: Validate System-bound Public Activity contracts and cursors
        run: |
          bunx vitest run \
            src/lib/v3-participant-activity.test.ts \
            src/lib/v3-participant-activity.contract.test.ts \
            src/lib/v3-participant-activity-system.contract.test.ts \
            src/lib/v3-s15-participant-activity-paging.contract.test.ts
      - name: Generate TanStack route types from local-only build
        run: |
          rm -f src/routeTree.gen.ts
          bun run build
          test -s src/routeTree.gen.ts
      - name: Typecheck and lint the exact-head implementation
        run: |
          bun run typecheck
          bunx eslint --quiet \
            src/lib/v3-participant-activity.ts \
            src/lib/v3-participant-activity-runtime.ts \
            src/lib/v3-participant-activity.functions.ts \
            src/lib/v3-participant-activity.test.ts \
            src/lib/v3-s15-participant-activity-paging.contract.test.ts \
            src/components/v3/V3ParticipantActivityScreen.tsx \
            src/integrations/v3/participant-activity.server.ts
      - name: Enforce V3 registry integrity
        run: |
          bun run certify:v3-registry
          bun run scripts/check-v3-non-route-capabilities.ts
