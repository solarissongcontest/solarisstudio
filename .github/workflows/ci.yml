name: Quality

on:
  push:
    branches:
      - main
      - merge/confirmations
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Force fresh route generation
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/routeTree.gen.ts
          echo "Removed any local generated route tree."
          echo "The production build must regenerate it from src/routes."

      - name: Production build
        run: bun run build

      - name: Verify route tree was generated
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s src/routeTree.gen.ts ]; then
            echo "::error::TanStack Router did not generate src/routeTree.gen.ts"
            exit 1
          fi
          echo "routeTree.gen.ts generated successfully."

      - name: Verify generated route tree is untracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch src/routeTree.gen.ts >/dev/null 2>&1; then
            echo "::error::src/routeTree.gen.ts must not be committed; it is generated during build."
            exit 1
          fi
          if ! git check-ignore -q src/routeTree.gen.ts; then
            echo "::error::src/routeTree.gen.ts must be ignored."
            exit 1
          fi
          echo "Generated route tree is correctly untracked and ignored."

      - name: TypeScript
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck-diagnostics.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> typecheck-diagnostics.txt
          exit "$code"

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Unit tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Quality summary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Solaris Studio quality run"
            echo
            echo "- Fresh dependency install: completed"
            echo "- Fresh TanStack route generation: verified"
            echo "- Generated route tree: untracked and ignored"
            echo "- Production build: executed"
            echo "- TypeScript: executed"
            echo "- Unit tests: executed"
            echo "- Lint: executed as a blocking quality gate"
          } >> "$GITHUB_STEP_SUMMARY"
