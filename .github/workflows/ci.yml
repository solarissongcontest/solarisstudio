name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Force fresh route generation
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/routeTree.gen.ts
          echo "Removed cached/generated route tree."
          echo "The production build will regenerate it from src/routes."

      - name: Production build
        run: bun run build

      - name: Verify route tree was generated
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s src/routeTree.gen.ts ]; then
            echo "::error::TanStack Router did not generate src/routeTree.gen.ts"
            exit 1
          fi
          echo "routeTree.gen.ts generated successfully."

      - name: Report generated route-tree drift
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::warning::src/routeTree.gen.ts differs from the generated route tree."
            echo "Generated route-tree diff:"
            git --no-pager diff -- src/routeTree.gen.ts || true
            {
              echo "### ⚠️ Generated route tree changed"
              echo
              echo "TanStack Router successfully regenerated \`src/routeTree.gen.ts\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Committed route tree matches a fresh generation."
          fi

      - name: TypeScript
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Lint
        continue-on-error: true
        run: bun run lint

      - name: Probe Lovable Televoting bridge route
        shell: bash
        run: |
          set +e
          URL="https://id-preview--e1848c61-349c-4c53-8d0f-bca7891c1ae9.lovable.app/api/solaris-admin-proxy"
          curl --silent --show-error --location --max-time 20 \
            --dump-header /tmp/bridge-headers \
            --output /tmp/bridge-body \
            --write-out "%{http_code}\n%{url_effective}\n" \
            "$URL" > /tmp/bridge-meta 2> /tmp/bridge-curl-error
          curl_exit=$?
          set -e
          {
            echo "curl_exit=$curl_exit"
            echo "--- meta ---"
            cat /tmp/bridge-meta || true
            echo "--- headers ---"
            cat /tmp/bridge-headers || true
            echo "--- body ---"
            cat /tmp/bridge-body || true
            echo "--- curl error ---"
            cat /tmp/bridge-curl-error || true
          } > /tmp/bridge-diagnostic.txt
          cat /tmp/bridge-diagnostic.txt

      - name: Upload bridge diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: lovable-bridge-diagnostic
          path: /tmp/bridge-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Quality summary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Solaris Studio quality run"
            echo
            echo "- Fresh dependency install: completed"
            echo "- Fresh TanStack route generation: completed during build"
            echo "- Production build: completed before static checks"
            echo "- TypeScript: executed"
            echo "- Unit tests: executed"
            echo "- Lint: executed as non-blocking"
          } >> "$GITHUB_STEP_SUMMARY"
