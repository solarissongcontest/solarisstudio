name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-lock-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Generate repository-owned Playwright dependency graph
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            if bun add --dev --exact @playwright/test@1.55.0 --network-concurrency 4; then
              installed=1
              break
            fi
            sleep $((attempt * 8))
          done
          if [ "$installed" -ne 1 ]; then
            echo "Unable to resolve @playwright/test@1.55.0 after three bounded attempts."
            exit 1
          fi
          rm -rf node_modules
          bun install --frozen-lockfile
          test "$(bunx playwright --version)" = "Version 1.55.0"

      - name: Upload Bun-generated dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: v3-navbar-playwright-lock
          path: |
            package.json
            bun.lock
          if-no-files-found: error
          retention-days: 1
