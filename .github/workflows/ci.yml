name: Quality

on:
  push:
    branches: [v3/navbar-complete-redesign]

permissions:
  contents: write

concurrency:
  group: quality-lock-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout navbar branch with history
        uses: actions/checkout@v4
        with:
          ref: v3/navbar-complete-redesign
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Generate repository-owned Playwright dependency graph
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            if bun add --dev --exact @playwright/test@1.55.0 --network-concurrency 4; then
              installed=1
              break
            fi
            sleep $((attempt * 8))
          done
          if [ "$installed" -ne 1 ]; then
            echo "Unable to resolve @playwright/test@1.55.0 after three bounded attempts."
            exit 1
          fi

          rm -rf node_modules
          bun install --frozen-lockfile
          test "$(bunx playwright --version)" = "Version 1.55.0"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git diff --cached --check
          git commit -m '[V3-NAV] Lock Playwright runner in repository dependencies'
          git push origin HEAD:v3/navbar-complete-redesign
