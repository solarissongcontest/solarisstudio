name: V3 Televote influence runtime access

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/scripts/sql/televote-influence-runtime-access.sql'
      - '.github/scripts/prepare-influence-local-config.py'
      - '.github/workflows/v3-televote-influence-runtime-access.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: influence-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Influence ACL (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [clean-replay, current-main-upgrade]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Prepare isolated migration chain
        shell: bash
        env:
          REHEARSAL_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [[ "$REHEARSAL_MODE" == 'current-main-upgrade' ]]; then
            git fetch origin main --no-tags
            git worktree add /tmp/influence-main origin/main
            cd /tmp/influence-main
          fi
          python "$GITHUB_WORKSPACE/.github/scripts/prepare-influence-local-config.py" supabase/config.toml
          supabase start
          eval "$(supabase status -o env)"
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*|http://\[::1\]:*) ;;
            *) echo 'Refusing non-local Supabase API' >&2; exit 1 ;;
          esac
          case "$DB_URL" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*) ;;
            *) echo 'Refusing non-local database' >&2; exit 1 ;;
          esac
          supabase db reset --local --no-seed
          if [[ "$REHEARSAL_MODE" == 'current-main-upgrade' ]]; then
            cp "$GITHUB_WORKSPACE/supabase/migrations/20261024215651_v3_televote_influence_runtime_access.sql" supabase/migrations/
            supabase migration up --local
          fi
      - name: Verify real role access and public denial
        shell: bash
        env:
          REHEARSAL_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [[ "$REHEARSAL_MODE" == 'current-main-upgrade' ]]; then cd /tmp/influence-main; fi
          eval "$(supabase status -o env)"
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*|http://\[::1\]:*) ;;
            *) echo 'Refusing non-local Supabase API' >&2; exit 1 ;;
          esac
          case "$DB_URL" in
            postgres://postgres:postgres@127.0.0.1:*|postgresql://postgres:postgres@127.0.0.1:*) ;;
            *) echo 'Refusing non-local database' >&2; exit 1 ;;
          esac
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/.github/scripts/sql/televote-influence-runtime-access.sql"
      - name: Stop isolated stack
        if: always()
        shell: bash
        env:
          REHEARSAL_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$REHEARSAL_MODE" == 'current-main-upgrade' ]]; then cd /tmp/influence-main 2>/dev/null || exit 0; fi
          supabase stop --no-backup || true
